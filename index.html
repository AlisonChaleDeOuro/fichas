<style>
/* Layout: barra lateral escura (madeira) + área de trabalho clara; no celular vira barra superior + abas no rodapé */
:root{
  --bg:#F6F4F1; --surface:#FFFFFF; --sunken:#F1EDE8; --ink:#1E1915; --muted:#756C64; --faint:#A0968D; --line:#E6E0D9; --line2:#D8D0C7;
  --side:#2A1C12; --side2:#3A2819; --side-ink:#EFE2CB; --side-muted:#B59F84; --gold:#D29A38;
  --accent:#9A5D14; --accent-ink:#FFFFFF; --accent-soft:#F6ECDD;
  --ok:#2C7A47; --ok-soft:#E3F1E7; --warn:#A3620B; --warn-soft:#FBEEDA; --bad:#B42318; --bad-soft:#FBE3E0;
  --s-cmu:#9A5D14; --s-var:#DDA94F; --s-fix:#A8998A; --s-luc:#2C7A47;
  --shadow:0 1px 2px rgba(30,25,21,.05),0 1px 1px rgba(30,25,21,.03);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110F; --surface:#1D1916; --sunken:#24201C; --ink:#EFEAE4; --muted:#A99F96; --faint:#7D746C; --line:#2F2925; --line2:#3D3530;
  --side:#110C08; --side2:#1E150E; --side-ink:#EFE2CB; --side-muted:#A08B72; --gold:#E1AE52;
  --accent:#E1AE52; --accent-ink:#1A1208; --accent-soft:#33281A;
  --ok:#73C58E; --ok-soft:#18301F; --warn:#E8B25E; --warn-soft:#382A14; --bad:#F2877C; --bad-soft:#3B1D1A;
  --s-cmu:#C98A35; --s-var:#E6BD6E; --s-fix:#7E7165; --s-luc:#5FB47C; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110F; --surface:#1D1916; --sunken:#24201C; --ink:#EFEAE4; --muted:#A99F96; --faint:#7D746C; --line:#2F2925; --line2:#3D3530;
  --side:#110C08; --side2:#1E150E; --side-ink:#EFE2CB; --side-muted:#A08B72; --gold:#E1AE52;
  --accent:#E1AE52; --accent-ink:#1A1208; --accent-soft:#33281A;
  --ok:#73C58E; --ok-soft:#18301F; --warn:#E8B25E; --warn-soft:#382A14; --bad:#F2877C; --bad-soft:#3B1D1A;
  --s-cmu:#C98A35; --s-var:#E6BD6E; --s-fix:#7E7165; --s-luc:#5FB47C; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;border-bottom:1px solid var(--side2)}
.brand img{width:44px;height:44px;border-radius:9px;object-fit:cover;box-shadow:0 0 0 1px rgba(210,154,56,.6)}
.brand b{display:block;font:700 18px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--side-muted)}
.negsw{display:grid;grid-template-columns:.8fr 1.1fr 1fr;gap:4px;background:var(--side2);border-radius:10px;padding:4px;margin-top:16px}
.negsw button{border:0;background:none;color:var(--side-muted);font-weight:700;font-size:12.5px;padding:7px 4px;border-radius:7px;cursor:pointer}
.negsw button[aria-pressed="true"]{background:var(--gold);color:#22160C}
.nav{display:grid;gap:2px;margin-top:12px}
.navgrp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);opacity:.75;padding:14px 12px 6px;display:flex;align-items:center;gap:8px}
.navgrp:first-child{padding-top:4px}
.navgrp::after{content:"";flex:1;height:1px;background:var(--side2)}
.nav .grpsw,.mbk,#mbk{display:none!important}
.phead .area{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.area.prod{background:var(--accent-soft);color:var(--accent)} .area.fin{background:var(--ok-soft);color:var(--ok)}
table.dre td:first-child{white-space:normal;min-width:220px}
table.dre tr.res td{font-weight:700;background:var(--accent-soft);font-size:15px}
table.dre tr.sub td{color:var(--muted);font-size:13px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-muted);padding:10px 12px;border-radius:9px;font-weight:600;cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--side2);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side2);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--side2);font-size:12px;color:var(--side-muted);display:grid;gap:6px}
.side .foot .who{color:var(--side-ink);font-weight:600;word-break:break-all}
.side .foot button{justify-self:start;background:none;border:1px solid var(--side2);color:var(--side-ink);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.busy{background:var(--gold)} .dot.err{background:var(--bad)}

main{min-width:0;padding:28px 32px 64px}
.page{max-width:1160px;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.phead p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* ---------- elements ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.card-h .sub{font-size:13px;color:var(--muted)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:4px}
.kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;transition:border-color .12s}
.in:hover{border-color:var(--faint)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.num{text-align:right}
.in[disabled]{background:transparent;border-color:transparent}
select.in{appearance:auto;padding-right:6px}
.field{display:grid;gap:5px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;color:var(--faint);width:30px;height:30px;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn.armed{background:var(--bad);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .neg{color:var(--bad)} .pos{color:var(--ok)} .b{font-weight:700}
.note{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0;background:var(--sunken)}
td.name{white-space:normal;min-width:150px}
td.name small{color:var(--faint);margin-left:4px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
td .in{padding:6px 8px}
.mbar{position:relative;height:6px;border-radius:9px;background:var(--sunken);width:90px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:visible}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--ok)}
.mbar i.warn{background:var(--warn)} .mbar i.bad{background:var(--bad)}
.mbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

/* painel */
.metabox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.metabox .in{width:64px;padding:5px 8px}

/* fichas */
.fwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.flist{position:sticky;top:20px;padding:10px}
.flist .search{margin-bottom:8px}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.fitem:hover{background:var(--sunken)}
.fitem[aria-current="true"]{background:var(--accent-soft)}
.fitem b{font-weight:600;font-size:14px;display:block}
.fitem small{color:var(--muted);font-size:12px}
.fitem .pct{font-size:12px;font-weight:700}
.fchips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fhead{padding:18px 20px;display:grid;gap:14px}
.fhead .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ftitle{min-width:0;flex:1 1 280px}
.fhead .nameIn{width:100%;font-size:22px;font-weight:700;border-color:transparent;padding:4px 8px;margin-left:-8px;max-width:420px}
.fhead .nameIn:hover{border-color:var(--line2)}
.fhead .meta{display:grid;grid-template-columns:repeat(5,minmax(0,150px));gap:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.metric{padding:14px 20px;border-right:1px solid var(--line);min-width:0}
.metric:last-child{border-right:0}
.metric .l{font-size:12px;color:var(--muted);font-weight:600}
.metric .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.metric .h{font-size:12.5px;color:var(--muted)}
.metric.hl{background:var(--ok-soft)} .metric.hl .v{color:var(--ok)}
.metric.hl.bad{background:var(--bad-soft)} .metric.hl.bad .v{color:var(--bad)}
.stack{padding:16px 20px 18px;border-top:1px solid var(--line)}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.sbar span{display:block;height:100%}
.slegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.slegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600;margin:0}
.dl dd{margin:2px 0 0;font-weight:700;font-size:15px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.addrow select{max-width:280px}

/* caixa */
.mesnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.mesnav .in{width:170px;border-color:transparent;padding:6px 8px}
.mesnav .btn{font-size:20px;line-height:1;padding:4px 12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.kbad{background:var(--bad-soft)}
.v.pos,.pos{color:var(--ok)} .warnc{color:var(--warn)} .faint{color:var(--faint)}
.pill.neutral{background:var(--sunken);color:var(--muted)}
.lform{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.lform .btn{height:38px;justify-content:center}
.stbtn{border:1px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.stbtn.prev{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.stbtn.venc{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bpair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bpair span{width:40%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.ba{background:var(--ok)} .bb{background:var(--s-cmu)}
.bcol small{font-size:11.5px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 12px;vertical-align:-1px}
.lg.a{background:var(--ok)} .lg.b{background:var(--s-cmu)}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
table.dfc tr.grp td{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:14px;border-bottom:1px solid var(--line2)}
table.dfc tr.grp.in td{color:var(--ok)} table.dfc tr.grp.out td{color:var(--s-cmu)}
table.dfc tr.tot td{font-weight:700;background:var(--sunken)}
table.dfc tr.sec td{font-weight:700;background:var(--accent-soft)}
table.dfc tr.fim td{font-size:15px;border-top:2px solid var(--line2)}

@media (max-width:600px){.lform{grid-template-columns:1fr 1fr}.lform .grow{grid-column:1/-1}.lform .btn{grid-column:1/-1}.kpis.k3{grid-template-columns:1fr}.mesnav .in{width:140px}}

.vtab td{vertical-align:middle}.vtab input::placeholder{color:var(--faint);font-style:italic}.vtab tr.tot td{background:var(--sunken)}
.pbar{height:10px;background:var(--sunken);border-radius:6px;overflow:hidden}.pbar>div{height:100%;border-radius:6px}
.big{font-size:24px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}.sm{font-size:12px}.muted.sm{margin-top:2px}
@media (max-width:860px){.nav{display:flex!important;overflow-x:auto;scrollbar-width:none;gap:2px}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 76px}}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hk{padding:20px 22px}.hk .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.hk .v{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px;line-height:1.1}.hk .h{font-size:13.5px;color:var(--muted);margin-top:8px}.hk .h b{color:var(--ink)}.hk .h b.pos{color:var(--ok)}.hk .h b.neg{color:var(--bad)}
.gcard{margin-bottom:16px}.gsvg{width:100%;height:auto;display:block;overflow:visible}
.leg{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{display:inline-block;width:14px;height:8px;border-radius:2px}.leg i.dash{height:0;border-top:2px dashed;border-radius:0;width:16px}
.hbars{display:grid;gap:10px}.hb{display:grid;grid-template-columns:170px 1fr 170px;gap:12px;align-items:center}.hb-l{font-weight:700;font-size:14px}.hb-t{height:18px;background:var(--sunken);border-radius:5px;overflow:hidden}.hb-t>div{height:100%;background:var(--ok);border-radius:5px}.hb-v{font-size:13px;text-align:right}.hb-v span{display:block;color:var(--muted);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-bottom:16px}.strip>div{padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}.strip>div:last-child{border-right:0}.strip .l{font-size:12px;color:var(--muted)}.strip b{font-size:18px}.strip a{font-size:12px}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hk .v{font-size:32px}.hb{grid-template-columns:1fr;gap:4px}.hb-v{text-align:left}.hb-v span{display:inline;margin-left:6px}.strip{grid-template-columns:1fr}.strip>div{border-right:0;border-bottom:1px solid var(--line)}}
.gsvg text{pointer-events:none}.hit{fill:transparent;cursor:crosshair}.hit:hover{fill:var(--ink);fill-opacity:.05}.hb{cursor:default;border-radius:6px;padding:2px 4px;margin:-2px -4px}.hb:hover{background:var(--sunken)}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:260px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
@media print{@page{margin:14mm}.side,.nav,.phead,.noprint,#tip,.toast{display:none!important}.shell{display:block!important}main{padding:0!important}body,.card{background:#fff!important;box-shadow:none!important}.card{border:1px solid #ccc!important}.printonly{display:block!important}}
.printonly{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* painel gerencial: escuro premium */
body.dk,body.dk .shell{background:#0E0C0A}

/* ===== v27: claro e elegante · creme e dourado ===== */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#F7F1E7; --surface:#FFFDF9; --sunken:#F1E9DC; --ink:#2B2118; --muted:#7D6E5F; --faint:#B0A190; --line:#E8DDCC; --line2:#DCCDB6;
  --side:#FBF6EE; --side2:#EFE4D2; --side-ink:#2B2118; --side-muted:#8A7A68; --gold:#B8862F;
  --accent:#9C6B1F; --accent-ink:#fff; --accent-soft:#F4E7CF;
  --ok:#2F7A4C; --ok-soft:#E3F0E6; --warn:#9A6212; --warn-soft:#FBEED7; --bad:#B23A2B; --bad-soft:#F8E2DD;
  --s-cmu:#A9722A; --s-var:#D9AE62; --s-fix:#A8998A; --s-luc:#2F7A4C;
  --shadow:0 1px 0 rgba(43,33,24,.03),0 10px 30px -18px rgba(75,52,22,.22);
  --display:"Fraunces",Georgia,"Times New Roman",serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#F7F1E7; --surface:#FFFDF9; --sunken:#F1E9DC; --ink:#2B2118; --muted:#7D6E5F; --faint:#B0A190; --line:#E8DDCC; --line2:#DCCDB6;
  --side:#FBF6EE; --side2:#EFE4D2; --side-ink:#2B2118; --side-muted:#8A7A68; --gold:#B8862F; --accent:#9C6B1F; --accent-soft:#F4E7CF;
  --ok:#2F7A4C; --ok-soft:#E3F0E6; --warn:#9A6212; --warn-soft:#FBEED7; --bad:#B23A2B; --bad-soft:#F8E2DD; color-scheme:light}}
body{background:radial-gradient(1400px 700px at 100% -10%,#F3E5C8 0,transparent 55%),var(--bg)!important;letter-spacing:.003em}
.side{background:var(--side);border-right:1px solid var(--line);color:var(--side-ink)}
.brand{border-bottom:1px solid var(--line)}.brand b{font:700 19px/1.05 var(--display);text-transform:none;letter-spacing:0;color:var(--ink)}.brand span{color:var(--side-muted)}
.brand img{box-shadow:0 0 0 1px var(--line2),0 6px 14px -6px rgba(120,80,20,.45)}
.nav{gap:4px;margin-top:20px}
.nav button{color:var(--side-muted);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14.5px}
.nav button:hover{background:var(--side2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:#FFF8EC;box-shadow:0 8px 18px -10px rgba(43,33,24,.6)}
.nav button[aria-current="page"] svg{color:#E2B565}
.side .foot{border-top:1px solid var(--line);color:var(--side-muted)}.side .foot .who{color:var(--ink)}.side .foot button{border-color:var(--line2);color:var(--ink)}
.subnav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:max-content;max-width:100%}
#subnav{padding:0 32px}
.subnav .sn-t{font:600 15px var(--display);padding:0 12px 0 8px;color:var(--ink)}
.subnav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.subnav button:hover{background:var(--sunken);color:var(--ink)}.subnav button.on{background:var(--accent-soft);color:var(--accent)}
.phead h1{font:600 34px/1.12 var(--display);letter-spacing:-.01em}
.phead p{font-size:15px;color:var(--muted);max-width:720px}
.area,.area.prod{background:transparent!important;color:var(--gold)!important;padding:0!important;font-weight:700;letter-spacing:.16em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

.hk .l,.kpi .l{letter-spacing:.12em}
table th{background:var(--sunken);color:var(--muted)}table td{border-color:var(--line)}
.btn{border-radius:11px}.btn.primary{background:var(--ink);border-color:var(--ink);color:#FFF8EC}.btn.primary:hover{filter:brightness(1.2)}

.ctab.on{color:#fff}.ctab.on i{background:#fff}
.pbar>div{background:linear-gradient(90deg,#B8862F,#E2B565)!important}
.mesnav{background:var(--surface);border-color:var(--line);border-radius:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#FFF8EC}

/* ---------- história do mês ---------- */
.story{min-height:62vh;display:flex;align-items:center;padding:40px 0;border-top:1px solid var(--line)}
.story.capa{min-height:56vh;border-top:0}
.st-in{width:100%;max-width:980px;opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.story.vis .st-in{opacity:1;transform:none}
.st-k{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px}
.st-k span{font:600 15px var(--display);letter-spacing:0;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.st-big{font:600 clamp(48px,7vw,92px)/1.02 var(--display);letter-spacing:-.02em;margin:14px 0 10px;color:var(--ink)}
.st-big.xl{font-size:clamp(60px,9vw,120px)}.st-big.pos{color:var(--ok)}.st-big.neg{color:var(--bad)}
.st-f{font-size:19px;line-height:1.55;color:var(--muted);max-width:760px;margin:0 0 26px}.st-f b{color:var(--ink)}.st-f b.pos{color:var(--ok)}.st-f b.neg{color:var(--bad)}
.st-scroll{margin-top:36px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);animation:stb 2s ease-in-out infinite}
@keyframes stb{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.vbar.big{height:56px;border-radius:14px}
.st-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.st-trio span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.st-trio span::before{content:'';width:12px;height:12px;border-radius:4px;background:var(--c)}.st-trio b{display:block;font:600 30px var(--display);margin-top:4px}
.sbl{display:grid;gap:12px;max-width:820px}.sbr{display:grid;grid-template-columns:280px 1fr 130px;gap:16px;align-items:center;font-size:15px}.sbr span{color:var(--ink);font-weight:600}.sbr>div{height:14px;background:var(--sunken);border-radius:8px;overflow:hidden}.sbr i{display:block;height:100%;border-radius:8px}.sbr b{text-align:right;font-family:var(--display);font-size:18px;font-weight:600}
.st-cent{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stc{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}.stc:hover{transform:translateY(-3px)}.stc span{font-weight:700}.stc b{font:600 28px var(--display)}.stc small{color:var(--muted)}
.pe-bar{position:relative;height:22px;background:var(--sunken);border-radius:12px;max-width:820px;margin-top:30px}.pe-fill{height:100%;border-radius:12px;transition:width 1.2s ease}.pe-fill.ok{background:linear-gradient(90deg,#2F7A4C,#6CBF8B)}.pe-fill.no{background:linear-gradient(90deg,#B23A2B,#E08A7C)}
.pe-mark{position:absolute;top:-10px;bottom:-10px;width:3px;background:var(--ink);border-radius:2px}.pe-mark span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.pe-leg{display:flex;justify-content:space-between;max-width:820px;margin-top:8px;color:var(--muted);font-size:13px}
.st-cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.st-cmp>div{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.st-cmp span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.st-cmp b{font-size:15px}
.st-next{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}.st-next a{display:flex;flex-direction:column;gap:4px;padding:22px 24px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}.st-next a:hover{transform:translateY(-3px);border-color:var(--gold)}.st-next b{font:600 21px var(--display)}.st-next span{color:var(--muted)}
.st-dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:grid;gap:12px;z-index:15}.st-dots a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}.st-dots a span{opacity:0;transition:opacity .2s;background:var(--surface);padding:2px 8px;border-radius:6px}.st-dots a:hover span,.st-dots a.on span{opacity:1}.st-dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);transition:all .2s}.st-dots a.on i{background:var(--gold);border-color:var(--gold);transform:scale(1.3)}
@media (max-width:1100px){.st-dots{display:none}}
@media (max-width:860px){#subnav{padding:0 16px}.st-trio,.st-cent,.st-cmp,.st-next{grid-template-columns:1fr 1fr}.sbr{grid-template-columns:1fr 100px}.sbr>div{grid-column:1/3;order:3}.story{min-height:auto;padding:36px 0}.phead h1{font-size:26px}
  .nav{background:var(--surface)!important;border-top:1px solid var(--line)!important}.nav button{flex:1 0 64px!important;font-size:10.5px;padding:6px 2px;flex-direction:column}.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:none}.nav button[aria-current="page"] svg{color:var(--accent)}.subnav{width:100%;overflow-x:auto;flex-wrap:nowrap}.subnav button{white-space:nowrap}}
.st-big.md{font-size:clamp(34px,4vw,52px)}
#subnav{max-width:1160px;margin:0 auto;padding:0}
.vc-v.neg{color:var(--bad)!important}
.ctab.on{color:#FFF8EC!important}
@media (prefers-reduced-motion:reduce){.st-in{opacity:1!important;transform:none!important;transition:none}}
</style>
</head>

const CUSTOS_ORIGINAIS=[

const dIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dNew=s=>new Date(s+'T12:00:00');
const diasDoMes=m=>{ const [y,mm]=m.split('-').map(Number); const n=new Date(y,mm,0).getDate(); return Array.from({length:n},(_,i)=>m+'-'+String(i+1).padStart(2,'0')); };

// ---------- import do relatório Sischef ----------
function carregarXLSX(){ return new Promise((ok,err)=>{ if(window.XLSX) return ok(window.XLSX); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>ok(window.XLSX); s.onerror=()=>err(new Error('Não foi possível carregar o leitor de planilhas. Verifique a internet.')); document.head.appendChild(s); }); }
const numBR=v=>{ if(typeof v==='number') return v; const s=String(v??'').trim(); if(!s) return 0; const t=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s; const n=parseFloat(t); return isFinite(n)?n:0; };
function dataBRtoIso(v){ if(v instanceof Date) return dIso(v); if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return dIso(new Date(d.getTime()+d.getTimezoneOffset()*6e4)); } const m=String(v||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }
async function importarSischef(file){
  try{
    const X=await carregarXLSX(); const buf=await file.arrayBuffer(); const wb=X.read(buf,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=X.utils.sheet_to_json(ws,{defval:'',raw:true});
    if(!rows.length||!('Produto' in rows[0])||!('Qtde' in rows[0])||!('Total' in rows[0])) throw new Error('Este arquivo não parece o relatório de Pedidos de Venda do Sischef.');
    const porMes={}; let n=0, novosV=new Set();
    for(const r of rows){
      const nome=String(r['Produto']||'').trim(), grupo=String(r['Grupo']||'').trim(), N_=semAc(nome), G=semAc(grupo);
      const d=dataBRtoIso(r['Data pedido']); if(!d) continue;
      const qtd=numBR(r['Qtde']), unit=numBR(r['Unitario']), desc=numBR(r['Desconto']), liq=numBR(r['Total']);
      const v=String(r['Garçom']||r['Garcom']||'').trim();
      const l={id:'s'+(r['ID Pedido']||'')+'-'+n,o:'sischef',d,v,cli:String(r['Pessoa']||'').trim(),nome,grupo,qtd,unit,bruto:Math.round(qtd*unit*100)/100,desc,liq};
      (porMes[d.slice(0,7)]=porMes[d.slice(0,7)]||[]).push(l); n++;
      if(v&&!vendedorDe(v)) novosV.add(v);
    }
    if(!n) throw new Error('Nenhuma venda encontrada no arquivo.');
    for(const [m,arr] of Object.entries(porMes)){ S.vend={...S.vend,[m]:[...vLinhas(m).filter(x=>x.o!=='sischef'),...arr]}; saveVend(m); }
    if(novosV.size){ setCfg('vendedores',[...vendedores(),...[...novosV].map((nm,i)=>({id:'v'+Date.now()+i,nome:nm,pct:0.02,aliases:[],ativo:true}))]); }
    const ms=Object.keys(porMes).sort(); S.mes=ms[ms.length-1];
    const ds=Object.values(porMes).flat().map(x=>x.d).sort();
    setCfg('ultimaImport',{arquivo:file.name,em:new Date().toISOString(),de:ds[0],ate:ds[ds.length-1],linhas:n});
    toast(`${n} linhas importadas (${ms.map(mesCurto).join(', ')})${novosV.size?` · ${novosV.size} vendedor(es) cadastrado(s)`:''}`);
    render();
  }catch(e){ toast(e.message||'Não foi possível ler o arquivo.'); }
}

// ---------- ponto de equilíbrio: previsão ----------
function previsaoPE(m){
  const fixos=+cfgV().fixosMes||0, T=resumoVend(m), ds=diasDoMes(m), t=hoje();
  let acum=0, atingido=null; const serie=[];
  for(const d of ds){ const x=T.dias.find(y=>y.d===d); acum+=x?x.mc:0; serie.push({d,acum,liq:x?x.liq:0,mc:x?x.mc:0}); if(!atingido&&fixos>0&&acum>=fixos) atingido=d; }
  const ultimo=T.dias.length?T.dias[T.dias.length-1].d:null;
  const corte=m===t.slice(0,7)?t:(m<t.slice(0,7)?ds[ds.length-1]:null); // até onde o mês já passou
  const passados=corte?ds.filter(d=>d<=corte&&util(d)).length:0, totalU=ds.filter(util).length;
  const ritmoMC=passados?T.mc/passados:0, ritmoLiq=passados?T.liq/passados:0;
  let prev=null;
  if(!atingido&&ritmoMC>0&&corte){ let falta=fixos-T.mc, d=dNew(corte); let guard=0; while(falta>0&&guard<400){ d.setDate(d.getDate()+1); if(d.getDay()!==0) falta-=ritmoMC; guard++; } prev=dIso(d); }
  const projLiq=ritmoLiq*totalU, projMC=ritmoMC*totalU;
  return {fixos,T,serie,atingido,prev,passados,totalU,ritmoMC,ritmoLiq,projLiq,projMC,projLucro:projMC-fixos,corte,ultimo};
}

(function(){ const t=document.createElement('div'); t.id='tip'; document.body.appendChild(t); let cur=null;
  const show=(el,x,y)=>{ cur=el; t.innerHTML=el.getAttribute('data-tip'); t.classList.add('on'); const w=t.offsetWidth,h=t.offsetHeight; let L=x+14,T=y+14; if(L+w>innerWidth-8) L=x-w-14; if(T+h>innerHeight-8) T=y-h-14; t.style.left=Math.max(8,L)+'px'; t.style.top=Math.max(8,T)+'px'; };
  const hide=()=>{ cur=null; t.classList.remove('on'); };
  document.addEventListener('mousemove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el) show(el,e.clientX,e.clientY); else if(cur) hide(); });
  document.addEventListener('touchstart',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ const p=e.touches[0]; show(el,p.clientX,p.clientY); } else hide(); },{passive:true});

})();

const chaveNome=n=>semAc(n).trim().split(/\s+/)[0]||'';
function comissaoGeral(m){

}

}

const BASES=[
  {id:'vendas',tit:'BASE VENDAS',rel:'Pedidos de Venda',arq:'pedidos_de_venda_DDMMAAAA.xls',para:'Receita de cada centro, comissões e bônus.'},
  {id:'compras',tit:'BASE COMPRAS',rel:'Pedidos de Compra',arq:'Pedidos_de_Compra.xls',para:'Custo da mercadoria: carne, ração, tripa, temperos, embalagens.'},
  {id:'apagar',tit:'BASE A PAGAR',rel:'Contas a Receber/Pagar (tipo: Contas a pagar, pagas e não pagas)',arq:'Contas_receber_pagar_DDMMAAAA.xls',para:'Despesas: folha, energia, combustível, serviços, impostos.'}];
function tipoRel(row){ const k=Object.keys(row||{});
  if(k.includes('Data pedido')&&k.includes('Produto')&&k.includes('Total')) return 'vendas';
  if(k.includes('Fornecedor')&&k.includes('Grupo')&&k.includes('ID Pedido')) return 'compras';
  if(k.includes('situacao')&&k.includes('data vencimento')&&k.includes('operacao')) return 'apagar';
  return null; }
async function importarBase(file,esperado){
  try{
    const X=await carregarXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=X.utils.sheet_to_json(ws,{defval:'',raw:true}); if(!rows.length) throw new Error('O arquivo está vazio.');
    const tipo=tipoRel(rows[0]); if(!tipo) throw new Error('Não reconheci este relatório. Use Pedidos de Venda, Pedidos de Compra ou Contas a Receber/Pagar do Sischef.');
    if(tipo==='vendas'){ if(esperado&&esperado!=='vendas') toast('Este arquivo é o BASE VENDAS. Importei como vendas.'); return importarSischef(file); }
    const porMes={}; let n=0;
    if(tipo==='compras'){
      for(const r of rows){ const d=dataBRtoIso(r['Data']); if(!d) continue;
        const l={id:'c'+(r['ID Pedido']||'')+'-'+n,d,forn:String(r['Fornecedor']||'').trim(),prod:String(r['Produto']||'').trim(),un:String(r['Un. Medida']||'').trim(),grupo:String(r['Grupo']||'').trim(),qtd:numUS(r['Qtde']),unit:numUS(r['Unitario']),total:numUS(r['Total']),pago:String(r['Pago (0) - Nao pago (1)']).trim()==='0'};
        (porMes[d.slice(0,7)]=porMes[d.slice(0,7)]||[]).push(l); n++; }
    } else {
      for(const r of rows){ if(!semAc(r['tipo']).includes('PAGAR')) continue; const d=dataBRtoIso(r['data ocorrencia'])||dataBRtoIso(r['data vencimento']); if(!d) continue;
        const l={id:'a'+n,d,venc:dataBRtoIso(r['data vencimento']),nome:String(r['nome']||'').trim(),op:String(r['operacao']||'').trim(),gop:String(r['grupo operacao']||'').trim(),desc:String(r['descricao']||'').trim(),valor:Math.abs(numUS(r['valor'])),saldo:Math.abs(numUS(r['saldo'])),sit:String(r['situacao']||'').trim()};
        (porMes[d.slice(0,7)]=porMes[d.slice(0,7)]||[]).push(l); n++; }
    }
    if(!n) throw new Error('Nenhuma linha válida no arquivo.');
    if(esperado&&esperado!==tipo) toast(`Este arquivo é o ${BASES.find(b=>b.id===tipo).tit}. Importei nele.`);
    for(const [m,arr] of Object.entries(porMes)){ S.bases[tipo]={...S.bases[tipo],[m]:arr}; saveBase(tipo,m); }
    const ds=Object.values(porMes).flat().map(x=>x.d).sort();
    setCfg('imp_'+tipo,{arquivo:file.name,em:new Date().toISOString(),de:ds[0],ate:ds[ds.length-1],linhas:n});
    toast(`${BASES.find(b=>b.id===tipo).tit}: ${n} linhas importadas (${Object.keys(porMes).sort().map(mesCurto).join(', ')})`);
    render();
  }catch(e){ toast(e.message||'Não foi possível ler o arquivo.'); }
}

// ---------- centros e regras ----------
const CENTROS=[['fab','Fábrica de Linguiças','#A87A26'],['aco','Açougue','#B9503B'],['hort','Hortifruti','#3E8A5B'],['suin','Suínos','#B85872']];
const cNome=k=>(CENTROS.find(c=>c[0]===k)||[,k])[1], cCor=k=>(CENTROS.find(c=>c[0]===k)||[,,'#888'])[2];
const ccCfg=()=>cfgV().cc||{};
function setCC(k,v){ setCfg('cc',{...ccCfg(),[k]:v}); }
const CARNE_KG_PADRAO={pernil:12.79,qb:10.60,cs:18.56,csq:17.79,most:13.25,sert:12.81,charq:19.10};
const carneKg=k=>{ const c=(ccCfg().carneKg||{})[k]; return c!=null?+c:(CARNE_KG_PADRAO[k]||13); };
const capT=t=>{ const s=String(t||'').toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); };
const subOp=op=>{ const s=String(op||''); const i=s.indexOf('/'); return (i>=0?s.slice(i+1):s).trim(); };
const preOp=op=>{ const s=semAc(op); return s.startsWith('AGRO')?'agro':s.startsWith('HORT')?'hort':s.startsWith('SUIN')?'suin':null; };
// % da fábrica nas despesas e compras gerais do AGRO (o resto é do açougue)
const pctFab=cat=>{ const r=(ccCfg().rateio||{})[cat]; return r!=null?+r:0.5; };
function centroVenda(l){ const g=semAc(l.grupo); if(g.includes('EMBUTIDOS EXTERNOS')||g.includes('BONIFIC')||l.o==='manual') return 'fab'; if(g.startsWith('HORT')) return 'hort'; if(g.startsWith('SUIN')) return 'suin'; return 'aco'; }
function centroCompra(l){ const g=semAc(l.grupo), p=semAc(l.prod);
  if(g.startsWith('SUIN')) return 'suin'; if(g.startsWith('HORT')) return 'hort';
  if(g.includes('CARCACA')||p.includes('SACOLA A VACUO')) return 'aco';
  if(g.includes('INSUMOS')||g.includes('TEMPEROS')||g.includes('EMBALAG')||g.includes('RESFRIADOS')) return 'fab';
  return 'agro'; }
const catCompraGeral=l=>'COMPRAS GERAIS AGRO ('+(subOp(l.grupo).toLowerCase()||'outros')+')';
function tipoDesp(a){ const g=semAc(a.gop), o=semAc(a.op);
  if(o.includes('FINANCIAMENTO')||o.includes('EMPRESTIMO')) return 'emprestimo';
  if(o.includes('INVESTIMENTO')) return 'investimento';
  if(g.startsWith('CMC')||o.includes('COMPRA DE MATERIA PRIMA')||o.includes('COMPRA DE INSUMOS')||o.includes('COMPRA DE ANIMAIS')) return 'cmc';
  if(o.includes('COMISSAO SOBRE VENDAS')) return 'comissao';
  if(g.startsWith('DV')) return 'var';
  return 'fixo'; }

// ---------- DRE de cada centro no mês ----------
const ccCache={};
function dreCC(m){
  const ck=m+'|'+JSON.stringify(ccCfg())+'|'+vLinhas(m).length+'|'+bLinhas('compras',m).length+'|'+bLinhas('apagar',m).length+'|'+JSON.stringify(cadProd()).length;
  if(ccCache[m]&&ccCache[m].k===ck) return ccCache[m].v;
  const ROWS=['recExt','recChale','recInt','cmv','trIn','dv','com','bonus','df','inv','emp'];
  const Z=()=>({recExt:0,recChale:0,recInt:0,cmv:0,trIn:0,dv:0,com:0,bonus:0,df:0,inv:0,emp:0,desp:{},cmvDet:{},n:0,det:Object.fromEntries(ROWS.map(r=>[r,{}]))});
  const C={fab:Z(),aco:Z(),hort:Z(),suin:Z()}; const add=(o,k,v)=>{ o[k]=(o[k]||0)+v; };
  const dd=(x,row,k,v,q)=>{ const o=x.det[row][k]||(x.det[row][k]={v:0,q:0,n:0}); o.v+=v; o.q+=(q||0); o.n++; };
  const tt=t=>String(t||'').split(/\s+/).map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join(' ');
  // vendas
  let kgLing={};
  for(const l of vLinhas(m)){ const c=centroVenda(l), x=C[c], liq=+l.liq||0, int_=ehInterno(l); if(int_){ x.recChale+=liq; dd(x,'recChale',tt(l.nome),liq,+l.qtd||0); } else { x.recExt+=liq; dd(x,'recExt',tt(l.nome),liq,+l.qtd||0); } x.n++;
    const cd=cadDe(l); if(!int_&&ativoV(l.v)){ x.com+=liq*cd.com; if(liq*cd.com) dd(x,'com',tt(vendedorDe(l.v)?.nome||l.v||'Sem vendedor'),liq*cd.com); }
    if(c==='fab'){ const k=chaveSabor(l.nome)||'pernil'; kgLing[k]=(kgLing[k]||0)+kgDe(l); } }
  // bônus de produção vai para a fábrica
  const bon=bonusCfg(), kgBman=(cfgV().bonusKg||{})[m]; C.fab.bonus=(kgBman!=null?+kgBman:comMes(m).kgB)*bon.valorKg; if(C.fab.bonus) dd(C.fab,'bonus',`Bônus produção: ${N2.format(kgBman!=null?+kgBman:comMes(m).kgB)} kg × ${money(bon.valorKg)}`,C.fab.bonus);
  // carne do açougue para a fábrica (preço de custo das fichas)
  const trCarne=Object.entries(kgLing).reduce((s,[k,kg])=>s+kg*carneKg(k),0); C.fab.trIn+=trCarne; C.aco.recInt+=trCarne; const SAB={pernil:'Pernil Nobre',qb:'Queijo e Bacon',cs:'Carne de Sol',csq:'Carne de Sol c Queijo',most:'Mostarda c Ervas',sert:'Sertaneja',charq:'Charque'}; for(const [k,kg] of Object.entries(kgLing)){ dd(C.fab,'trIn',`Carne para ${SAB[k]||k} (${N2.format(kg)} kg × ${money(carneKg(k))})`,kg*carneKg(k)); dd(C.aco,'recInt',`Carne para a fábrica · ${SAB[k]||k}`,kg*carneKg(k)); } add(C.fab.cmvDet,'Carne do açougue (transferência)',trCarne);
  // compras
  const comp=bLinhas('compras',m); const suiPagas=comp.filter(l=>semAc(l.grupo).includes('CARCACA')&&!semAc(l.prod).includes('BOVIN')&&l.total>0);
  const kgS=sum(suiPagas,l=>l.qtd), precoPorco=ccCfg().precoPorco!=null&&ccCfg().precoPorco!==''?+ccCfg().precoPorco:(kgS?sum(suiPagas,l=>l.total)/kgS:0);
  let kgGranja=0;
  for(const l of comp){ const c=centroCompra(l), v=+l.total||0;
    if(semAc(l.grupo).includes('CARCACA')&&v===0&&!semAc(l.prod).includes('BOVIN')){ kgGranja+=l.qtd; continue; }
    const cat=c==='agro'?catCompraGeral(l):subOp(l.grupo)||'Outros';
    const pk=tt(l.prod);
    if(c==='agro'){ const p=pctFab(cat); C.fab.cmv+=v*p; C.aco.cmv+=v*(1-p); add(C.fab.cmvDet,cat,v*p); add(C.aco.cmvDet,cat,v*(1-p)); if(p) dd(C.fab,'cmv',pk+(p<1?` (${Math.round(p*100)}%)`:''),v*p,l.qtd*p); if(p<1) dd(C.aco,'cmv',pk+(p>0?` (${Math.round((1-p)*100)}%)`:''),v*(1-p),l.qtd*(1-p)); }
    else { C[c].cmv+=v; add(C[c].cmvDet,cat,v); dd(C[c],'cmv',pk,v,l.qtd); } }
  const trPorco=kgGranja*precoPorco; C.suin.recInt+=trPorco; C.aco.trIn+=trPorco; if(trPorco){ dd(C.suin,'recInt',`Porco para o açougue (${N2.format(kgGranja)} kg × ${money(precoPorco)})`,trPorco); dd(C.aco,'trIn',`Porco da granja (${N2.format(kgGranja)} kg × ${money(precoPorco)})`,trPorco); } add(C.aco.cmvDet,'Porco da granja (transferência)',trPorco);
  // a pagar
  for(const a of bLinhas('apagar',m)){ const t=tipoDesp(a), pre=preOp(a.op), v=+a.valor||0, cat=subOp(a.op)||a.op;
    if(t==='cmc'||t==='comissao') continue;
    const dest=pre==='agro'?[['fab',pctFab(cat)],['aco',1-pctFab(cat)]]:pre?[[pre,1]]:[['aco',0.5],['fab',0.5]];
    for(const [c,p] of dest){ if(!p) continue; const x=C[c];
      const dk=capT(cat)+' · '+tt(a.nome)+(p<1?` (${Math.round(p*100)}%)`:'');
      if(t==='emprestimo'){ x.emp+=v*p; dd(x,'emp',dk,v*p); } else if(t==='investimento'){ x.inv+=v*p; dd(x,'inv',dk,v*p); }
      else { if(t==='var'){ x.dv+=v*p; dd(x,'dv',dk,v*p); } else { x.df+=v*p; dd(x,'df',dk,v*p); } add(x.desp,cat,v*p); } } }
  for(const k in C){ const x=C[k]; x.rec=x.recExt+x.recChale+x.recInt; x.custoVar=x.cmv+x.trIn+x.dv+x.com+x.bonus; x.mc=x.rec-x.custoVar; x.mcp=x.rec?x.mc/x.rec:0; x.res=x.mc-x.df; x.pe=x.mcp>0?x.df/x.mcp:NaN; x.resp=x.rec?x.res/x.rec:0; }
  const J={recExt:0,recChale:0,cmv:0,dv:0,com:0,bonus:0,df:0,inv:0,emp:0}; for(const k in C) for(const f in J) J[f]+=C[k][f];
  J.det={}; for(const r of ['recExt','recChale','cmv','dv','com','bonus','df','inv','emp']){ J.det[r]={}; for(const k in C) for(const [n,o] of Object.entries(C[k].det[r])){ const key=['cmv','df','dv','inv','emp'].includes(r)?n.replace(/ \(\d+%\)$/,''):n; const t=J.det[r][key]||(J.det[r][key]={v:0,q:0,n:0}); t.v+=o.v; t.q+=o.q; t.n+=o.n; } }
  J.rec=J.recExt+J.recChale; J.custoVar=J.cmv+J.dv+J.com+J.bonus; J.mc=J.rec-J.custoVar; J.mcp=J.rec?J.mc/J.rec:0; J.res=J.mc-J.df; J.resp=J.rec?J.res/J.rec:0; J.pe=J.mcp>0?J.df/J.mcp:NaN;
  const tem={vendas:vLinhas(m).length>0,compras:comp.length>0,apagar:bLinhas('apagar',m).length>0};
  const v={C,J,tem,trCarne,trPorco,kgGranja,precoPorco};
  ccCache[m]={k:ck,v}; return v;
}

function grafMeses(serie,campo,{h=200,cor='var(--gold)'}={}){
  const W=760,H=h,pl=10,pr=10,pt=24,pb=26,n=serie.length; if(!n) return '';
  const vals=serie.map(s=>s[campo]); const mx=Math.max(1,...vals.map(Math.abs)); const hasNeg=vals.some(v=>v<0);
  const zero=hasNeg?pt+(H-pt-pb)/2:H-pb, esc=(hasNeg?(H-pt-pb)/2:(H-pt-pb))/mx; const cw=(W-pl-pr)/n, bw=Math.min(70,cw*0.55);
  return `<svg viewBox="0 0 ${W} ${H}" class="gsvg" role="img">${hasNeg?`<line x1="${pl}" x2="${W-pr}" y1="${zero}" y2="${zero}" stroke="var(--line2)"/>`:''}
  ${serie.map((s,i)=>{ const v=s[campo], x=pl+i*cw+(cw-bw)/2, hh=Math.abs(v)*esc, y=v>=0?zero-hh:zero; const c=v<0?'var(--bad)':(typeof cor==='function'?cor(s):cor);
    return `<rect class="hit" x="${pl+i*cw}" y="${pt}" width="${cw}" height="${H-pt-pb}" data-tip="<b>${mesLbl(s.m)}</b><br>${s.tip||money(v)}"/><rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,hh)}" rx="5" fill="${c}" pointer-events="none"/>
    <text x="${x+bw/2}" y="${v>=0?y-7:y+hh+14}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${money(v).replace('R$ ','').replace(/,\d\d$/,'')}</text>
    <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${mesCurto(s.m)}</text>`; }).join('')}</svg>`;
}
function dreTabela(x,y,isJ){
  const rows=[['recExt','Vendas a clientes',0],['recChale','Vendas para a Chalé de Ouro',0]];
  if(!isJ) rows.push(['recInt','Vendas para outros centros',0]);
  rows.push(['tot:rec','= Entrou',0],['cmv','(−) Mercadoria comprada',1]);
  if(!isJ) rows.push(['trIn','(−) Recebido de outros centros',1]);
  rows.push(['dv','(−) Despesas variáveis',1],['com','(−) Comissões',1]);
  if(x.bonus||(y&&y.bonus)) rows.push(['bonus','(−) Bônus produção',1]);
  rows.push(['df','(−) Despesas fixas',1],['fim:res','= Resultado',0]);
  const val=(o,k)=>o?(k.includes(':')?o[k.split(':')[1]]:o[k])||0:0;
  const det=k=>{ const D_=(x.det||{})[k]||{}; const L=Object.entries(D_).sort((a,b)=>b[1].v-a[1].v); if(!L.length) return '<div class="muted sm" style="padding:8px 0">Nada lançado.</div>';
    return `<div class="ddl">${L.map(([n,o])=>`<div class="ddr"><span>${esc(n)}</span><small>${o.q?N2.format(o.q):''}</small><i style="width:${L[0][1].v?Math.max(2,o.v/L[0][1].v*100):0}%"></i><b>${money(o.v)}</b></div>`).join('')}</div>`; };
  const cols=y?4:2;
  return `<div class="tw"><table class="dfc dre2"><thead><tr><th style="text-align:left">Conta <span class="muted sm" style="text-transform:none;letter-spacing:0;font-weight:500">· clique para ver o que entrou</span></th><th>Este mês</th>${y?'<th>Mês passado</th><th>Diferença</th>':''}</tr></thead><tbody>

  ${x.inv||x.emp?`<tr class="clk" data-dk="inv"><td style="text-align:left"><span class="car">▸</span> Fora do resultado: investimentos</td><td class="muted">${money(x.inv)}</td>${y?'<td></td><td></td>':''}</tr><tr class="drow" hidden><td colspan="${cols}">${det('inv')}</td></tr><tr class="clk" data-dk="emp"><td style="text-align:left"><span class="car">▸</span> Fora do resultado: empréstimos</td><td class="muted">${money(x.emp)}</td>${y?'<td></td><td></td>':''}</tr><tr class="drow" hidden><td colspan="${cols}">${det('emp')}</td></tr>`:''}
  </tbody></table></div>`;
}

  const dcs=Object.entries(dc).sort((a,b)=>(b[1].a-b[1].b)-(a[1].a-a[1].b));
  // vendas por produto
  const vp={}; for(const [mm,k] of [[m,'a'],[mp,'b']]) for(const l of vLinhas(mm)){ const o=vp[l.nome]||(vp[l.nome]={a:0,b:0,qa:0,qb:0,c:centroVenda(l)}); o[k]+=+l.liq||0; o['q'+k]+=+l.qtd||0; }

  const pcs=Object.entries(pc).filter(([n,o])=>o.qa&&o.qb).map(([n,o])=>({n,un:o.un,a:o.ta/o.qa,b:o.tb/o.qb,ta:o.ta})).sort((x,y)=>Math.abs((y.a-y.b)/y.b)-Math.abs((x.a-x.b)/x.b));
  view.innerHTML=head('Gerencial',`Comparação · ${mesLbl(m)} × ${mesLbl(mp)}`,'')+statusBases(m)+
  `<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Resultado de cada centro</h2></div>${tabC}</section>
  <div class="grid g2" style="margin-bottom:16px">
  <section class="card"><div class="card-h"><h2>Despesas por categoria</h2><span class="sub">ordenado pelo que mais subiu</span></div>
    <div class="tw"><table><thead><tr><th style="text-align:left">Despesa</th><th>Este mês</th><th>Mês passado</th><th>Δ</th></tr></thead><tbody>${dcs.map(([c,o])=>linhaC(esc(capT(c)),o.a,o.b,true)).join('')||'<tr><td colspan="4" class="muted">Cole o BASE A PAGAR.</td></tr>'}</tbody></table></div></section>
  <section class="card"><div class="card-h"><h2>Preço de compra</h2><span class="sub">por kg ou unidade · maiores variações</span></div>
    <div class="tw"><table><thead><tr><th style="text-align:left">Produto</th><th>Este mês</th><th>Mês passado</th><th>Variação</th></tr></thead><tbody>${pcs.slice(0,25).map(o=>`<tr><td style="text-align:left"><b>${esc(o.n)}</b><div class="muted sm">${esc(o.un)}</div></td><td>${money(o.a)}</td><td class="muted">${money(o.b)}</td><td><span class="${o.a>o.b?'neg':o.a<o.b?'pos':'muted'}">${o.a>o.b?'▲':o.a<o.b?'▼':''} ${pct(Math.abs((o.a-o.b)/o.b))}</span></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Precisa do BASE COMPRAS dos dois meses.</td></tr>'}</tbody></table></div></section></div>
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Vendas por produto</h2><span class="sub">quantidade e R$</span></div>
    <div class="tw"><table><thead><tr><th style="text-align:left">Produto</th><th style="text-align:left">Centro</th><th>Qtd</th><th>Qtd mês passado</th><th>Vendas</th><th>Mês passado</th><th>Δ</th></tr></thead><tbody>
    ${vps.map(([n,o])=>`<tr><td style="text-align:left"><b>${esc(n)}</b></td><td style="text-align:left"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cCor(o.c)};margin-right:6px"></span>${cNome(o.c)}</td><td>${N2.format(o.qa)}</td><td class="muted">${N2.format(o.qb)}</td><td>${money(o.a)}</td><td class="muted">${money(o.b)}</td><td>${dlt(o.a,o.b)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Cole o BASE VENDAS.</td></tr>'}</tbody></table></div></section>`;
  bindMesNav(vComparar);
  $$('[data-go]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); go2(a.dataset.go); }));
}

  const kgT=sum(Object.values(st).filter(x=>x.l.o!=='manual'),x=>x.kgB), comT=sum(Object.values(st),x=>x.com);

  <section class="card"><div class="tw"><table class="ptab2"><thead><tr><th style="text-align:left">PRODUTO</th><th style="text-align:left">GRUPO DE VENDAS</th><th>COMISSÃO</th><th>FATOR COM.</th><th class="muted">Qtd ${mesCurto(m)}</th><th class="muted">Kg bônus</th><th class="muted">Comissão</th></tr></thead><tbody>
  ${rows.map(([n,g])=>{ const v=valor(n), x=st[n]||Object.values(st).find(y=>semAc(y.l.nome).trim()===semAc(n).trim()); const nov=!tabDe(n)&&!cadProd()[n];
    return `<tr class="${nov?'novo':''}"><td class="name" style="text-align:left"><b>${esc(n)}</b>${nov?' <span class="pill warn">CADASTRAR</span>':''}</td><td class="sm" style="text-align:left">${esc(g||(x&&x.grupo)||'')}</td>

  <tr class="tot"><td><b>Total do mês</b></td><td></td><td></td><td></td><td></td><td><b>${N2.format(kgT)}</b></td><td><b>${money(comT)}</b></td></tr>
