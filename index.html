<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: etiqueta de açougue — faixa de título condensada, abas fixas, cartões de produto que viram tabela no desktop */
:root{
  --bg:#F4F2EF; --surface:#FFFFFF; --surface2:#F9F7F5; --ink:#1F1B1A; --muted:#6C6460; --line:#E3DEDA;
  --accent:#9A5F12; --accent-ink:#FFFFFF; --accent-soft:#F6E9D2; --wood:#3A2416; --wood-ink:#F7E7C6; --gold:#E2A93B;
  --ok:#2E7444; --ok-soft:#E1F0E5; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#F9DEDB;
  --input:#FFF8E6; --input-line:#E8D49C;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151211; --surface:#1F1B1A; --surface2:#252120; --ink:#EEE9E5; --muted:#A39994; --line:#37302E;
  --accent:#E6AE4F; --accent-ink:#1A120A; --accent-soft:#3A2C17; --wood:#24170F; --wood-ink:#F2DFB8; --gold:#E6AE4F;
  --ok:#7CC892; --ok-soft:#1E3326; --warn:#E9B25C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3D1F1C;
  --input:#2B2516; --input-line:#5E5022; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151211; --surface:#1F1B1A; --surface2:#252120; --ink:#EEE9E5; --muted:#A39994; --line:#37302E;
  --accent:#E6AE4F; --accent-ink:#1A120A; --accent-soft:#3A2C17; --wood:#24170F; --wood-ink:#F2DFB8; --gold:#E6AE4F;
  --ok:#7CC892; --ok-soft:#1E3326; --warn:#E9B25C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3D1F1C;
  --input:#2B2516; --input-line:#5E5022; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--wood);color:var(--wood-ink);border-bottom:3px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--gold)}
.brand .logo{width:58px;height:58px;border-radius:8px;flex:none;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
.brand .id{display:flex;align-items:center;gap:12px;min-width:0}
.brand .sub{color:var(--wood-ink);opacity:.8;font-size:13px}
.brand .savestate{color:inherit}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{font:600 15px var(--body);background:none;border:0;color:var(--wood-ink);opacity:.75;padding:10px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-color:var(--gold)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;color:var(--muted)}
p.lead{color:var(--muted);margin:0 0 16px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.kpi .h{font-size:12px;color:var(--muted)}
.metabar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.metabar label{font-weight:600}
.num{font:600 15px var(--body);font-variant-numeric:tabular-nums;background:var(--input);border:1px solid var(--input-line);color:var(--ink);border-radius:7px;padding:7px 9px;width:100%;min-width:0;text-align:right}
.txt{font:500 15px var(--body);background:var(--input);border:1px solid var(--input-line);color:var(--ink);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
select.txt{appearance:auto}
input[disabled],select[disabled]{background:transparent;border-color:transparent;color:var(--ink);opacity:1}
.num.w80{width:84px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.strong{font-weight:700}
.mc{color:var(--ok);font-weight:700}
.neg{color:var(--bad);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cascade{display:grid;gap:0}
.cascade div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.cascade div:last-child{border-bottom:0}
.cascade .tot{font-weight:700;border-bottom:1px solid var(--line)}
.cascade .big{font-family:var(--display);font-size:24px;font-weight:700;color:var(--ok);border:0;padding:10px 12px;background:var(--ok-soft);border-radius:8px;margin:6px 0}
.cascade .big.neg{color:var(--bad);background:var(--bad-soft)}
.cascade small{color:var(--muted);font-family:var(--body);font-size:13px;font-weight:500}
.tag{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{font:600 14px var(--body);white-space:nowrap;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ing td{padding:6px 8px}

.ing .num{width:84px}
.fgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.costgrid{display:grid;grid-template-columns:1fr 1fr}
.costgrid .cg2{border-left:1px solid var(--line)}
@media (max-width:900px){.fgrid{grid-template-columns:1fr}.costgrid{grid-template-columns:1fr}.costgrid .cg2{border-left:0;border-top:1px solid var(--line)}}
.ing th,.ing td{padding:8px 7px}
.ing th{white-space:normal;vertical-align:bottom}
.ing td:first-child{white-space:normal;min-width:120px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.savestate{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--input);border:1px solid var(--input-line);vertical-align:-1px;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.panel,.kpi{transition:border-color .15s}}
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:var(--wood)}
.login .card{background:var(--surface);color:var(--ink);border-radius:14px;padding:24px;width:100%;max-width:380px;display:grid;gap:14px;border-top:4px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.login .card img{width:150px;height:150px;border-radius:12px;justify-self:center;object-fit:cover}
.login .msg{margin:0;text-align:center;font-size:14px;min-height:1.2em}
.login .msg.err{color:var(--bad);font-weight:600}
.brand .btn.ghost{color:var(--gold);padding:2px 6px;font-size:13px}
</style>
</head>

<section class="login" id="login" hidden>
  <div class="wrap" style="width:100%;display:grid;place-items:center">
  <form class="card" id="loginForm" novalidate>
    <img id="loginLogo" alt="Fazenda Chalé de Ouro">
    <h2 style="text-align:center;margin:0">Fichas Técnicas</h2>
    <p class="note" style="text-align:center;margin:0">Entre com o e-mail e a senha cadastrados pela gestão.</p>
    <label class="field"><span>E-mail</span><input class="txt" id="lgEmail" type="email" autocomplete="username" inputmode="email" required></label>
    <label class="field"><span>Senha</span><input class="txt" id="lgSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="lgBtn" type="submit">Entrar</button>
    <button class="btn ghost" id="lgReset" type="button">Esqueci minha senha</button>
    <p class="msg" id="lgMsg" role="status"></p>
  </form>
  </div>
</section>

    <p>As 7 fichas de linguiça, os preços dos insumos e os custos do lote aparecem aqui em instantes.</p>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $ = (s,el=document)=>el.querySelector(s);
const app = $('#app');
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const N2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N3 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:3});
const P1 = new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});
const money = v => isFinite(v) ? BRL.format(v) : '–';
const pct = v => isFinite(v) ? P1.format(v) : '–';
const parseNum = s => { if (typeof s==='number') return s; s=String(s||'').trim().replace(/\s/g,'').replace(/R\$/,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isFinite(v)?v:0; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = { tab:'painel', config:null, insumos:{}, produtos:[], sel:null, canWrite:true, loaded:{c:false,i:false,p:false}, db:null };
let pendingRender = false;

// ---------- cálculo ----------
const CUSTOS_ORIGINAIS = [
  {id:'transporte', nome:'Transporte', valor:12, base:'lote', tipo:'variavel'},
  {id:'armazenamento', nome:'Armazenamento', valor:2.5, base:'lote', tipo:'variavel'},
  {id:'perda', nome:'Taxa de Perda', valor:12, base:'lote', tipo:'variavel'},
  {id:'roi', nome:'ROI ( Retorno do Capital Investido)', valor:10, base:'lote', tipo:'variavel'},
  {id:'embalagem', nome:'Embalagem', valor:120, base:'lote', tipo:'variavel'},
  {id:'comissao', nome:'Comissão de Vendas', valor:1.5, base:'kg', tipo:'variavel'},
  {id:'energia', nome:'Energia', valor:12, base:'lote', tipo:'fixo'},
  {id:'funcionarios', nome:'Funcionarios', valor:150, base:'lote', tipo:'fixo'},
  {id:'adm', nome:'Despesas Adm', valor:20, base:'lote', tipo:'fixo'},
  {id:'erro', nome:'Margem De Erro', valor:200, base:'lote', tipo:'fixo'},
  {id:'imposto', nome:'Imposto', valor:117.6, base:'lote', tipo:'fixo'}
];
const OLD_KEYS={transporte:'transporte',armazenamento:'armazenamento',perda:'perda',embalagem:'embalagem',comissao:'comissaoKg',energia:'energia',funcionarios:'funcionarios',adm:'adm',imposto:'imposto'};
function migrateConfig(c){
  c={...(c||{})};
  if(!Array.isArray(c.custos)){
    c.custos=CUSTOS_ORIGINAIS.map(x=>{ const k=OLD_KEYS[x.id]; return {...x, valor:(k && c[k]!=null)? +c[k] : x.valor}; });
    Object.values(OLD_KEYS).forEach(k=>delete c[k]);
  } else c.custos=c.custos.map(x=>({...x}));
  if(c.peso==null) c.peso=0.4;
  return c;
}
function itemLote(x,kg){ return x.base==='kg' ? (+x.valor||0)*kg : (+x.valor||0); }
function porcaoLbl(){ return N3.format((+(S.config&&S.config.peso)||0.4)*1000)+'g'; }
function calc(p){
  const c = S.config || {};
  let kg=0, ing=0;
  const rec = p.receita || {};
  for (const id in rec){ const q=+rec[id]||0; kg+=q; ing+=q*(+(S.insumos[id]?.preco)||0); }
  const peso = +c.peso||0.4;
  const pac = peso>0 ? kg/peso : 0;
  const custos = c.custos||[];
  const varItens = custos.filter(x=>x.tipo!=='fixo'), fixItens = custos.filter(x=>x.tipo==='fixo');
  const outrosLote = varItens.reduce((s,x)=>s+itemLote(x,kg),0);
  const fixosLote = fixItens.reduce((s,x)=>s+itemLote(x,kg),0);
  const ingP = pac? ing/pac : 0, outP = pac? outrosLote/pac : 0, fxP = pac? fixosLote/pac : 0;
  const cv = ingP+outP, preco=+p.preco||0, mc=preco-cv, mcp = preco? mc/preco : 0;
  const meta = +c.meta||0;
  const precoMeta = meta<1 ? Math.ceil((cv/(1-meta))/0.5)*0.5 : NaN;
  const lucro = mc-fxP;
  const status = mc<0 ? 'bad' : (mcp<meta ? 'warn':'ok');
  const totalLote = ing+outrosLote+fixosLote;
  const custoPorcao = pac? totalLote/pac : 0, custoKg = kg? totalLote/kg : 0, precoKg = peso? preco/peso : 0;
  const margemLucro = preco? (preco-custoPorcao)/preco : 0;
  return {kg,pac,peso,ing,outrosLote,fixosLote,varItens,fixItens,ingP,outP,fxP,cv,preco,mc,mcp,precoMeta,lucro,lucrop:preco?lucro/preco:0,status,totalLote,custoPorcao,custoKg,precoKg,margemLucro};
}
const STATUS = {ok:'OK', warn:'Abaixo da meta', bad:'Prejuízo'};

// ---------- gravação (neste navegador) ----------
const KEY='fichas-chale-de-ouro-v1';
const queued={}, inflight={};
let persistT;
function setSave(t){ const el=$('#saveState'); if(el) el.textContent=t; }
function snapshotState(){ return {config:S.config, insumos:S.insumos, produtos:S.produtos, salvoEm:new Date().toISOString()}; }
const CLOUD={ref:null,email:''};
let cloudDirty=false, pendingData=null;
const clean=o=>JSON.parse(JSON.stringify(o));
function persist(){
  clearTimeout(persistT); setSave('salvando…'); cloudDirty=true;
  persistT=setTimeout(async()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(snapshotState())); }catch(e){}
    if(!CLOUD.ref){ cloudDirty=false; setSave('modo local · salvo só neste aparelho'); return; }
    try{ await CLOUD.ref.set({...clean(snapshotState()), atualizadoPor:CLOUD.email}); setSave('salvo na nuvem'); }
    catch(e){ setSave('não foi salvo'); toast(e && e.code==='permission-denied' ? 'Seu e-mail não tem permissão para alterar as fichas.' : 'Não foi possível salvar. Verifique a internet.'); }
    finally{ cloudDirty=false; }
  },600);
}
function save(){ persist(); }
function saveNow(){ persist(); }
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

// ---------- render ----------
function scheduleRender(){
  const a = document.activeElement;
  if (a && app.contains(a) && (a.tagName==='INPUT'||a.tagName==='SELECT')) { pendingRender=true; return; }
  render();
}
app.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendingRender){ const a=document.activeElement; if(!(a && app.contains(a) && (a.tagName==='INPUT'||a.tagName==='SELECT'))){ pendingRender=false; render(); } } },0); });

function ready(){ return S.loaded.c && S.loaded.i && S.loaded.p; }
function sortedInsumos(){ return Object.entries(S.insumos).map(([id,v])=>({id,...v})).sort((a,b)=>(a.ordem??999)-(b.ordem??999)||String(a.nome).localeCompare(b.nome,'pt')); }
function dis(){ return S.canWrite? '' : ' disabled'; }
function numIn(id, val, attrs='', cls='num'){ return `<input class="${cls}" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(val))}" ${attrs}${dis()}>`; }
function fmtIn(v){ v=+v||0; return N3.format(v); }

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
  const peso = +(S.config?.peso)||0.4; $('#pesoLbl').textContent = 'de '+N3.format(peso*1000)+' g';
  if (!ready()) return;
  if (!S.config || !Object.keys(S.insumos).length){
    app.innerHTML = `<div class="panel empty"><h2>Nenhuma ficha cadastrada ainda</h2><p>No primeiro acesso, importe o arquivo de dados das fichas (fichas-chale-dados-iniciais.json) ou um backup exportado por este site.</p><label class="btn primary" for="firstFile" style="display:inline-block">Importar arquivo de dados</label><input type="file" id="firstFile" accept=".json,application/json" hidden></div>`; $('#firstFile').addEventListener('change',e=>importBackup(e.target.files[0])); return;
  }
  ({painel:renderPainel, fichas:renderFichas, insumos:renderInsumos, custos:renderCustos})[S.tab]();
}

function renderPainel(){
  const rows = S.produtos.map(p=>({p, r:calc(p)}));
  const meta = +S.config.meta||0;
  const avg = rows.length? rows.reduce((s,x)=>s+x.r.mc,0)/rows.length : 0;
  const below = rows.filter(x=>x.r.status!=='ok').length;
  const fixos = +S.config.fixosMes||0;
  const pe = avg>0 ? Math.ceil(fixos/avg) : NaN;
  const best = rows.slice().sort((a,b)=>b.r.mc-a.r.mc)[0];
  app.innerHTML = `
  <div class="metabar">
    <label for="meta">Meta de margem de contribuição</label>
    ${numIn('meta', meta*100, 'data-k="meta" style="width:80px"')}<span>%</span>
    <span class="note">Mude a meta e veja o preço sugerido de cada linguiça.</span>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Margem média por pacote</div><div class="v">${money(avg)}</div><div class="h">${rows.length} produtos</div></div>
    <div class="kpi"><div class="l">Abaixo da meta</div><div class="v">${below}</div><div class="h">de ${rows.length} produtos</div></div>
    <div class="kpi"><div class="l">Maior margem</div><div class="v" style="font-size:22px">${esc(best?.p.nome||'–')}</div><div class="h">${best?money(best.r.mc)+' por pacote':''}</div></div>
    <div class="kpi"><div class="l">Pacotes/mês para empatar</div><div class="v">${isFinite(pe)?pe.toLocaleString('pt-BR'):'–'}</div><div class="h">com fixos de ${money(fixos)}/mês</div></div>
  </div>
  <div class="scroll"><table id="painelTbl">
    <thead><tr><th>Produto</th><th>Preço de Venda Porção ${porcaoLbl()}</th><th>Custo variável</th><th>Margem R$</th><th>Margem %</th><th>Situação</th><th>Preço p/ meta</th><th>Custo Porção ${porcaoLbl()}</th><th>Lucro R$</th></tr></thead>
    <tbody>${rows.map(({p,r})=>`<tr class="click" data-open="${esc(p.id)}" tabindex="0">
      <td class="strong">${esc(p.nome)}</td><td>${money(r.preco)}</td><td>${money(r.cv)}</td>
      <td class="${r.mc<0?'neg':'mc'}">${money(r.mc)}</td><td class="${r.mc<0?'neg':'mc'}">${pct(r.mcp)}</td>
      <td><span class="pill ${r.status}">${STATUS[r.status]}</span></td>
      <td class="strong">${money(r.precoMeta)}</td><td>${money(r.custoPorcao)}</td><td>${money(r.lucro)}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="legend"><span><b>Margem</b> = preço − (CUSTO COM CMU + CUSTOS VARIAVEIS)</span><span><b>Lucro</b> = margem − CUSTOS FIXOS</span><span>Os custos ficam na aba Custos do lote</span><span>Toque em um produto para abrir a ficha</span></div>`;
  app.querySelectorAll('[data-open]').forEach(tr=>{ const go=()=>{S.sel=tr.dataset.open; S.tab='fichas'; render(); window.scrollTo(0,0);}; tr.addEventListener('click',go); tr.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); });
  const m=$('#meta'); if(m){ m.addEventListener('input',()=>{ S.config={...S.config, meta: parseNum(m.value)/100}; refreshPainelTable(); save('config/lote', S.config); }); }
}
function refreshPainelTable(){
  // reconstrói só a tabela e os cartões, mantendo o foco no campo de meta
  const keep = $('#meta').value, pos = $('#meta').selectionStart;
  renderPainel(); const m=$('#meta'); m.value=keep; m.focus(); try{m.setSelectionRange(pos,pos);}catch(e){}
}

function renderFichas(){
  if (!S.produtos.length){ app.innerHTML=`<div class="panel empty"><h2>Nenhuma ficha</h2><p>Crie a primeira ficha de linguiça.</p><button class="btn primary" id="novo"${dis()}>Nova ficha</button></div>`; $('#novo')?.addEventListener('click',novoProduto); return; }
  if (!S.sel || !S.produtos.find(p=>p.id===S.sel)) S.sel = S.produtos[0].id;
  const p = S.produtos.find(x=>x.id===S.sel);
  const ins = sortedInsumos();
  const rec = p.receita||{};
  const usados = Object.keys(rec);
  const livres = ins.filter(i=>!(i.id in rec));
  app.innerHTML = `
  <div class="chips" role="group" aria-label="Escolha a linguiça">
    ${S.produtos.map(x=>`<button class="chip" data-sel="${esc(x.id)}" aria-pressed="${x.id===p.id}">${esc(x.nome)}</button>`).join('')}
  </div>
  <div class="grid2 fgrid">
    <div class="stack" style="min-width:0">
      <div class="panel">
        <div class="tag">Ficha técnica gerencial</div>
        <div class="fields" style="margin-top:8px">
          <label class="field" style="grid-column:1/-1"><span>Produto</span><input class="txt" id="pNome" value="${esc(p.nome)}"${dis()}></label>
          <label class="field"><span>Classificação</span><input class="txt" id="pClass" value="${esc(p.classificacao||'Linguiça Fresca')}"${dis()}></label>
          <label class="field"><span>Receita</span>${numIn('pReceita', p.receitaBase ?? 40)}</label>
          <label class="field"><span>Preço de Venda Porção ${porcaoLbl()}</span>${numIn('pPreco', p.preco)}</label>
        </div>
      </div>
      <div class="panel" style="padding:0;overflow:hidden">
        <div style="padding:14px 16px 6px" class="row"><h3 style="margin:0">CUSTO COM CMU</h3><span class="spacer"></span><span class="note">ingredientes do lote</span></div>
        <div style="overflow-x:auto"><table class="ing">
          <thead><tr><th>Ingredientes</th><th>Quantidade (KG)</th><th>Porcentagem (KG)</th><th>Custo Unitario</th><th>Custo Total</th><th></th></tr></thead>
          <tbody>${usados.map(id=>{ const i=S.insumos[id]||{nome:'(insumo apagado)',preco:0,unid:''}; const q=+rec[id]||0; return `<tr>
            <td>${esc(i.nome)} <span class="note">${esc(i.unid||'')}</span></td>
            <td>${numIn('q-'+id, q, `data-q="${esc(id)}"`)}</td>
            <td class="note" id="pc-${esc(id)}"></td>
            <td class="note">${money(+i.preco||0)}</td>
            <td id="c-${esc(id)}">${money(q*(+i.preco||0))}</td>
            <td>${S.canWrite?`<button class="btn ghost" data-rm="${esc(id)}" aria-label="Remover ${esc(i.nome)}">✕</button>`:''}</td></tr>`;}).join('')}</tbody>
        </table></div>
        ${S.canWrite?`<div class="row" style="padding:12px 16px;border-top:1px solid var(--line)">
          <select class="txt" id="addIng" style="max-width:260px"><option value="">+ adicionar ingrediente…</option>${livres.map(i=>`<option value="${esc(i.id)}">${esc(i.nome)}</option>`).join('')}</select>
          <span class="note">Não achou? Cadastre em <a href="#" id="goIns">Insumos</a>.</span></div>`:''}
      </div>
    </div>
    <div class="stack" style="min-width:0">
      <div class="panel" id="calcPanel"></div>
      ${S.canWrite?`<div class="panel row">
        <button class="btn" id="dup">Duplicar ficha</button>
        <button class="btn" id="novo">Nova ficha</button>
        <span class="spacer"></span>
        <button class="btn danger" id="del">Excluir ficha</button>
      </div>`:''}
    </div>
  </div>
  <div class="panel costgrid" style="padding:0;overflow:hidden;margin-top:16px" id="costTables"></div>`;
  fillCalc(p);
  app.querySelectorAll('[data-sel]').forEach(b=>b.addEventListener('click',()=>{S.sel=b.dataset.sel; render();}));
  const upd = (patch)=>{ Object.assign(p, patch); fillCalc(p); saveProduto(p); };
  $('#pNome')?.addEventListener('input',e=>{ p.nome=e.target.value; const chip=app.querySelector(`[data-sel="${CSS.escape(p.id)}"]`); if(chip) chip.textContent=p.nome||'Sem nome'; saveProduto(p); });
  $('#pClass')?.addEventListener('input',e=>{ p.classificacao=e.target.value; saveProduto(p); });
  $('#pPreco')?.addEventListener('input',e=>upd({preco:parseNum(e.target.value)}));
  $('#pReceita')?.addEventListener('input',e=>{ p.receitaBase=parseNum(e.target.value); saveProduto(p); });
  app.querySelectorAll('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ const id=inp.dataset.q; p.receita={...p.receita,[id]:parseNum(inp.value)}; const i=S.insumos[id]; const c=$('#c-'+CSS.escape(id)); if(c) c.textContent=money((+p.receita[id]||0)*(+i?.preco||0)); fillCalc(p); saveProduto(p); }));
  app.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ const r={...p.receita}; delete r[b.dataset.rm]; p.receita=r; saveProduto(p,true); render(); }));
  $('#addIng')?.addEventListener('change',e=>{ const id=e.target.value; if(!id) return; p.receita={...p.receita,[id]:0}; saveProduto(p,true); render(); setTimeout(()=>{ $('#q-'+CSS.escape(id))?.focus(); },0); });
  $('#goIns')?.addEventListener('click',e=>{e.preventDefault(); S.tab='insumos'; render();});
  $('#novo')?.addEventListener('click',novoProduto);
  $('#dup')?.addEventListener('click',()=>novoProduto(p));
  const del=$('#del'); if(del){ let armed=false, t; del.addEventListener('click',()=>{ if(!armed){ armed=true; del.classList.add('armed'); del.textContent='Toque de novo para excluir'; t=setTimeout(()=>{armed=false; del.classList.remove('armed'); del.textContent='Excluir ficha';},4000); return; } clearTimeout(t); const id=p.id; S.produtos=S.produtos.filter(x=>x.id!==id); S.sel=null; saveNow('produtos/'+id, null, 'delete'); toast('Ficha excluída'); render(); }); }
}
function costRows(items, r, col){
  const tot = items.reduce((s,x)=>s+itemLote(x,r.kg),0);
  return `<div style="overflow-x:auto"><table class="ing">
    <thead><tr><th>${col}</th><th>CUSTO</th><th>Custo Por (KG)</th><th>Por porção ${porcaoLbl()}</th></tr></thead>
    <tbody>${items.map(x=>{ const v=itemLote(x,r.kg); return `<tr><td>${esc(x.nome)}${x.base==='kg'?` <span class="note">(${money(+x.valor||0)}/kg)</span>`:''}</td><td>${money(v)}</td><td>${money(r.kg? v/r.kg : 0)}</td><td>${money(r.pac? v/r.pac : 0)}</td></tr>`; }).join('') || `<tr><td colspan="4" class="note">Nenhum custo cadastrado</td></tr>`}</tbody>
    <tbody><tr><td class="strong">TOTAL</td><td class="strong">${money(tot)}</td><td class="strong">${money(r.kg? tot/r.kg : 0)}</td><td class="strong">${money(r.pac? tot/r.pac : 0)}</td></tr></tbody>
  </table></div>`;
}
function fillCalc(p){
  const r = calc(p), el=$('#calcPanel'); if(!el) return;
  const rec=p.receita||{};
  for(const id in rec){ const c=document.getElementById('pc-'+id); if(c) c.textContent=pct(r.kg? (+rec[id]||0)/r.kg : 0); }
  const ct=$('#costTables');
  if(ct){
    ct.innerHTML = `<div style="min-width:0"><div style="padding:14px 16px 6px" class="row"><h3 style="margin:0">CUSTOS VARIAVEIS</h3><span class="spacer"></span><a href="#" class="note" data-gocustos>Editar custos</a></div>
      ${costRows(r.varItens, r, 'VARIAVEL')}</div>
      <div style="min-width:0" class="cg2"><div style="padding:14px 16px 6px" class="row"><h3 style="margin:0">CUSTOS FIXOS</h3></div>
      ${costRows(r.fixItens, r, 'FIXA')}</div>`;
    ct.querySelector('[data-gocustos]')?.addEventListener('click',e=>{ e.preventDefault(); S.tab='custos'; render(); window.scrollTo(0,0); });
  }
  const L=porcaoLbl();
  el.innerHTML = `
    <h3>Resumo da ficha</h3>
    <div class="fields">
      <div class="field"><span>Quantidade (Bruta)</span><b>${N2.format(r.kg)} kg</b></div>
      <div class="field"><span>Peso Porção</span><b>${N3.format(r.peso*1000)} Gramas</b></div>
      <div class="field"><span>Custo Porção ${L}</span><b>${money(r.custoPorcao)}</b></div>
      <div class="field"><span>Preço de Venda Porção ${L}</span><b>${money(r.preco)}</b></div>
      <div class="field"><span>Custo Kg</span><b>${money(r.custoKg)}</b></div>
      <div class="field"><span>Preço de Venda Kg</span><b>${money(r.precoKg)}</b></div>
      <div class="field"><span>CUSTO TOTAL</span><b>${money(r.totalLote)}</b></div>
      <div class="field"><span>Margem de Lucro ${L}</span><b class="${r.margemLucro<0?'neg':''}">${pct(r.margemLucro)}</b></div>
    </div>
    <h3 style="margin-top:18px">Resultado por porção ${L}</h3>
    <div class="cascade">
      <div><span>Preço de Venda Porção</span><b>${money(r.preco)}</b></div>
      <div><span>(−) CUSTO COM CMU</span><span>${money(r.ingP)}</span></div>
      <div><span>(−) CUSTOS VARIAVEIS</span><span>${money(r.outP)}</span></div>
      <div class="big ${r.mc<0?'neg':''}"><span>Margem de contribuição<br><small>${pct(r.mcp)} do preço</small></span><span>${money(r.mc)}</span></div>
      <div><span>(−) CUSTOS FIXOS</span><span>${money(r.fxP)}</span></div>
      <div class="tot"><span>Lucro por porção</span><span class="${r.lucro<0?'neg':''}">${money(r.lucro)} <small>(${pct(r.lucrop)})</small></span></div>
    </div>
    <div class="fields" style="margin-top:14px">
      <div class="field"><span>Situação</span><div><span class="pill ${r.status}">${STATUS[r.status]}</span></div></div>
      <div class="field"><span>Preço mínimo</span><b>${money(r.cv)}</b></div>
      <div class="field"><span>Preço p/ meta de ${pct(+S.config.meta||0)}</span><b>${money(r.precoMeta)}</b></div>
      <div class="field"><span>Porções por lote</span><b>${N2.format(r.pac)}</b></div>
    </div>`;
}
function saveProduto(p, now){ const body={nome:p.nome||'', classificacao:p.classificacao||'', preco:+p.preco||0, receitaBase:+(p.receitaBase ?? 40), ordem:+p.ordem||0, receita:p.receita||{}}; (now?saveNow:save)('produtos/'+p.id, body); }
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'item'; }
function novoProduto(base){
  const nome = base&&base.nome ? base.nome+' (cópia)' : 'Nova linguiça';
  const id = slug(nome)+'-'+Date.now().toString(36);
  const ordem = Math.max(0,...S.produtos.map(x=>+x.ordem||0))+1;
  const p = {id, nome, classificacao: base?.classificacao||'Linguiça Fresca', preco: base&&base.preco? +base.preco : 14, receitaBase: base&&base.receitaBase!=null? +base.receitaBase : 40, ordem, receita: base&&base.receita? {...base.receita} : {}};
  S.produtos.push(p); S.sel=id; saveProduto(p,true); render(); setTimeout(()=>{ const n=$('#pNome'); n?.focus(); n?.select(); },0);
}

function renderInsumos(){
  const ins = sortedInsumos();
  const uso = id => S.produtos.filter(p=>p.receita && id in p.receita).length;
  app.innerHTML = `
  <div class="row" style="margin-bottom:12px"><div><h2>Preços dos insumos</h2><p class="lead" style="margin:0">Mude o preço uma vez aqui e todas as fichas que usam o ingrediente se atualizam.</p></div><span class="spacer"></span>${S.canWrite?'<button class="btn primary" id="novoIns">Novo insumo</button>':''}</div>
  <div class="scroll"><table>
    <thead><tr><th>Ingrediente</th><th>Unid.</th><th>Preço (R$)</th><th>Usado em</th><th></th></tr></thead>
    <tbody>${ins.map(i=>`<tr>
      <td><input class="txt" data-n="${esc(i.id)}" value="${esc(i.nome)}" style="min-width:170px"${dis()}></td>
      <td><input class="txt" data-u="${esc(i.id)}" value="${esc(i.unid||'')}" style="width:76px"${dis()}></td>
      <td>${numIn('pr-'+i.id, i.preco, `data-p="${esc(i.id)}" style="width:110px"`)}</td>
      <td class="note">${uso(i.id)} ficha${uso(i.id)===1?'':'s'}</td>
      <td>${S.canWrite?`<button class="btn ghost" data-x="${esc(i.id)}" ${uso(i.id)?'disabled title="Retire das fichas antes de excluir"':''} aria-label="Excluir ${esc(i.nome)}">✕</button>`:''}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="legend"><span><i></i>Campos amarelos podem ser editados</span><span>Carne e gordura suína: preço de transferência da granja</span></div>`;
  const put = id => { const i=S.insumos[id]; save('insumos/'+id, {nome:i.nome, unid:i.unid||'', preco:+i.preco||0, ordem:i.ordem??999}); };
  app.querySelectorAll('[data-n]').forEach(x=>x.addEventListener('input',()=>{ S.insumos[x.dataset.n]={...S.insumos[x.dataset.n], nome:x.value}; put(x.dataset.n); }));
  app.querySelectorAll('[data-u]').forEach(x=>x.addEventListener('input',()=>{ S.insumos[x.dataset.u]={...S.insumos[x.dataset.u], unid:x.value}; put(x.dataset.u); }));
  app.querySelectorAll('[data-p]').forEach(x=>x.addEventListener('input',()=>{ S.insumos[x.dataset.p]={...S.insumos[x.dataset.p], preco:parseNum(x.value)}; put(x.dataset.p); }));
  app.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.x; if(uso(id)) return; const c={...S.insumos}; delete c[id]; S.insumos=c; saveNow('insumos/'+id,null,'delete'); render(); }));
  $('#novoIns')?.addEventListener('click',()=>{ const id='ins-'+Date.now().toString(36); const ordem=Math.max(0,...Object.values(S.insumos).map(i=>+i.ordem||0))+1; S.insumos={...S.insumos,[id]:{nome:'Novo insumo',unid:'KG',preco:0,ordem}}; saveNow('insumos/'+id,S.insumos[id]); render(); const n=app.querySelector(`[data-n="${id}"]`); n?.focus(); n?.select(); });
}

function renderCustos(){
  const c=S.config;
  const sec=(tipo,title,col)=>{
    const items=(c.custos||[]).map((x,i)=>({x,i})).filter(o=>(o.x.tipo==='fixo')===(tipo==='fixo'));
    return `<div class="panel" style="padding:0;overflow:hidden">
      <div style="padding:14px 16px 6px"><h3 style="margin:0">${title}</h3></div>
      <div style="overflow-x:auto"><table class="ing">
        <thead><tr><th>${col}</th><th>CUSTO (R$)</th><th>Cobrado</th><th>Tipo</th><th></th></tr></thead>
        <tbody>${items.map(({x,i})=>`<tr>
          <td><input class="txt" data-cn="${i}" value="${esc(x.nome)}" style="min-width:210px"${dis()}></td>
          <td>${numIn('cv-'+i, x.valor, `data-cv="${i}" style="width:104px"`)}</td>
          <td><select class="txt" data-cb="${i}" style="width:auto"${dis()}><option value="lote"${x.base!=='kg'?' selected':''}>por lote</option><option value="kg"${x.base==='kg'?' selected':''}>por kg</option></select></td>
          <td><select class="txt" data-ct="${i}" style="width:auto"${dis()}><option value="variavel"${x.tipo!=='fixo'?' selected':''}>Variável</option><option value="fixo"${x.tipo==='fixo'?' selected':''}>Fixo</option></select></td>
          <td>${S.canWrite?`<button class="btn ghost" data-cx="${i}" aria-label="Excluir ${esc(x.nome)}">✕</button>`:''}</td></tr>`).join('') || `<tr><td colspan="5" class="note">Nenhum custo neste grupo</td></tr>`}</tbody>
      </table></div>
      ${S.canWrite?`<div style="padding:12px 16px;border-top:1px solid var(--line)"><button class="btn" data-cadd="${tipo}">+ Adicionar ${tipo==='fixo'?'custo fixo':'custo variável'}</button></div>`:''}
    </div>`;
  };
  app.innerHTML = `<h2>Custos do lote</h2><p class="lead">Os custos da ficha técnica, iguais para todas as linguiças. Os CUSTOS VARIAVEIS entram na margem de contribuição e os CUSTOS FIXOS só entram no lucro. Qualquer mudança aqui atualiza o Painel e todas as Fichas.</p>
  <div class="stack">
  ${sec('variavel','CUSTOS VARIAVEIS','VARIAVEL')}
  ${sec('fixo','CUSTOS FIXOS','FIXA')}
  <p class="note" style="margin:0">Para mudar um custo de grupo, troque o Tipo. "Por kg" multiplica o valor pelos kg do lote, como a Comissão de Vendas (R$ 1,50 por kg).</p>
  <div class="panel"><h3>Fábrica</h3><div class="fields">
    <label class="field"><span>Peso Porção (kg)</span>${numIn('cfg-peso', c.peso, 'data-c="peso"')}</label>
    <label class="field"><span>Custos fixos da fábrica no mês (R$)</span>${numIn('cfg-fixosMes', c.fixosMes, 'data-c="fixosMes"')}</label>
  </div><p class="note" style="margin-bottom:0">Os R$ 15.000 de custos fixos mensais são um valor de exemplo, usado no ponto de equilíbrio do Painel. Troque pelo total real da fábrica.</p></div>
  <div class="panel"><h3>Backup dos dados</h3>
    <p class="note" style="margin-top:0">${CLOUD.ref ? 'As alterações ficam salvas na nuvem e aparecem em todos os aparelhos de quem tem acesso. O backup é uma cópia de segurança extra: exporte um por semana e guarde no computador ou no Google Drive.' : 'Modo local: as alterações ficam salvas só neste aparelho. Para levar para outro, exporte o backup aqui e importe lá.'}</p>
    <div class="row">
      <button class="btn primary" id="bkExp">Exportar backup</button>
      <label class="btn" for="bkFile" style="display:inline-block">Importar backup</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
  </div></div>`;
  $('#bkExp').addEventListener('click',()=>{
    try{ const blob=new Blob([JSON.stringify(snapshotState(),null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fichas-chale-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); toast('Backup exportado'); }catch(e){ toast('Não foi possível exportar.'); }
  });
  $('#bkFile').addEventListener('change',e=>importBackup(e.target.files[0]));
  
  app.querySelectorAll('[data-c]').forEach(x=>x.addEventListener('input',()=>{ S.config={...S.config,[x.dataset.c]:parseNum(x.value)}; save(); }));
  const setItem=(i,patch,rerender)=>{ S.config={...S.config, custos:S.config.custos.map((x,k)=>k===i?{...x,...patch}:x)}; save(); if(rerender) render(); };
  app.querySelectorAll('[data-cn]').forEach(x=>x.addEventListener('input',()=>setItem(+x.dataset.cn,{nome:x.value})));
  app.querySelectorAll('[data-cv]').forEach(x=>x.addEventListener('input',()=>setItem(+x.dataset.cv,{valor:parseNum(x.value)})));
  app.querySelectorAll('[data-cb]').forEach(x=>x.addEventListener('change',()=>setItem(+x.dataset.cb,{base:x.value})));
  app.querySelectorAll('[data-ct]').forEach(x=>x.addEventListener('change',()=>{ setItem(+x.dataset.ct,{tipo:x.value},true); toast(x.value==='fixo'?'Movido para CUSTOS FIXOS':'Movido para CUSTOS VARIAVEIS'); }));
  app.querySelectorAll('[data-cx]').forEach(b=>{ let armed=false,t; b.addEventListener('click',()=>{ if(!armed){ armed=true; b.textContent='Excluir?'; b.classList.add('danger'); t=setTimeout(()=>{armed=false; b.textContent='✕'; b.classList.remove('danger');},3000); return; } clearTimeout(t); const i=+b.dataset.cx; S.config={...S.config, custos:S.config.custos.filter((x,k)=>k!==i)}; save(); render(); toast('Custo excluído'); }); });
  app.querySelectorAll('[data-cadd]').forEach(b=>b.addEventListener('click',()=>{ const tipo=b.dataset.cadd; S.config={...S.config, custos:[...S.config.custos,{id:'c-'+Date.now().toString(36), nome:'Novo custo', valor:0, base:'lote', tipo}]}; save(); render(); const i=S.config.custos.length-1; const n=app.querySelector(`[data-cn="${i}"]`); n?.focus(); n?.select(); }));
}

// formata números ao sair do campo
app.addEventListener('blur', e=>{ const t=e.target; if(t.matches && t.matches('input.num')) t.value = fmtIn(parseNum(t.value)); }, true);

document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{ S.tab=b.dataset.tab; pendingRender=false; render(); try{history.replaceState(null,'','#'+S.tab);}catch(e){} }));
const h=(location.hash||'').slice(1); if(['painel','fichas','insumos','custos'].includes(h)) S.tab=h;

// ---------- dados ----------
const DEFAULT = {"config": {"embalagem": 120, "transporte": 12, "armazenamento": 2.5, "perda": 12, "imposto": 117.6, "comissaoKg": 1.5, "funcionarios": 150, "energia": 12, "adm": 20, "peso": 0.4, "meta": 0.35, "fixosMes": 15000}, "insumos": {}, "produtos": []};
function loadState(d){
  S.config=migrateConfig(d.config);
  S.insumos=JSON.parse(JSON.stringify(d.insumos));
  S.produtos=(d.produtos||[]).map(p=>({...p, receita:{...(p.receita||{})}})).sort((a,b)=>(+a.ordem||0)-(+b.ordem||0));
}
function importBackup(f){
  if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!validState(d)) throw 0; loadState(d); S.loaded={c:true,i:true,p:true}; persist(); toast('Dados importados'); render(); }catch(err){ toast('Arquivo inválido. Use um backup exportado por este site.'); } };
  rd.readAsText(f);
}
function validState(d){ return d && typeof d==='object' && d.config && typeof d.config==='object' && d.insumos && typeof d.insumos==='object' && Array.isArray(d.produtos); }
let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
const cfg=window.FIREBASE_CONFIG||{};
const hasCloud=!!(cfg.apiKey && cfg.projectId && window.firebase);
const focusedInput=()=>{ const a=document.activeElement; return !!(a && app.contains(a) && (a.tagName==='INPUT'||a.tagName==='SELECT')); };
function showApp(on){ $('#topHeader').hidden=!on; app.hidden=!on; $('#login').hidden=on; }
app.addEventListener('focusout',()=>setTimeout(()=>{ if(pendingData && !focusedInput()){ loadState(pendingData); pendingData=null; render(); } },0));
if(!hasCloud){
  loadState(validState(saved)? saved : DEFAULT);
  S.loaded={c:true,i:true,p:true};
  setSave('modo local · salvo só neste aparelho');
  showApp(true); render();
} else {
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), fsdb=firebase.firestore();
  $('#loginLogo').src=$('.brand .logo').src;
  const msg=(t,err)=>{ const m=$('#lgMsg'); m.textContent=t; m.classList.toggle('err',!!err); };
  const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/invalid-email':'Digite um e-mail válido.','auth/missing-password':'Digite a senha.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos e tente de novo.','auth/network-request-failed':'Sem internet. Verifique a conexão.','auth/user-disabled':'Este acesso foi desativado pela gestão.'};
  $('#loginForm').addEventListener('submit',async e=>{
    e.preventDefault(); const btn=$('#lgBtn'); btn.disabled=true; msg('Entrando…');
    try{ await auth.signInWithEmailAndPassword($('#lgEmail').value.trim(), $('#lgSenha').value); msg(''); }
    catch(err){ msg(ERR[err.code]||'Não foi possível entrar. Tente de novo.', true); }
    finally{ btn.disabled=false; }
  });
  $('#lgReset').addEventListener('click',async()=>{
    const em=$('#lgEmail').value.trim(); if(!em){ msg('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".', true); return; }
    try{ await auth.sendPasswordResetEmail(em); msg('Se este e-mail tiver acesso, enviamos um link para criar uma nova senha. Veja também o spam.'); }
    catch(err){ msg(ERR[err.code]||'Não foi possível enviar o e-mail.', true); }
  });
  $('#sair').addEventListener('click',()=>auth.signOut());
  let unsub=null;
  auth.onAuthStateChanged(u=>{
    if(unsub){ unsub(); unsub=null; }
    if(!u){ CLOUD.ref=null; S.loaded={c:false,i:false,p:false}; $('#userBox').hidden=true; showApp(false); return; }
    CLOUD.email=u.email||''; $('#userEmail').textContent=CLOUD.email; $('#userBox').hidden=false;
    showApp(true); app.innerHTML='<div class="panel empty"><h2>Carregando as fichas</h2><p>Buscando os dados na nuvem…</p></div>'; setSave('conectando…');
    const ref=fsdb.collection('fichas').doc('dados'); CLOUD.ref=ref;
    unsub=ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites || cloudDirty) return;
      if(!snap.exists){ const ok=validState(saved)&&saved.produtos.length; loadState(ok? saved : DEFAULT); S.loaded={c:true,i:true,p:true}; if(ok) persist(); else setSave('nuvem vazia · importe os dados'); render(); return; }
      const d=snap.data(); if(!validState(d)) return;
      S.loaded={c:true,i:true,p:true};
      setSave('salvo na nuvem'+(d.atualizadoPor? ' · última alteração por '+d.atualizadoPor : ''));
      if(focusedInput()){ pendingData=d; return; }
      loadState(d); render();
    }, err=>{
      if(err && err.code==='permission-denied') app.innerHTML=`<div class="panel empty"><h2>Acesso não liberado</h2><p>O e-mail ${esc(CLOUD.email)} entrou, mas ainda não tem permissão para ver as fichas. Peça para a gestão liberar este e-mail.</p><button class="btn" id="sair2">Sair</button></div>`, $('#sair2')?.addEventListener('click',()=>auth.signOut());
      else toast('Erro de conexão com a nuvem. Recarregue a página.');
    });
  });
}
})();
</script>

</body>
</html>
