<style>
/* Layout: barra lateral escura (madeira) + área de trabalho clara; no celular vira barra superior + abas no rodapé */
:root{
  --bg:#F6F4F1; --surface:#FFFFFF; --sunken:#F1EDE8; --ink:#1E1915; --muted:#756C64; --faint:#A0968D; --line:#E6E0D9; --line2:#D8D0C7;
  --side:#2A1C12; --side2:#3A2819; --side-ink:#EFE2CB; --side-muted:#B59F84; --gold:#D29A38;
  --accent:#9A5D14; --accent-ink:#FFFFFF; --accent-soft:#F6ECDD;
  --ok:#2C7A47; --ok-soft:#E3F1E7; --warn:#A3620B; --warn-soft:#FBEEDA; --bad:#B42318; --bad-soft:#FBE3E0;
  --s-cmu:#9A5D14; --s-var:#DDA94F; --s-fix:#A8998A; --s-luc:#2C7A47;
  --shadow:0 1px 2px rgba(30,25,21,.05),0 1px 1px rgba(30,25,21,.03);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110F; --surface:#1D1916; --sunken:#24201C; --ink:#EFEAE4; --muted:#A99F96; --faint:#7D746C; --line:#2F2925; --line2:#3D3530;
  --side:#110C08; --side2:#1E150E; --side-ink:#EFE2CB; --side-muted:#A08B72; --gold:#E1AE52;
  --accent:#E1AE52; --accent-ink:#1A1208; --accent-soft:#33281A;
  --ok:#73C58E; --ok-soft:#18301F; --warn:#E8B25E; --warn-soft:#382A14; --bad:#F2877C; --bad-soft:#3B1D1A;
  --s-cmu:#C98A35; --s-var:#E6BD6E; --s-fix:#7E7165; --s-luc:#5FB47C; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110F; --surface:#1D1916; --sunken:#24201C; --ink:#EFEAE4; --muted:#A99F96; --faint:#7D746C; --line:#2F2925; --line2:#3D3530;
  --side:#110C08; --side2:#1E150E; --side-ink:#EFE2CB; --side-muted:#A08B72; --gold:#E1AE52;
  --accent:#E1AE52; --accent-ink:#1A1208; --accent-soft:#33281A;
  --ok:#73C58E; --ok-soft:#18301F; --warn:#E8B25E; --warn-soft:#382A14; --bad:#F2877C; --bad-soft:#3B1D1A;
  --s-cmu:#C98A35; --s-var:#E6BD6E; --s-fix:#7E7165; --s-luc:#5FB47C; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;border-bottom:1px solid var(--side2)}
.brand img{width:44px;height:44px;border-radius:9px;object-fit:cover;box-shadow:0 0 0 1px rgba(210,154,56,.6)}
.brand b{display:block;font:700 18px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--side-muted)}
.negsw{display:grid;grid-template-columns:.8fr 1.1fr 1fr;gap:4px;background:var(--side2);border-radius:10px;padding:4px;margin-top:16px}
.negsw button{border:0;background:none;color:var(--side-muted);font-weight:700;font-size:12.5px;padding:7px 4px;border-radius:7px;cursor:pointer}
.negsw button[aria-pressed="true"]{background:var(--gold);color:#22160C}
.nav{display:grid;gap:2px;margin-top:12px}
.navgrp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);opacity:.75;padding:14px 12px 6px;display:flex;align-items:center;gap:8px}
.navgrp:first-child{padding-top:4px}
.navgrp::after{content:"";flex:1;height:1px;background:var(--side2)}
.nav .grpsw,.mbk,#mbk{display:none!important}
.phead .area{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.area.prod{background:var(--accent-soft);color:var(--accent)} .area.fin{background:var(--ok-soft);color:var(--ok)}
table.dre td:first-child{white-space:normal;min-width:220px}
table.dre tr.res td{font-weight:700;background:var(--accent-soft);font-size:15px}
table.dre tr.sub td{color:var(--muted);font-size:13px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-muted);padding:10px 12px;border-radius:9px;font-weight:600;cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--side2);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side2);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--side2);font-size:12px;color:var(--side-muted);display:grid;gap:6px}
.side .foot .who{color:var(--side-ink);font-weight:600;word-break:break-all}
.side .foot button{justify-self:start;background:none;border:1px solid var(--side2);color:var(--side-ink);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.busy{background:var(--gold)} .dot.err{background:var(--bad)}

main{min-width:0;padding:28px 32px 64px}
.page{max-width:1160px;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.phead p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* ---------- elements ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.card-h .sub{font-size:13px;color:var(--muted)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:4px}
.kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;transition:border-color .12s}
.in:hover{border-color:var(--faint)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.num{text-align:right}
.in[disabled]{background:transparent;border-color:transparent}
select.in{appearance:auto;padding-right:6px}
.field{display:grid;gap:5px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;color:var(--faint);width:30px;height:30px;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn.armed{background:var(--bad);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .neg{color:var(--bad)} .pos{color:var(--ok)} .b{font-weight:700}
.note{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line2);border-bottom:0;background:var(--sunken)}
td.name{white-space:normal;min-width:150px}
td.name small{color:var(--faint);margin-left:4px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
td .in{padding:6px 8px}
.mbar{position:relative;height:6px;border-radius:9px;background:var(--sunken);width:90px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:visible}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--ok)}
.mbar i.warn{background:var(--warn)} .mbar i.bad{background:var(--bad)}
.mbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

/* painel */
.metabox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px}
.metabox .in{width:64px;padding:5px 8px}

/* fichas */
.fwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.flist{position:sticky;top:20px;padding:10px}
.flist .search{margin-bottom:8px}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.fitem:hover{background:var(--sunken)}
.fitem[aria-current="true"]{background:var(--accent-soft)}
.fitem b{font-weight:600;font-size:14px;display:block}
.fitem small{color:var(--muted);font-size:12px}
.fitem .pct{font-size:12px;font-weight:700}
.fchips{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fhead{padding:18px 20px;display:grid;gap:14px}
.fhead .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ftitle{min-width:0;flex:1 1 280px}
.fhead .nameIn{width:100%;font-size:22px;font-weight:700;border-color:transparent;padding:4px 8px;margin-left:-8px;max-width:420px}
.fhead .nameIn:hover{border-color:var(--line2)}
.fhead .meta{display:grid;grid-template-columns:repeat(4,minmax(0,160px));gap:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.metric{padding:14px 20px;border-right:1px solid var(--line);min-width:0}
.metric:last-child{border-right:0}
.metric .l{font-size:12px;color:var(--muted);font-weight:600}
.metric .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.metric .h{font-size:12.5px;color:var(--muted)}
.metric.hl{background:var(--ok-soft)} .metric.hl .v{color:var(--ok)}
.metric.hl.bad{background:var(--bad-soft)} .metric.hl.bad .v{color:var(--bad)}
.stack{padding:16px 20px 18px;border-top:1px solid var(--line)}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.sbar span{display:block;height:100%}
.slegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.slegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600;margin:0}
.dl dd{margin:2px 0 0;font-weight:700;font-size:15px}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.addrow select{max-width:280px}

/* caixa */
.mesnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.mesnav .in{width:170px;border-color:transparent;padding:6px 8px}
.mesnav .btn{font-size:20px;line-height:1;padding:4px 12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.kbad{background:var(--bad-soft)}
.v.pos,.pos{color:var(--ok)} .warnc{color:var(--warn)} .faint{color:var(--faint)}
.pill.neutral{background:var(--sunken);color:var(--muted)}
.lform{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.lform .btn{height:38px;justify-content:center}
.stbtn{border:1px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.stbtn.prev{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.stbtn.venc{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bpair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bpair span{width:40%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.ba{background:var(--ok)} .bb{background:var(--s-cmu)}
.bcol small{font-size:11.5px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 5px 0 12px;vertical-align:-1px}
.lg.a{background:var(--ok)} .lg.b{background:var(--s-cmu)}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
table.dfc tr.grp td{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:14px;border-bottom:1px solid var(--line2)}
table.dfc tr.grp.in td{color:var(--ok)} table.dfc tr.grp.out td{color:var(--s-cmu)}
table.dfc tr.tot td{font-weight:700;background:var(--sunken)}
table.dfc tr.sec td{font-weight:700;background:var(--accent-soft)}
table.dfc tr.fim td{font-size:15px;border-top:2px solid var(--line2)}

@media (max-width:600px){.lform{grid-template-columns:1fr 1fr}.lform .grow{grid-column:1/-1}.lform .btn{grid-column:1/-1}.kpis.k3{grid-template-columns:1fr}.mesnav .in{width:140px}}

.alerts{display:grid}
.al{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.al:last-child{border-bottom:0}
.al p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.al .dot2{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--faint)}
.al.bad .dot2{background:var(--bad)} .al.warn .dot2{background:var(--warn)} .al.info .dot2{background:var(--gold)}
/* empty / login */
.empty{padding:48px 24px;text-align:center}
.empty h2{margin:0 0 6px;font-size:20px}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:52ch}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .art{background:var(--side);color:var(--side-ink);display:grid;place-items:center;padding:40px}
.login .art div{text-align:center;max-width:360px}
.login .art img{width:220px;height:220px;border-radius:18px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.login .art h2{font:700 30px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 6px}
.login .art p{color:var(--side-muted);margin:0}
.login form{align-self:center;justify-self:center;width:100%;max-width:380px;padding:32px 24px;display:grid;gap:14px}
.login form h1{margin:0;font-size:26px}
.login .msg{min-height:1.3em;margin:0;font-size:14px}
.login .msg.err{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:980px){.fwrap{grid-template-columns:1fr}.flist{display:none}.fchips{display:flex}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand{border:0;padding:0}
  .brand div{display:none}
  .negsw{margin:0 auto 0 12px;flex:1;max-width:240px}
  .brand img{width:36px;height:36px}
  .side .foot{margin:0;border:0;padding:0;display:flex;align-items:center;gap:10px}
  .side .foot .who,.side .foot .st{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));background:var(--side);border-top:1px solid var(--side2);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 1px;text-align:center;justify-content:center;line-height:1.15}
  .nav button[aria-current="page"]{box-shadow:none;color:var(--gold)}
  .navgrp,.nav .sys,.nav .mhide{display:none}
  .nav .grpsw{display:flex;color:var(--gold)}
  .mbk{display:inline-flex;background:none;border:1px solid var(--side2);color:var(--side-ink);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}

<script>
(function(){
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const view=$('#view');
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const N2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N3=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
const P1=new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});
const money=v=>isFinite(v)?BRL.format(v):'–';
const pct=v=>isFinite(v)?P1.format(v):'–';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum=s=>{ if(typeof s==='number') return s; s=String(s||'').trim().replace(/\s/g,'').replace(/R\$/,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); const v=parseFloat(s); return isFinite(v)?v:0; };
const fmtIn=v=>N3.format(+v||0);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const S={view:'painel',neg:'embutidos',sel:null,q:'',qi:'',data:null,loaded:false,canWrite:true};
['config','insumos','produtos'].forEach(k=>Object.defineProperty(S,k,{get(){ return S.data?S.data[S.neg][k]:(k==='produtos'?[]:k==='insumos'?{}:null); },set(v){ S.data[S.neg][k]=v; }}));
const NEG={
  embutidos:{nome:'Embutidos',itens:'linguiça',novo:'Nova linguiça',classe:'Linguiça Fresca',preco:14,receita:40,receitaLbl:'Receita',file:'fichas-chale-dados-iniciais.json',dica:'Carne Suína e Gordura Suína: use o preço de transferência da granja.'},
  acougue:{nome:'Açougue',itens:'corte',novo:'Novo corte',classe:'Corte Bovino',preco:33.5,receita:1,receitaLbl:'Matéria-prima (kg)',file:'fichas-acougue-dados-iniciais.json',dica:'Carcaças: use o preço médio pago por kg na compra.'}
};
const N=()=>NEG[S.neg];

// ================= modelo de custos =================
const CUSTOS_ORIGINAIS=[
  {id:'transporte',nome:'Transporte',valor:12,base:'lote',tipo:'variavel'},
  {id:'armazenamento',nome:'Armazenamento',valor:2.5,base:'lote',tipo:'variavel'},
  {id:'perda',nome:'Taxa de Perda',valor:12,base:'lote',tipo:'variavel'},
  {id:'roi',nome:'ROI ( Retorno do Capital Investido)',valor:10,base:'lote',tipo:'variavel'},
  {id:'embalagem',nome:'Embalagem',valor:120,base:'lote',tipo:'variavel'},
  {id:'comissao',nome:'Comissão de Vendas',valor:1.5,base:'kg',tipo:'variavel'},
  {id:'energia',nome:'Energia',valor:12,base:'lote',tipo:'fixo'},
  {id:'funcionarios',nome:'Funcionarios',valor:150,base:'lote',tipo:'fixo'},
  {id:'adm',nome:'Despesas Adm',valor:20,base:'lote',tipo:'fixo'},
  {id:'erro',nome:'Margem De Erro',valor:200,base:'lote',tipo:'fixo'},
  {id:'imposto',nome:'Imposto',valor:117.6,base:'lote',tipo:'fixo'}
];
const OLD_KEYS={transporte:'transporte',armazenamento:'armazenamento',perda:'perda',embalagem:'embalagem',comissao:'comissaoKg',energia:'energia',funcionarios:'funcionarios',adm:'adm',imposto:'imposto'};
function migrateConfig(c){
  c={...(c||{})};
  if(!Array.isArray(c.custos)){
    c.custos=CUSTOS_ORIGINAIS.map(x=>{ const k=OLD_KEYS[x.id]; return {...x,valor:(k&&c[k]!=null)?+c[k]:x.valor}; });
    Object.values(OLD_KEYS).forEach(k=>delete c[k]);
  } else c.custos=c.custos.map(x=>({...x}));
  if(c.peso==null) c.peso=0.4;
  if(c.meta==null) c.meta=0.35;
  if(c.fixosMes==null) c.fixosMes=15000;
  return c;
}
const itemLote=(x,kg)=>x.base==='kg'?(+x.valor||0)*kg:(+x.valor||0);
const porcao=()=>{ const p=+(S.config&&S.config.peso)||0.4; return p>=1?(p===1?'1 kg':N3.format(p)+' kg'):N3.format(p*1000)+'g'; };
const STATUS={ok:'Na meta',warn:'Abaixo da meta',bad:'Prejuízo',rend:'Falta rendimento'};
function calc(p){
  const c=S.config||{}; const rec=p.receita||{};
  let kgBruto=0,ing=0;
  for(const id in rec){ const q=+rec[id]||0; kgBruto+=q; ing+=q*(+(S.insumos[id]?.preco)||0); }
  const rendRaw=(p.rendimento===null||p.rendimento===undefined||p.rendimento==='')?null:+p.rendimento/100;
  const rend=rendRaw&&rendRaw>0?rendRaw:1, semRend=S.neg==='acougue'&&rendRaw==null;
  const kg=kgBruto*rend;
  const peso=+c.peso||0.4, pac=peso>0?kg/peso:0;
  const custos=c.custos||[];
  const varItens=custos.filter(x=>x.tipo!=='fixo'), fixItens=custos.filter(x=>x.tipo==='fixo');
  const varLote=varItens.reduce((s,x)=>s+itemLote(x,kg),0), fixLote=fixItens.reduce((s,x)=>s+itemLote(x,kg),0);
  const ingP=pac?ing/pac:0, varP=pac?varLote/pac:0, fixP=pac?fixLote/pac:0;
  const preco=+p.preco||0, cv=ingP+varP, mc=preco-cv, mcp=preco?mc/preco:0;
  const meta=+c.meta||0, precoMeta=meta<1?Math.ceil((cv/(1-meta))/0.5)*0.5:NaN;
  const lucro=mc-fixP, total=ing+varLote+fixLote, custoPorcao=pac?total/pac:0;
  const status=semRend?'rend':(mc<0?'bad':(mcp<meta?'warn':'ok'));
  return {kgBruto,rend,semRend,kg,pac,peso,ing,varLote,fixLote,varItens,fixItens,ingP,varP,fixP,preco,cv,mc,mcp,meta,precoMeta,lucro,lucrop:preco?lucro/preco:0,total,custoPorcao,custoKg:kg?total/kg:0,precoKg:peso?preco/peso:0,margemLucro:preco?(preco-custoPorcao)/preco:0,status};
}

// ================= gravação =================
const KEY='fichas-chale-de-ouro-v1';
const CLOUD={ref:null,email:'',fs:null};
let persistT, cloudDirty=false, pendingData=null;
function setSave(t,kind){ $('#saveState').textContent=t; $('#dot').className='dot'+(kind?' '+kind:''); }
const snapshotState=()=>({negocios:S.data,salvoEm:new Date().toISOString()});
function save(){
  clearTimeout(persistT); setSave('Salvando…','busy'); cloudDirty=true;
  persistT=setTimeout(async()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(snapshotState())); }catch(e){}
    if(!CLOUD.ref){ cloudDirty=false; setSave('Salvo neste aparelho'); return; }
    try{ await CLOUD.ref.set({...JSON.parse(JSON.stringify(snapshotState())),atualizadoPor:CLOUD.email}); setSave('Salvo na nuvem'); }
    catch(e){ setSave('Não foi salvo','err'); toast(e&&e.code==='permission-denied'?'Seu e-mail não tem permissão para alterar as fichas.':'Não foi possível salvar. Verifique a internet.'); }
    finally{ cloudDirty=false; }
  },600);
}
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

// ================= helpers de render =================
const focusedInput=()=>{ const a=document.activeElement; return !!(a&&view.contains(a)&&(a.tagName==='INPUT'||a.tagName==='SELECT')); };
const dis=()=>S.canWrite?'':' disabled';
const numIn=(id,val,attrs='')=>`<input class="in num" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(val))}" ${attrs}${dis()}>`;
const sortedInsumos=()=>Object.entries(S.insumos).map(([id,v])=>({id,...v})).sort((a,b)=>(a.ordem??999)-(b.ordem??999)||String(a.nome).localeCompare(b.nome,'pt'));
const ICON_X='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const ICON_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function armDelete(btn,onConfirm,label){
  let armed=false,t; const orig=btn.innerHTML;
  btn.addEventListener('click',()=>{ if(!armed){ armed=true; btn.classList.add('armed'); if(label) btn.textContent=label; t=setTimeout(()=>{armed=false;btn.classList.remove('armed');btn.innerHTML=orig;},3500); return; } clearTimeout(t); onConfirm(); });
}
function mbar(r){ const w=Math.max(0,Math.min(1,r.mcp/0.6))*100, m=Math.min(1,r.meta/0.6)*100; return `<span class="mbar" aria-hidden="true"><i class="${r.status==='ok'?'':r.status==='rend'?'warn':r.status}" style="width:${w}%"></i><u style="left:${m}%"></u></span>`; }

function render(){
  $$('.negsw button').forEach(b=>b.setAttribute('aria-pressed',String(S.geral?b.dataset.neg==='geral':b.dataset.neg===S.neg)));
  if(S.geral){ document.title='Chalé de Ouro · Visão geral'; const nav=$('#nav'); nav.style.setProperty('--n',2);
    nav.innerHTML=`<div class="navgrp">Gestão</div><button data-view="geral" aria-current="${S.view!=='backup'}">${ICONS.resultado}<span>Visão geral</span></button><div class="navgrp">Sistema</div><button data-view="backup" aria-current="${S.view==='backup'}">${ICONS.backup}<span>Backup</span></button>`;
    $$('#nav button').forEach(b=>b.addEventListener('click',()=>{ S.view=b.dataset.view; render(); window.scrollTo(0,0); }));
    if(!S.loaded){ view.innerHTML=`<div class="card empty"><h2>Carregando</h2><p>Buscando os dados…</p></div>`; return; }
    if(S.view==='backup') vBackup(); else vGeral(); return; }
  renderNav();
  document.title='Fichas · '+N().nome;
  if(!S.loaded){ view.innerHTML=`<div class="card empty"><h2>Carregando as fichas</h2><p>Buscando os dados…</p></div>`; return; }
  if(S.neg==='embutidos'&&['painel','fichas','insumos','custos'].includes(S.view)&&(!S.produtos.length&&!Object.keys(S.insumos).length)){

    <tbody>${rows.map(({p,r})=>`<tr class="click" data-open="${esc(p.id)}" tabindex="0">

  $$('[data-open]').forEach(tr=>{ const go=()=>{ S.sel=tr.dataset.open; go2('fichas'); }; tr.addEventListener('click',go); tr.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); });
}

            <label class="field"><span class="lbl">Rendimento (%)</span><input class="in num" id="pRend" inputmode="decimal" autocomplete="off" placeholder="${S.neg==='acougue'?'informe':'100'}" value="${p.rendimento==null||p.rendimento===''?(S.neg==='acougue'?'':'100'):esc(fmtIn(p.rendimento))}"${dis()}></label>

function fNav(){

  const fc=$('#fChips'); if(fc) fc.innerHTML=S.produtos.map(x=>`<button class="chip" data-sel="${esc(x.id)}" aria-pressed="${x.id===S.sel}">${esc(x.nome||'Sem nome')}</button>`).join('');
  $$('[data-sel]').forEach(b=>b.addEventListener('click',()=>{ S.sel=b.dataset.sel; render(); window.scrollTo(0,0); }));
}
function costTable(items,r,col){
  const tot=items.reduce((s,x)=>s+itemLote(x,r.kg),0);
  if(!items.length) return `<p class="note" style="padding:14px 18px;margin:0">Nenhum custo neste grupo.</p>`;
  return `<table><thead><tr><th>${col}</th><th>Custo</th><th>Custo Por (KG)</th><th>Por porção</th></tr></thead>
    <tbody>${items.map(x=>{ const v=itemLote(x,r.kg); return `<tr><td class="name">${esc(x.nome)}${x.base==='kg'?`<small>${money(+x.valor||0)}/kg</small>`:''}</td><td>${money(v)}</td><td class="muted">${money(r.kg?v/r.kg:0)}</td><td>${money(r.pac?v/r.pac:0)}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${money(tot)}</td><td>${money(r.kg?tot/r.kg:0)}</td><td>${money(r.pac?tot/r.pac:0)}</td></tr></tfoot></table>`;
}
function fCalc(p){
  const r=calc(p), rec=p.receita||{}, L=porcao();
  for(const id in rec){ const q=+rec[id]||0, i=S.insumos[id];
    const pc=document.getElementById('pc-'+id); if(pc) pc.textContent=pct(r.kgBruto?q/r.kgBruto:0);
    const ct=document.getElementById('ct-'+id); if(ct) ct.textContent=money(q*(+i?.preco||0)); }
  const ik=$('#ingKg'); if(ik) ik.textContent=N2.format(r.kgBruto)+' kg';
  const it=$('#ingTot'); if(it) it.textContent=money(r.ing);
  $('#fMetrics').innerHTML=`
    <div class="metric"><div class="l">Custo Porção ${L}</div><div class="v">${money(r.custoPorcao)}</div><div class="h">custo total da porção</div></div>
    <div class="metric hl ${r.mc<0?'bad':''}"><div class="l">Margem de contribuição</div><div class="v">${money(r.mc)}</div><div class="h">${pct(r.mcp)} do preço</div></div>
    <div class="metric"><div class="l">Lucro por porção</div><div class="v ${r.lucro<0?'neg':''}">${money(r.lucro)}</div><div class="h">${pct(r.lucrop)} do preço</div></div>
    <div class="metric"><div class="l">Situação</div><div class="v" style="font-size:16px;margin-top:6px"><span class="pill ${r.status==='rend'?'warn':r.status}">${STATUS[r.status]}</span></div><div class="h">preço p/ meta: ${money(r.precoMeta)}</div></div>`;
  const P=r.preco||1, seg=v=>Math.max(0,v)/P*100;
  const luc=Math.max(0,r.lucro);
  $('#fStack').innerHTML=`<div class="lbl" style="margin-bottom:8px">Para onde vai o preço de ${money(r.preco)}</div>
    <div class="sbar" role="img" aria-label="Composição do preço"><span style="width:${seg(r.ingP)}%;background:var(--s-cmu)"></span><span style="width:${seg(r.varP)}%;background:var(--s-var)"></span><span style="width:${seg(r.fixP)}%;background:var(--s-fix)"></span><span style="width:${seg(luc)}%;background:var(--s-luc)"></span></div>
    <div class="slegend"><span><i style="background:var(--s-cmu)"></i>CUSTO COM CMU ${money(r.ingP)} <span class="muted">· ${pct(r.ingP/P)}</span></span><span><i style="background:var(--s-var)"></i>Variáveis ${money(r.varP)} <span class="muted">· ${pct(r.varP/P)}</span></span><span><i style="background:var(--s-fix)"></i>Fixos ${money(r.fixP)} <span class="muted">· ${pct(r.fixP/P)}</span></span><span><i style="background:var(--s-luc)"></i>Lucro ${money(r.lucro)} <span class="muted">· ${pct(r.lucrop)}</span></span></div>
    ${r.semRend?`<p class="note" style="margin:8px 0 0;color:var(--warn)"><b>Falta o rendimento.</b> Informe quantos % da matéria-prima viram este corte (desossa). Sem isso, o custo está calculado como se nada se perdesse.</p>`:''}
    ${r.lucro<0?`<p class="note neg" style="margin:8px 0 0">Os custos passam do preço: cada porção vendida dá prejuízo de ${money(-r.lucro)}.</p>`:''}`;
  $('#fDados').innerHTML=[
    ['Quantidade (Bruta)',N2.format(r.kgBruto)+' kg'],['Rendimento',r.semRend?'não informado':pct(r.rend)],['Quantidade final',N2.format(r.kg)+' kg'],['Peso Porção',r.peso>=1?N3.format(r.peso)+' kg':N3.format(r.peso*1000)+' Gramas'],['Porções por lote',N2.format(r.pac)],
    ['CUSTO TOTAL',money(r.total)],['Custo Kg',money(r.custoKg)],['Preço de Venda Kg',money(r.precoKg)],
    ['Margem de Lucro '+L,pct(r.margemLucro)],['Preço mínimo',money(r.cv)],['Preço p/ meta de '+pct(r.meta),money(r.precoMeta)]
  ].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('#fVar').innerHTML=costTable(r.varItens,r,'Variavel');
  $('#fFix').innerHTML=costTable(r.fixItens,r,'Fixa');
}
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'item'; }
function novoProduto(base){
  const nome=base&&base.nome?base.nome+' (cópia)':N().novo;
  const id=slug(nome)+'-'+Date.now().toString(36);
  const ordem=Math.max(0,...S.produtos.map(x=>+x.ordem||0))+1;
  const p={id,nome,classificacao:base?.classificacao||N().classe,preco:base&&base.preco?+base.preco:N().preco,receitaBase:base&&base.receitaBase!=null?+base.receitaBase:N().receita,rendimento:base?base.rendimento??null:(S.neg==='acougue'?null:100),ordem,receita:base&&base.receita?{...base.receita}:{}};
  S.produtos.push(p); S.sel=id; save(); S.view='fichas'; render(); setTimeout(()=>{ const n=$('#pNome'); n?.focus(); n?.select(); },0);
}

          ${S.canWrite?`<td style="width:44px"><button class="icon-btn" data-cx="${i}" aria-label="Excluir ${esc(x.nome)}">${ICON_X}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="5" class="note">Nenhum custo neste grupo.</td></tr>`}</tbody>
      </table></div>
      ${S.canWrite?`<div class="addrow"><button class="btn ghost" data-cadd="${tipo}">${ICON_PLUS} Adicionar ${tipo==='fixo'?'custo fixo':'custo variável'}</button></div>`:''}</section>`;

  view.innerHTML=`<div class="phead"><div><span class="area prod">Produção</span><br><h1>Custos · ${N().nome}</h1><p>Os custos da ficha técnica, iguais para todos os produtos de ${N().nome}. Qualquer mudança aqui atualiza o Painel e todas as Fichas.</p></div></div>
  <div class="grid">

  $$('[data-c]').forEach(x=>x.addEventListener('input',()=>{ S.config={...S.config,[x.dataset.c]:parseNum(x.value)}; save(); }));

  $$('[data-cv]').forEach(x=>x.addEventListener('input',()=>setItem(+x.dataset.cv,{valor:parseNum(x.value)})));

// ================= CAIXA: compras, entradas e fluxo de caixa (separado por negócio) =================
const CATS={
  embutidos:{entrada:['Vendas externas','Vendas às churrascarias','Outras entradas'],
             saida:['Carne do Açougue (transferência)','Carne e matéria-prima','Tripa, temperos e insumos','Embalagens','Funcionários','Energia','Comissões','Impostos e taxas','Transporte e combustível','Manutenção e serviços','Sistema e internet','Investimentos e dívidas antigas','Outras saídas']},
  acougue:{entrada:['Churrascaria Gravatá (C002)','Churrascaria Caaporã (C003)','Vendas externas','Transferência para Embutidos','Outras entradas'],
           saida:['Compra de carne bovina','Compra de carne suína','Compra de outras carnes','Embalagens','Funcionários','Energia','Comissões','Impostos e taxas','Transporte e combustível','Manutenção e serviços','Sistema e internet','Investimentos e dívidas antigas','Outras saídas']}
};
const COMPRA_CATS=['Compra de carne bovina','Compra de carne suína','Compra de outras carnes'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const hoje=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const mesLbl=m=>{ const [y,mm]=m.split('-'); return MESES[+mm-1]+' de '+y; };
const mesCurto=m=>{ const [y,mm]=m.split('-'); return MESES[+mm-1].slice(0,3)+'/'+y.slice(2); };
const addMes=(m,n)=>{ let [y,mm]=m.split('-').map(Number); mm+=n; while(mm>12){mm-=12;y++;} while(mm<1){mm+=12;y--;} return y+'-'+String(mm).padStart(2,'0'); };
const dataBR=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
S.mes=hoje().slice(0,7);
S.lanc={embutidos:{},acougue:{}};
const KEY_L='fichas-chale-lancamentos-v1';
try{ const l=JSON.parse(localStorage.getItem(KEY_L)||'null'); if(l&&typeof l==='object') S.lanc={embutidos:l.embutidos||{},acougue:l.acougue||{}}; }catch(e){}
const lancMes=(neg,m)=>(S.lanc[neg]&&S.lanc[neg][m])||[];
const allLanc=neg=>Object.values(S.lanc[neg]||{}).flat();
const cashL=neg=>allLanc(neg).filter(x=>!x.reg);
const regMes=(neg,m)=>lancMes(neg,m).filter(x=>x.reg);
const cashDate=x=>{ if(x.status!=='previsto') return x.pago||x.data; const d=x.venc||x.data, t=hoje(); return d<t?t:d; };
const vencido=x=>x.status==='previsto'&&(x.venc||x.data)<hoje();
const findMes=id=>{ for(const [m,arr] of Object.entries(S.lanc[S.neg]||{})) if(arr.some(x=>x.id===id)) return m; return null; };
const lancT={}, lancDirty={};
function saveLanc(neg,m){
  const key='lanc-'+neg+'-'+m; lancDirty[key]=true; setSave('Salvando…','busy');
  clearTimeout(lancT[key]);
  lancT[key]=setTimeout(async()=>{
    try{ localStorage.setItem(KEY_L,JSON.stringify(S.lanc)); }catch(e){}
    if(!CLOUD.fs){ lancDirty[key]=false; setSave('Salvo neste aparelho'); return; }
    try{ await CLOUD.fs.collection('fichas').doc(key).set({tipo:'lanc',neg,mes:m,itens:JSON.parse(JSON.stringify(lancMes(neg,m))),atualizadoPor:CLOUD.email}); setSave('Salvo na nuvem'); }
    catch(e){ setSave('Não foi salvo','err'); toast(e&&e.code==='permission-denied'?'Seu e-mail não tem permissão para alterar os dados.':'Não foi possível salvar. Verifique a internet.'); }
    finally{ lancDirty[key]=false; }
  },400);
}
function addLanc(...items){ const ms=new Set(); for(const item of items){ const m=item.data.slice(0,7); S.lanc[S.neg]={...S.lanc[S.neg],[m]:[...lancMes(S.neg,m),item]}; ms.add(m); } ms.forEach(m=>saveLanc(S.neg,m)); }
function delLanc(id){ const it=allLanc(S.neg).find(x=>x.id===id); if(!it) return; const ids=new Set([id]); allLanc(S.neg).forEach(x=>{ if((it.par&&x.id===it.par)||x.par===id) ids.add(x.id); }); for(const [m,arr] of Object.entries(S.lanc[S.neg])){ if(arr.some(x=>ids.has(x.id))){ S.lanc[S.neg]={...S.lanc[S.neg],[m]:arr.filter(x=>!ids.has(x.id))}; saveLanc(S.neg,m); } } }
function toggleLanc(id){ const m=findMes(id); if(!m) return; S.lanc[S.neg]={...S.lanc[S.neg],[m]:lancMes(S.neg,m).map(x=>{ if(x.id!==id) return x; if(x.status==='previsto'){ const t=hoje(); return {...x,status:'realizado',pago:t<x.data?x.data:t}; } const y={...x,status:'previsto'}; delete y.pago; return y; })}; saveLanc(S.neg,m); }
const stLbl=x=>vencido(x)?'Vencido '+dataBR(x.venc||x.data):x.tipo==='entrada'?(x.status==='previsto'?'A receber':'Recebido'):(x.status==='previsto'?'A pagar':'Pago');
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):(+x.valor||0)),0);
const sinal=x=>x.tipo==='entrada'?+x.valor||0:-(+x.valor||0);
function caixaCfg(){ const c=S.config||{}; return {saldoInicial:+c.saldoInicial||0,inicio:c.inicioCaixa||'2026-06'}; }
function saldoAntes(m){ const {saldoInicial,inicio}=caixaCfg(); let s=saldoInicial; for(const x of cashL(S.neg)){ if(x.status==='previsto') continue; const cm=cashDate(x).slice(0,7); if(cm>=inicio&&cm<m) s+=sinal(x); } return s; }
function mesNav(){ return `<div class="mesnav"><button class="btn ghost" id="mPrev" aria-label="Mês anterior">‹</button><input class="in" type="month" id="mSel" value="${S.mes}"><button class="btn ghost" id="mNext" aria-label="Próximo mês">›</button></div>`; }
function bindMesNav(rerender){
  $('#mPrev')?.addEventListener('click',()=>{ S.mes=addMes(S.mes,-1); rerender(); });
  $('#mNext')?.addEventListener('click',()=>{ S.mes=addMes(S.mes,1); rerender(); });

}
function defData(){ const t=hoje(); return t.slice(0,7)===S.mes?t:S.mes+'-01'; }
function bars(rows){ // rows: [{m,a,b}] a=entradas b=saidas

}
function lancForm(tipoFixo,cats,comKg){

    <label class="field"><span class="lbl">Situação</span><select class="in" id="lSt"><option value="realizado">${tipoFixo==='entrada'?'Recebido':tipoFixo==='saida'?'Pago':'Pago / Recebido'}</option><option value="previsto">${tipoFixo==='entrada'?'A receber':tipoFixo==='saida'?'A pagar':'A pagar / A receber'}</option></select></label>

function bindLancForm(tipoFixo,after){
  const f=$('#lForm'); if(!f) return;
  const tSel=$('#lTipo');
  if(tSel){ const fill=()=>{ $('#lCat').innerHTML=CATS[S.neg][tSel.value].map(c=>`<option>${esc(c)}</option>`).join(''); }; tSel.addEventListener('change',fill); }
  f.addEventListener('submit',e=>{

    if(data.slice(0,7)!==S.mes){ S.mes=data.slice(0,7); toast('Lançado em '+mesLbl(S.mes)); } else toast('Lançado');
    after(); setTimeout(()=>$('#lValor')?.focus(),0);
  });
}

// ---------- RESULTADO (DRE gerencial) ----------
const RAT=['Funcionários','Transporte e combustível','Comissões','Energia','Sistema e internet','Manutenção e serviços','Impostos e taxas','Outras saídas'];
function dreMes(m,neg=S.neg){
  const R={venda:0,compra:0,tin:0,tout:0,emb:0,desp:0,inv:0,det:{}};
  for(const x of allLanc(neg)){
    if(x.reg){ if(x.data.slice(0,7)!==m) continue; if(x.tipo==='entrada') R.venda+=+x.valor||0; else R.compra+=+x.valor||0; continue; }
    const mm=(x.status==='previsto'?x.data:(x.pago||x.data)).slice(0,7); if(mm!==m) continue;
    const v=+x.valor||0;
    if(x.cat==='Transferência para Embutidos') R.tin+=v;
    else if(x.cat==='Carne do Açougue (transferência)') R.tout+=v;
    else if(x.tipo==='saida'&&RAT.includes(x.cat)){ R.desp+=v; R.det[x.cat]=(R.det[x.cat]||0)+v; }
    else if(x.tipo==='saida'&&x.cat==='Embalagens'&&neg==='acougue') R.emb+=v;
    else if(x.tipo==='saida'&&x.cat==='Investimentos e dívidas antigas') R.inv+=v;
  }
  R.res=R.venda+R.tin-R.compra-R.tout-R.emb-R.desp; R.pct=R.venda?R.res/R.venda:NaN; return R;
}
function vResultado(){
  const ms=[...Array(6)].map((_,i)=>addMes(S.mes,i-5)), D=ms.map(m=>dreMes(m)), tot=k=>sum(D,x=>x[k]);
  const ac=S.neg==='acougue';
  const linha=(lbl,k,sinal,cls='')=>`<tr class="${cls}"><td>${lbl}</td>${D.map(x=>`<td>${x[k]?(sinal<0?'− ':'')+money(x[k]):'<span class="faint">–</span>'}</td>`).join('')}<td class="b">${tot(k)?(sinal<0?'− ':'')+money(tot(k)):'–'}</td></tr>`;
  const det=RAT.filter(c=>D.some(x=>x.det[c])).map(c=>`<tr class="sub"><td>&nbsp;&nbsp;${c}</td>${D.map(x=>`<td>${x.det[c]?money(x.det[c]):'–'}</td>`).join('')}<td>${money(sum(D,x=>x.det[c]||0))}</td></tr>`).join('');
  const cur=D[5], prev=D[4];
  view.innerHTML=`<div class="phead"><div><span class="area fin">Financeiro</span><br><h1>Resultado · ${N().nome}</h1><p>Quanto ${ac?'o açougue':'a fábrica'} ganhou ou perdeu em cada mês, separado do outro negócio.</p></div>${mesNav()}</div>
  <div class="kpis">
    <div class="card kpi ${cur.res<0?'kbad':''}"><div class="l">Resultado de ${mesCurto(S.mes)}</div><div class="v ${cur.res<0?'neg':'pos'}">${money(cur.res)}</div><div class="h">${isFinite(cur.pct)?pct(cur.pct)+' das vendas':'–'}</div></div>
    <div class="card kpi"><div class="l">Mês anterior</div><div class="v ${prev.res<0?'neg':''}">${money(prev.res)}</div><div class="h">${isFinite(prev.pct)?pct(prev.pct)+' das vendas':'–'}</div></div>
    <div class="card kpi"><div class="l">Acumulado 6 meses</div><div class="v ${tot('res')<0?'neg':''}">${money(tot('res'))}</div><div class="h">${tot('venda')?pct(tot('res')/tot('venda'))+' das vendas':'–'}</div></div>

  </div>

function negInfo(neg,m){

  const cash=cashL(neg);

  const vPag=venc.filter(x=>x.tipo==='saida'), vRec=venc.filter(x=>x.tipo==='entrada');
  const aRec=cash.filter(x=>x.status==='previsto'&&x.tipo==='entrada'), aPag=cash.filter(x=>x.status==='previsto'&&x.tipo==='saida');
  const top=(arr)=>{ const g={}; arr.forEach(x=>{ const k=String(x.cat).startsWith('Churrascaria')?x.cat:(x.desc||x.cat).split(' · ')[0]; g[k]=(g[k]||0)+(+x.valor||0); }); return Object.entries(g).sort((a,b)=>b[1]-a[1]); };
  return {d,p,vPag,vRec,aRec,aPag,top};
}

      ${sai.map(x=>row(x)).join('')}
      <tr class="tot out"><td>Total de saídas</td>${TS.w.map(v=>`<td class="hsm">${fmt0(v)}</td>`).join('')}<td>${money(TS.r)}</td><td>${money(TS.p)}</td></tr>
      <tr class="sec"><td>Resultado do mês (entradas − saídas)</td>${TE.w.map((v,i)=>`<td class="hsm ${v-TS.w[i]<0?'neg':''}">${fmt0(v-TS.w[i])}</td>`).join('')}<td class="b ${eR-sR<0?'neg':'pos'}">${money(eR-sR)}</td><td class="muted">${money(eP-sP)}</td></tr>
      <tr class="sec fim"><td>Saldo final</td>${semLbl.map(()=>'<td class="hsm"></td>').join('')}<td class="b ${fim<0?'neg':''}">${money(fim)}</td><td class="b ${proj<0?'neg':''}" title="Saldo final + a receber − a pagar">${money(proj)}</td></tr>
    </tbody></table></div></section>
  ${S.canWrite?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Novo lançamento</h2><span class="sub">qualquer entrada ou saída</span></div><div class="card-b">${lancForm(null,cats.saida,false)}</div></section>`:''}
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Lançamentos de ${mesLbl(m)}</h2><span class="sub">${L.length} lançamento${L.length===1?'':'s'} · toque na situação para mudar</span></div><div class="tw">${lancTable(L,{tipo:true,cash:true})}</div></section>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>Últimos 6 meses</h2><span class="sub"><i class="lg a"></i>Entradas <i class="lg b"></i>Saídas</span></div><div class="card-b">${bars(hist)}</div></section>
    <section class="card"><div class="card-h"><h2>Saldo mês a mês</h2></div><div class="tw"><table><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Resultado</th><th>Saldo final</th></tr></thead>
      <tbody>${hist.slice().reverse().map(h=>`<tr><td>${mesCurto(h.m)}</td><td class="pos">${money(h.a)}</td><td>${money(h.b)}</td><td class="${h.a-h.b<0?'neg':''}">${money(h.a-h.b)}</td><td class="b ${h.fim<0?'neg':''}">${money(h.fim)}</td></tr>`).join('')}</tbody></table></div></section>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>Caixa inicial</h2></div><div class="card-b"><div class="grid g2">
    <label class="field"><span class="lbl">Saldo em caixa no início do controle (R$)</span>${numIn('cxSaldo',cfg.saldoInicial)}</label>
    <label class="field"><span class="lbl">Mês de início do controle</span><input class="in" type="month" id="cxIni" value="${cfg.inicio}"${dis()}></label>
  </div><p class="note" style="margin:10px 0 0">Coloque quanto ${S.neg==='acougue'?'o açougue':'a fábrica'} tinha em caixa e banco no primeiro dia do mês de início. O saldo de cada mês é calculado a partir daí.</p></div></section>`;
  bindMesNav(vFluxo); bindLancForm(null,vFluxo); bindLancTable(m,vFluxo);
  $('#cxSaldo')?.addEventListener('input',e=>{ S.config={...S.config,saldoInicial:parseNum(e.target.value)}; save(); });
  $('#cxIni')?.addEventListener('change',e=>{ if(e.target.value){ S.config={...S.config,inicioCaixa:e.target.value}; save(); vFluxo(); } });
}

const ICONS={"painel": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1.5\"/><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1.5\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1.5\"/></svg>", "fichas": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h4\"/></svg>", "insumos": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 8 12 3 3 8l9 5 9-5z\"/><path d=\"M3 8v8l9 5 9-5V8M12 13v8\"/></svg>", "custos": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/></svg>", "backup": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z\"/><path d=\"M12 12v6M9.5 15.5 12 18l2.5-2.5\"/></svg>", "resumo": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/></svg>", "compras": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"20\" r=\"1.5\"/><circle cx=\"18\" cy=\"20\" r=\"1.5\"/><path d=\"M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6\"/></svg>", "entradas": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"13\" rx=\"2\"/><circle cx=\"12\" cy=\"12.5\" r=\"2.5\"/><path d=\"M6 10v.01M18 15v.01\"/></svg>", "fluxo": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3\"/></svg>"};
const NAVS={
  embutidos:{prod:[['painel','Painel de margens'],['fichas','Fichas técnicas'],['insumos','Insumos'],['custos','Custos do lote']],fin:[]},
  acougue:{prod:[['resumo','Produção do mês'],['compras','Compras de carne']],fin:[['resultado','Resultado'],['entradas','Entradas'],['fluxo','Fluxo de caixa']]}
};
ICONS.resultado='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>';
ICONS.troca='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>';
const allViews=neg=>[...NAVS[neg].prod,...NAVS[neg].fin,['backup','Backup']].map(x=>x[0]);
const grpOf=v=>NAVS[S.neg].fin.some(x=>x[0]===v)?'fin':v==='backup'?'sys':'prod';
function renderNav(){
  if(!allViews(S.neg).includes(S.view)) S.view=NAVS[S.neg].prod[0][0];
  const btn=([v,l],cls='')=>`<button data-view="${v}" class="${cls}" aria-current="${v===S.view?'page':'false'}">${ICONS[v]}<span>${l}</span></button>`;
  const nav=$('#nav');
  nav.style.setProperty('--n',NAVS[S.neg].prod.length+1);
  nav.innerHTML=`<div class="navgrp">Fichas técnicas</div>${NAVS[S.neg].prod.map(x=>btn(x)).join('')}
    <div class="navgrp">Sistema</div>${btn(['backup','Backup'])}`;
  $$('#nav button[data-view]').forEach(b=>b.addEventListener('click',()=>go2(b.dataset.view)));
}
// ================= navegação =================
function go2(v){ S.view=v; try{history.replaceState(null,'','#'+v);}catch(e){} render(); window.scrollTo(0,0); }
S.neg='embutidos'; S.geral=false;
$('#mbk')?.addEventListener('click',()=>go2('backup'));
$$('.negsw button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.neg==='geral'){ S.geral=true; S.view='geral'; try{localStorage.setItem('fichas-neg','geral');}catch(e){} render(); window.scrollTo(0,0); return; } if(S.geral){ S.geral=false; S.neg=b.dataset.neg; S.view=NAVS[S.neg].prod[0][0]; try{localStorage.setItem('fichas-neg',S.neg);}catch(e){} render(); window.scrollTo(0,0); return; } if(S.neg===b.dataset.neg) return; S.neg=b.dataset.neg; S.sel=null; S.q=''; S.qi=''; if(!allViews(S.neg).includes(S.view)) S.view=NAVS[S.neg].prod[0][0]; try{localStorage.setItem('fichas-neg',S.neg);}catch(e){} render(); window.scrollTo(0,0); }));
const h0=(location.hash||'').slice(1); if(['painel','fichas','insumos','custos','backup'].includes(h0)) S.view=h0;
view.addEventListener('blur',e=>{ const t=e.target; if(t.matches&&t.matches('input.num')) t.value=fmtIn(parseNum(t.value)); },true);
view.addEventListener('focusout',()=>setTimeout(()=>{ if(pendingData&&!focusedInput()){ loadState(pendingData); pendingData=null; render(); } },0));

// ================= dados =================
const DEFAULT={"embutidos": {"config": {"custos": [{"id": "transporte", "nome": "Transporte", "valor": 12, "base": "lote", "tipo": "variavel"}, {"id": "armazenamento", "nome": "Armazenamento", "valor": 2.5, "base": "lote", "tipo": "variavel"}, {"id": "perda", "nome": "Taxa de Perda", "valor": 12, "base": "lote", "tipo": "variavel"}, {"id": "roi", "nome": "ROI ( Retorno do Capital Investido)", "valor": 10, "base": "lote", "tipo": "variavel"}, {"id": "embalagem", "nome": "Embalagem", "valor": 120, "base": "lote", "tipo": "variavel"}, {"id": "comissao", "nome": "Comissão de Vendas", "valor": 1.5, "base": "kg", "tipo": "variavel"}, {"id": "energia", "nome": "Energia", "valor": 12, "base": "lote", "tipo": "fixo"}, {"id": "funcionarios", "nome": "Funcionarios", "valor": 150, "base": "lote", "tipo": "fixo"}, {"id": "adm", "nome": "Despesas Adm", "valor": 20, "base": "lote", "tipo": "fixo"}, {"id": "erro", "nome": "Margem De Erro", "valor": 200, "base": "lote", "tipo": "fixo"}, {"id": "imposto", "nome": "Imposto", "valor": 117.6, "base": "lote", "tipo": "fixo"}], "peso": 0.4, "meta": 0.35, "fixosMes": 15000}, "insumos": {}, "produtos": []}, "acougue": {"config": {"custos": [{"id": "embalagem", "nome": "Embalagem", "valor": 0, "base": "kg", "tipo": "variavel"}, {"id": "transporte", "nome": "Transporte", "valor": 0, "base": "kg", "tipo": "variavel"}, {"id": "perda", "nome": "Taxa de Perda", "valor": 0, "base": "kg", "tipo": "variavel"}, {"id": "comissao", "nome": "Comissão de Vendas", "valor": 0, "base": "kg", "tipo": "variavel"}, {"id": "imposto", "nome": "Imposto", "valor": 0, "base": "kg", "tipo": "variavel"}, {"id": "funcionarios", "nome": "Funcionarios", "valor": 0, "base": "kg", "tipo": "fixo"}, {"id": "energia", "nome": "Energia", "valor": 0, "base": "kg", "tipo": "fixo"}, {"id": "adm", "nome": "Despesas Adm", "valor": 0, "base": "kg", "tipo": "fixo"}], "peso": 1, "meta": 0.25, "fixosMes": 0}, "insumos": {}, "produtos": []}};
const validNeg=d=>!!(d&&typeof d==='object'&&d.config&&typeof d.config==='object'&&d.insumos&&typeof d.insumos==='object'&&Array.isArray(d.produtos));
const validState=d=>!!(d&&typeof d==='object'&&(d.negocios&&typeof d.negocios==='object'||validNeg(d)));
function normNeg(n,def){
  n=validNeg(n)?n:def;
  return {config:migrateConfig(n.config),insumos:JSON.parse(JSON.stringify(n.insumos||{})),produtos:(n.produtos||[]).map(p=>({...p,receita:{...(p.receita||{})}})).sort((a,b)=>(+a.ordem||0)-(+b.ordem||0))};
}
function loadState(d){
  const e=d&&d.negocios?d.negocios.embutidos:d, a=d&&d.negocios?d.negocios.acougue:null;
  S.data={embutidos:normNeg(e,DEFAULT.embutidos),acougue:normNeg(a,DEFAULT.acougue)};
}
const hasData=d=>validState(d)&&(d.negocios?Object.values(d.negocios).some(n=>n&&n.produtos&&n.produtos.length):d.produtos.length>0);
function importBackup(f){
  if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(d&&d.lancamentos&&typeof d.lancamentos==='object'){ let n=0; if(d.completo){ for(const ng of ['embutidos','acougue']){ for(const m of Object.keys(S.lanc[ng]||{})){ if(!(d.lancamentos[ng]&&d.lancamentos[ng][m])){ S.lanc[ng]={...S.lanc[ng],[m]:[]}; saveLanc(ng,m); } } } } for(const ng of ['embutidos','acougue']){ const L=d.lancamentos[ng]; if(!L) continue; for(const [m,arr] of Object.entries(L)){ if(!Array.isArray(arr)) continue; S.lanc[ng]={...S.lanc[ng],[m]:arr}; saveLanc(ng,m); n+=arr.length; } } if(d.saldoInicial&&S.data){ for(const ng of ['embutidos','acougue']) if(d.saldoInicial[ng]!=null) S.data[ng].config={...S.data[ng].config,saldoInicial:+d.saldoInicial[ng],inicioCaixa:d.saldoInicial.data||'2026-06'}; save(); } if(!validState(d)){ toast(n+' lançamentos importados'); render(); return; } } if(!validState(d)) throw 0; if(d.negocios){ loadState(d); toast('Backup completo importado'); } else { if(!S.data) loadState({negocios:{}}); S.data[S.neg]=normNeg(d,DEFAULT[S.neg]); S.sel=null; toast('Dados importados em '+N().nome); } S.loaded=true; save(); render(); }catch(err){ toast('Arquivo inválido. Use um backup exportado por este site.'); } };
  rd.readAsText(f);
}
let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
const cfg=window.FIREBASE_CONFIG||{};
const hasCloud=!!(cfg.apiKey&&cfg.projectId&&window.firebase);
const show=app=>{ $('#shell').hidden=!app; $('#login').hidden=app; };
if(!hasCloud){
  loadState(validState(saved)?saved:{negocios:{}}); S.loaded=true; setSave('Salvo neste aparelho'); show(true); render();
} else {
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), fsdb=firebase.firestore();
  $('#loginLogo').src=$('#logo').src;
  const msg=(t,err)=>{ const m=$('#lgMsg'); m.textContent=t; m.classList.toggle('err',!!err); };
  const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/invalid-email':'Digite um e-mail válido.','auth/missing-password':'Digite a senha.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos e tente de novo.','auth/network-request-failed':'Sem internet. Verifique a conexão.','auth/user-disabled':'Este acesso foi desativado pela gestão.'};
  $('#loginForm').addEventListener('submit',async e=>{ e.preventDefault(); const btn=$('#lgBtn'); btn.disabled=true; msg('Entrando…'); try{ await auth.signInWithEmailAndPassword($('#lgEmail').value.trim(),$('#lgSenha').value); msg(''); }catch(err){ msg(ERR[err.code]||'Não foi possível entrar. Tente de novo.',true); } finally{ btn.disabled=false; } });
  $('#lgReset').addEventListener('click',async()=>{ const em=$('#lgEmail').value.trim(); if(!em){ msg('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".',true); return; } try{ await auth.sendPasswordResetEmail(em); msg('Se este e-mail tiver acesso, enviamos um link para criar uma nova senha. Veja também o spam.'); }catch(err){ msg(ERR[err.code]||'Não foi possível enviar o e-mail.',true); } });
  $('#sair').addEventListener('click',()=>auth.signOut());
  let unsub=null, unsubL=null;
  auth.onAuthStateChanged(u=>{
    if(unsub){ unsub(); unsub=null; } if(unsubL){ unsubL(); unsubL=null; } CLOUD.fs=null;
    if(!u){ CLOUD.ref=null; S.loaded=false; $('#sair').hidden=true; show(false); return; }
    CLOUD.email=u.email||''; $('#userEmail').textContent=CLOUD.email; $('#sair').hidden=false;
    show(true); S.loaded=false; render(); setSave('Conectando…','busy');
    const ref=fsdb.collection('fichas').doc('dados'); CLOUD.ref=ref; CLOUD.fs=fsdb;
    unsubL=fsdb.collection('fichas').where('tipo','==','lanc').onSnapshot(qs=>{
      const L={embutidos:{...S.lanc.embutidos},acougue:{...S.lanc.acougue}};
      qs.docs.forEach(dc=>{ const x=dc.data(); if(!x||!L[x.neg]||!x.mes) return; if(lancDirty[dc.id]||dc.metadata.hasPendingWrites) return; L[x.neg][x.mes]=Array.isArray(x.itens)?x.itens:[]; });
      S.lanc=L; try{ localStorage.setItem(KEY_L,JSON.stringify(S.lanc)); }catch(e){}
      if(S.loaded&&['resumo','compras','entradas','fluxo','resultado','geral'].includes(S.view)&&!focusedInput()) render();
    },err=>{ if(err&&err.code!=='permission-denied') toast('Erro ao carregar os lançamentos. Recarregue a página.'); });
    unsub=ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||cloudDirty) return;
      if(!snap.exists){ const ok=hasData(saved); loadState(ok?saved:{negocios:{}}); S.loaded=true; if(ok) save(); else setSave('Nuvem vazia','busy'); render(); return; }
      const d=snap.data(); if(!validState(d)) return;
      S.loaded=true; setSave('Salvo na nuvem');
      if(focusedInput()){ pendingData=d; return; }
      loadState(d); render();
    },err=>{
      if(err&&err.code==='permission-denied'){ S.loaded=true; view.innerHTML=`<div class="card empty"><h2>Acesso não liberado</h2><p>O e-mail ${esc(CLOUD.email)} entrou, mas ainda não tem permissão para ver as fichas. Peça para a gestão liberar este e-mail.</p></div>`; setSave('Sem permissão','err'); }
      else { toast('Erro de conexão com a nuvem. Recarregue a página.'); setSave('Sem conexão','err'); }
    });
  });
}
})();
</script>
