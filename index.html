// ================= FICHAS =================
function vFichas(){
  if(!S.produtos.length){ view.innerHTML=`<div class="phead"><div><h1>Fichas</h1></div></div><div class="card empty"><h2>Nenhuma ficha</h2><p>Crie a primeira ficha de ${N().itens}.</p><button class="btn primary" id="novo"${dis()}>Nova ficha</button></div>`; $('#novo')?.addEventListener('click',()=>novoProduto()); return; }
  if(!S.sel||!S.produtos.find(p=>p.id===S.sel)) S.sel=S.produtos[0].id;
  const p=S.produtos.find(x=>x.id===S.sel);
  const rec=p.receita||{}, usados=Object.keys(rec);
  const livres=sortedInsumos().filter(i=>!(i.id in rec));
  view.innerHTML=`
  <div class="phead"><div><span class="area prod">Produção</span><br><h1>Fichas técnicas · Embutidos</h1><p>Receita, custo e margem de cada linguiça. Altere quantidades e preços e tudo se recalcula.</p></div></div>
  <div class="fchips" id="fChips"></div>
  <div class="fwrap">
    <aside class="card flist">
      <input class="in search" id="fq" placeholder="Buscar ficha…" value="${esc(S.q)}" autocomplete="off">
      <div id="fList"></div>
      ${S.canWrite?`<button class="btn ghost" id="novo" style="width:100%;margin-top:6px">${ICON_PLUS} Nova ficha</button>`:''}
    </aside>
    <div class="grid" style="min-width:0">
      <section class="card">
        <div class="fhead">
          <div class="top">
            <div class="ftitle">
              <div class="lbl" style="color:var(--accent);letter-spacing:.06em;text-transform:uppercase">Ficha técnica gerencial</div>
              <input class="in nameIn" id="pNome" aria-label="Produto" value="${esc(p.nome)}"${dis()}>
            </div>
            ${S.canWrite?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="dup">Duplicar</button><button class="btn danger" id="del">Excluir</button></div>`:''}
          </div>
          <div class="meta">
            <label class="field"><span class="lbl">Classificação</span><input class="in" id="pClass" value="${esc(p.classificacao||'Linguiça Fresca')}"${dis()}></label>
            <label class="field"><span class="lbl">${N().receitaLbl}</span>${numIn('pReceita',p.receitaBase??N().receita)}</label>
            <label class="field"><span class="lbl">Rendimento (%)</span><input class="in num" id="pRend" inputmode="decimal" autocomplete="off" placeholder="${S.neg==='acougue'?'informe':'100'}" value="${p.rendimento==null||p.rendimento===''?(S.neg==='acougue'?'':'100'):esc(fmtIn(p.rendimento))}"${dis()}></label>
            <label class="field"><span class="lbl">Preço de Venda ${S.neg==='acougue'?'Kg':'Porção '+porcao()}</span>${numIn('pPreco',p.preco)}</label>
            <label class="field"><span class="lbl">Preço de Venda Kg (granel)</span><input class="in num" id="pPrecoKg" inputmode="decimal" autocomplete="off" value="${p.precoKg?esc(fmtIn(p.precoKg)):''}" placeholder="${esc(N2.format((+p.preco||0)/(+S.config.peso||0.4)))}"${dis()}></label>
          </div>
        </div>
        <div class="metrics" id="fMetrics"></div>
        <div class="stack" id="fStack"></div>
      </section>

      <section class="card"><div class="card-h"><h2>Dados da ficha</h2></div><div class="card-b"><dl class="dl" id="fDados"></dl></div></section>

      <section class="card">
        <div class="card-h"><h2>Custo com CMU</h2><span class="sub">ingredientes do lote</span></div>
        <div class="tw"><table>
          <thead><tr><th>Ingredientes</th><th>Quantidade (KG)</th><th>Porcentagem (KG)</th><th class="hsm">Custo Unitario</th><th>Custo Total</th>${S.canWrite?'<th></th>':''}</tr></thead>
          <tbody>${usados.map(id=>{ const i=S.insumos[id]||{nome:'(insumo apagado)',preco:0,unid:''}; const q=+rec[id]||0; return `<tr>
            <td class="name">${esc(i.nome)}<small>${esc(i.unid||'')}</small></td>
            <td style="width:120px">${numIn('q-'+id,q,`data-q="${esc(id)}" style="width:100px"`)}</td>
            <td class="muted" id="pc-${esc(id)}"></td>
            <td class="muted hsm">${money(+i.preco||0)}</td>
            <td id="ct-${esc(id)}"></td>
            ${S.canWrite?`<td style="width:40px"><button class="icon-btn" data-rm="${esc(id)}" aria-label="Remover ${esc(i.nome)}">${ICON_X}</button></td>`:''}</tr>`; }).join('')}</tbody>
          <tfoot><tr><td>Total</td><td id="ingKg"></td><td>100%</td><td class="hsm"></td><td id="ingTot"></td>${S.canWrite?'<td></td>':''}</tr></tfoot>
        </table></div>
        ${S.canWrite?`<div class="addrow"><select class="in" id="addIng"><option value="">+ Adicionar ingrediente…</option>${livres.map(i=>`<option value="${esc(i.id)}">${esc(i.nome)}</option>`).join('')}</select><span class="note">Não achou? Cadastre em <a href="#" id="goIns">Insumos</a>.</span></div>`:''}
      </section>

      <div class="grid">
        <section class="card"><div class="card-h"><h2>Custos variaveis</h2><a href="#" class="note" data-gocustos>Editar</a></div><div class="tw" id="fVar"></div></section>
        <section class="card"><div class="card-h"><h2>Custos fixos</h2><a href="#" class="note" data-gocustos>Editar</a></div><div class="tw" id="fFix"></div></section>
      </div>
    </div>
  </div>`;
  fNav(); fCalc(p);
  $('#fq').addEventListener('input',e=>{ S.q=e.target.value; fNav(); });
  $('#novo')?.addEventListener('click',()=>novoProduto());
  $('#dup')?.addEventListener('click',()=>novoProduto(p));
  const del=$('#del'); if(del) armDelete(del,()=>{ S.produtos=S.produtos.filter(x=>x.id!==p.id); S.sel=null; save(); toast('Ficha excluída'); render(); },'Confirmar exclusão');
  $('#pNome')?.addEventListener('input',e=>{ p.nome=e.target.value; fNav(); save(); });
  $('#pClass')?.addEventListener('input',e=>{ p.classificacao=e.target.value; save(); });
  $('#pReceita')?.addEventListener('input',e=>{ p.receitaBase=parseNum(e.target.value); save(); });
  $('#pRend')?.addEventListener('input',e=>{ const t=e.target.value.trim(); p.rendimento=t===''?null:parseNum(t); fCalc(p); fNav(); save(); });
  $('#pPreco')?.addEventListener('input',e=>{ p.preco=parseNum(e.target.value); fCalc(p); fNav(); save(); });
  $('#pPrecoKg')?.addEventListener('input',e=>{ const v=parseNum(e.target.value); p.precoKg=isFinite(v)&&v>0?v:null; fCalc(p); save(); });
  $$('[data-q]').forEach(inp=>inp.addEventListener('input',()=>{ p.receita={...p.receita,[inp.dataset.q]:parseNum(inp.value)}; fCalc(p); fNav(); save(); }));
  $$('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ const r={...p.receita}; delete r[b.dataset.rm]; p.receita=r; save(); render(); }));
  $('#addIng')?.addEventListener('change',e=>{ const id=e.target.value; if(!id) return; p.receita={...p.receita,[id]:0}; save(); render(); setTimeout(()=>$('#q-'+CSS.escape(id))?.focus(),0); });
  $('#goIns')?.addEventListener('click',e=>{ e.preventDefault(); go2('insumos'); });
  $$('[data-gocustos]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); go2('custos'); }));
}
function fNav(){
  const q=norm(S.q);
  const list=S.produtos.filter(x=>!q||norm(x.nome).includes(q));
  const fl=$('#fList'); if(fl) fl.innerHTML=list.map(x=>{ const r=calc(x); return `<button class="fitem" data-sel="${esc(x.id)}" aria-current="${x.id===S.sel}"><span><b>${esc(x.nome||'Sem nome')}</b><small>${money(r.preco)}</small></span><span class="pct" style="color:var(--${r.status==='ok'?'ok':r.status==='bad'?'bad':'warn'})">${r.semRend?'—':pct(r.mcp)}</span></button>`; }).join('')||'<p class="note" style="padding:6px 10px">Nenhuma ficha encontrada.</p>';
  const fc=$('#fChips'); if(fc) fc.innerHTML=S.produtos.map(x=>`<button class="chip" data-sel="${esc(x.id)}" aria-pressed="${x.id===S.sel}">${esc(x.nome||'Sem nome')}</button>`).join('');
  $$('[data-sel]').forEach(b=>b.addEventListener('click',()=>{ S.sel=b.dataset.sel; render(); window.scrollTo(0,0); }));
}
function costTable(items,r,col){
  const tot=items.reduce((s,x)=>s+itemLote(x,r.kg),0);
  if(!items.length) return `<p class="note" style="padding:14px 18px;margin:0">Nenhum custo neste grupo.</p>`;
  return `<table><thead><tr><th>${col}</th><th>Custo</th><th>Custo Por (KG)</th><th>Por porção</th></tr></thead>
    <tbody>${items.map(x=>{ const v=itemLote(x,r.kg); return `<tr><td class="name">${esc(x.nome)}${x.base==='kg'?`<small>${money(+x.valor||0)}/kg</small>`:''}</td><td>${money(v)}</td><td class="muted">${money(r.kg?v/r.kg:0)}</td><td>${money(r.pac?v/r.pac:0)}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${money(tot)}</td><td>${money(r.kg?tot/r.kg:0)}</td><td>${money(r.pac?tot/r.pac:0)}</td></tr></tfoot></table>`;
}
function fCalc(p){
  const r=calc(p), rec=p.receita||{}, L=porcao();
  for(const id in rec){ const q=+rec[id]||0, i=S.insumos[id];
    const pc=document.getElementById('pc-'+id); if(pc) pc.textContent=pct(r.kgBruto?q/r.kgBruto:0);
    const ct=document.getElementById('ct-'+id); if(ct) ct.textContent=money(q*(+i?.preco||0)); }
  const ik=$('#ingKg'); if(ik) ik.textContent=N2.format(r.kgBruto)+' kg';
  const it=$('#ingTot'); if(it) it.textContent=money(r.ing);
  $('#fMetrics').innerHTML=`
    <div class="metric"><div class="l">Custo Porção ${L}</div><div class="v">${money(r.custoPorcao)}</div><div class="h">custo total da porção</div></div>
    <div class="metric hl ${r.mc<0?'bad':''}"><div class="l">Margem de contribuição</div><div class="v">${money(r.mc)}</div><div class="h">${pct(r.mcp)} do preço · Kg: ${money(r.mckg)} (${pct(r.mcpkg)})</div></div>
    <div class="metric"><div class="l">Lucro por porção</div><div class="v ${r.lucro<0?'neg':''}">${money(r.lucro)}</div><div class="h">${pct(r.lucrop)} do preço · Kg: ${money(r.lucrokg)}</div></div>
    <div class="metric"><div class="l">Situação</div><div class="v" style="font-size:16px;margin-top:6px"><span class="pill ${r.status==='rend'?'warn':r.status}">${STATUS[r.status]}</span></div><div class="h">preço p/ meta: ${money(r.precoMeta)}</div></div>`;
  const P=r.preco||1, seg=v=>Math.max(0,v)/P*100;
  const luc=Math.max(0,r.lucro);
  $('#fStack').innerHTML=`<div class="lbl" style="margin-bottom:8px">Para onde vai o preço de ${money(r.preco)}</div>
    <div class="sbar" role="img" aria-label="Composição do preço"><span style="width:${seg(r.ingP)}%;background:var(--s-cmu)"></span><span style="width:${seg(r.varP)}%;background:var(--s-var)"></span><span style="width:${seg(r.fixP)}%;background:var(--s-fix)"></span><span style="width:${seg(luc)}%;background:var(--s-luc)"></span></div>
    <div class="slegend"><span><i style="background:var(--s-cmu)"></i>CUSTO COM CMU ${money(r.ingP)} <span class="muted">· ${pct(r.ingP/P)}</span></span><span><i style="background:var(--s-var)"></i>Variáveis ${money(r.varP)} <span class="muted">· ${pct(r.varP/P)}</span></span><span><i style="background:var(--s-fix)"></i>Fixos ${money(r.fixP)} <span class="muted">· ${pct(r.fixP/P)}</span></span><span><i style="background:var(--s-luc)"></i>Lucro ${money(r.lucro)} <span class="muted">· ${pct(r.lucrop)}</span></span></div>
    ${r.semRend?`<p class="note" style="margin:8px 0 0;color:var(--warn)"><b>Falta o rendimento.</b> Informe quantos % da matéria-prima viram este corte (desossa). Sem isso, o custo está calculado como se nada se perdesse.</p>`:''}
    ${r.lucro<0?`<p class="note neg" style="margin:8px 0 0">Os custos passam do preço: cada porção vendida dá prejuízo de ${money(-r.lucro)}.</p>`:''}`;
  $('#fDados').innerHTML=[
    ['Quantidade (Bruta)',N2.format(r.kgBruto)+' kg'],['Rendimento',r.semRend?'não informado':pct(r.rend)],['Quantidade final',N2.format(r.kg)+' kg'],['Peso Porção',r.peso>=1?N3.format(r.peso)+' kg':N3.format(r.peso*1000)+' Gramas'],['Porções por lote',N2.format(r.pac)],
    ['CUSTO TOTAL',money(r.total)],['Custo Kg',money(r.custoKg)],['Preço de Venda Kg',money(r.precoKg)],
    ['Margem de Lucro '+L,pct(r.margemLucro)],['Preço mínimo',money(r.cv)],['Preço p/ meta de '+pct(r.meta),money(r.precoMeta)]
  ].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('#fVar').innerHTML=costTable(r.varItens,r,'Variavel');
  $('#fFix').innerHTML=costTable(r.fixItens,r,'Fixa');
}
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'item'; }
function novoProduto(base){
  const nome=base&&base.nome?base.nome+' (cópia)':N().novo;
  const id=slug(nome)+'-'+Date.now().toString(36);
  const ordem=Math.max(0,...S.produtos.map(x=>+x.ordem||0))+1;
  const p={id,nome,classificacao:base?.classificacao||N().classe,preco:base&&base.preco?+base.preco:N().preco,receitaBase:base&&base.receitaBase!=null?+base.receitaBase:N().receita,rendimento:base?base.rendimento??null:(S.neg==='acougue'?null:100),ordem,receita:base&&base.receita?{...base.receita}:{}};
  S.produtos.push(p); S.sel=id; save(); S.view='fichas'; render(); setTimeout(()=>{ const n=$('#pNome'); n?.focus(); n?.select(); },0);
}

// ================= INSUMOS =================
function vInsumos(){
  view.innerHTML=`<div class="phead"><div><span class="area prod">Produção</span><br><h1>Insumos · ${N().nome}</h1><p>Mude o preço uma vez aqui e todas as fichas que usam o ingrediente se atualizam.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="in" id="iq" placeholder="Buscar insumo…" value="${esc(S.qi)}" style="width:220px" autocomplete="off">${S.canWrite?`<button class="btn primary" id="novoIns">${ICON_PLUS} Novo insumo</button>`:''}</div></div>
    <div class="card"><div class="tw"><table>
      <thead><tr><th>Ingrediente</th><th style="text-align:left">Unid.</th><th>Custo Unitario (R$)</th><th>Usado em</th>${S.canWrite?'<th></th>':''}</tr></thead>
      <tbody id="iBody"></tbody></table></div></div>
    <p class="note" style="margin-top:12px">${N().dica}</p>`;
  iBody();
  $('#iq').addEventListener('input',e=>{ S.qi=e.target.value; iBody(); });
  $('#novoIns')?.addEventListener('click',()=>{ const id='ins-'+Date.now().toString(36); const ordem=Math.max(0,...Object.values(S.insumos).map(i=>+i.ordem||0))+1; S.insumos={...S.insumos,[id]:{nome:'Novo insumo',unid:'KG',preco:0,ordem}}; S.qi=''; save(); vInsumos(); const n=$(`[data-n="${id}"]`); n?.focus(); n?.select(); });
}
function iBody(){
  const q=norm(S.qi), uso=id=>S.produtos.filter(p=>p.receita&&id in p.receita).length;
  const list=sortedInsumos().filter(i=>!q||norm(i.nome).includes(q));
  $('#iBody').innerHTML=list.map(i=>{ const u=uso(i.id); return `<tr>
    <td><input class="in" data-n="${esc(i.id)}" value="${esc(i.nome)}" style="min-width:190px"${dis()}></td>
    <td style="text-align:left"><input class="in" data-u="${esc(i.id)}" value="${esc(i.unid||'')}" style="width:80px"${dis()}></td>
    <td style="width:150px">${numIn('pr-'+i.id,i.preco,`data-p="${esc(i.id)}" style="width:120px"`)}</td>
    <td class="muted">${u} ficha${u===1?'':'s'}</td>
    ${S.canWrite?`<td style="width:44px">${u?'':`<button class="icon-btn" data-x="${esc(i.id)}" aria-label="Excluir ${esc(i.nome)}">${ICON_X}</button>`}</td>`:''}</tr>`; }).join('')||`<tr><td colspan="5" class="note">Nenhum insumo encontrado.</td></tr>`;
  const set=(id,patch)=>{ S.insumos={...S.insumos,[id]:{...S.insumos[id],...patch}}; save(); };
  $$('[data-n]').forEach(x=>x.addEventListener('input',()=>set(x.dataset.n,{nome:x.value})));
  $$('[data-u]').forEach(x=>x.addEventListener('input',()=>set(x.dataset.u,{unid:x.value})));
  $$('[data-p]').forEach(x=>x.addEventListener('input',()=>set(x.dataset.p,{preco:parseNum(x.value)})));
  $$('[data-x]').forEach(b=>armDelete(b,()=>{ const c={...S.insumos}; delete c[b.dataset.x]; S.insumos=c; save(); iBody(); toast('Insumo excluído'); }));
}

// ================= CUSTOS =================
function vCustos(){
  const c=S.config;
  const sec=(tipo,title,col)=>{
    const items=(c.custos||[]).map((x,i)=>({x,i})).filter(o=>(o.x.tipo==='fixo')===(tipo==='fixo'));
    return `<section class="card"><div class="card-h"><h2>${title}</h2><span class="sub">${tipo==='fixo'?'entram só no lucro':'entram na margem de contribuição'}</span></div>
      <div class="tw"><table>
        <thead><tr><th>${col}</th><th>Custo (R$)</th><th style="text-align:left">Cobrado</th><th style="text-align:left">Tipo</th>${S.canWrite?'<th></th>':''}</tr></thead>
        <tbody>${items.map(({x,i})=>`<tr>
          <td><input class="in" data-cn="${i}" value="${esc(x.nome)}" style="min-width:220px"${dis()}></td>
          <td style="width:140px">${numIn('cv-'+i,x.valor,`data-cv="${i}" style="width:112px"`)}</td>
          <td style="text-align:left;width:130px"><select class="in" data-cb="${i}"${dis()}><option value="lote"${x.base!=='kg'?' selected':''}>por lote</option><option value="kg"${x.base==='kg'?' selected':''}>por kg</option></select></td>
          <td style="text-align:left;width:130px"><select class="in" data-ct="${i}"${dis()}><option value="variavel"${x.tipo!=='fixo'?' selected':''}>Variável</option><option value="fixo"${x.tipo==='fixo'?' selected':''}>Fixo</option></select></td>
          ${S.canWrite?`<td style="width:44px"><button class="icon-btn" data-cx="${i}" aria-label="Excluir ${esc(x.nome)}">${ICON_X}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="5" class="note">Nenhum custo neste grupo.</td></tr>`}</tbody>
      </table></div>
      ${S.canWrite?`<div class="addrow"><button class="btn ghost" data-cadd="${tipo}">${ICON_PLUS} Adicionar ${tipo==='fixo'?'custo fixo':'custo variável'}</button></div>`:''}</section>`;
  };
  view.innerHTML=`<div class="phead"><div><span class="area prod">Produção</span><br><h1>Custos · ${N().nome}</h1><p>Os custos da ficha técnica, iguais para todos os produtos de ${N().nome}. Qualquer mudança aqui atualiza o Painel e todas as Fichas.</p></div></div>
  <div class="grid">
    ${sec('variavel','Custos variaveis','Variavel')}
    ${sec('fixo','Custos fixos','Fixa')}
    <p class="note" style="margin:0">Para mudar um custo de grupo, troque o Tipo. “Por kg” multiplica o valor pelos kg do lote, como a Comissão de Vendas.</p>
    <section class="card"><div class="card-h"><h2>${S.neg==='acougue'?'Açougue':'Fábrica'}</h2></div><div class="card-b">
      <div class="grid g2">
        <label class="field"><span class="lbl">Peso Porção (kg)${S.neg==='acougue'?' · use 1 para vender por kg':''}</span>${numIn('cfg-peso',c.peso,'data-c="peso"')}</label>
        <label class="field"><span class="lbl">Custos fixos ${S.neg==='acougue'?'do açougue':'da fábrica'} no mês (R$)</span>${numIn('cfg-fixosMes',c.fixosMes,'data-c="fixosMes"')}</label>
      </div>
      <p class="note" style="margin:10px 0 0">Os custos fixos do mês são usados no ponto de equilíbrio do Painel.</p>
    </div></section>
  </div>`;
  const setItem=(i,patch,re)=>{ S.config={...S.config,custos:S.config.custos.map((x,k)=>k===i?{...x,...patch}:x)}; save(); if(re) vCustos(); };
  $$('[data-c]').forEach(x=>x.addEventListener('input',()=>{ S.config={...S.config,[x.dataset.c]:parseNum(x.value)}; save(); }));
  $$('[data-cn]').forEach(x=>x.addEventListener('input',()=>setItem(+x.dataset.cn,{nome:x.value})));
  $$('[data-cv]').forEach(x=>x.addEventListener('input',()=>setItem(+x.dataset.cv,{valor:parseNum(x.value)})));
  $$('[data-cb]').forEach(x=>x.addEventListener('change',()=>setItem(+x.dataset.cb,{base:x.value})));
  $$('[data-ct]').forEach(x=>x.addEventListener('change',()=>{ setItem(+x.dataset.ct,{tipo:x.value},true); toast(x.value==='fixo'?'Movido para Custos fixos':'Movido para Custos variaveis'); }));
  $$('[data-cx]').forEach(b=>armDelete(b,()=>{ const i=+b.dataset.cx; S.config={...S.config,custos:S.config.custos.filter((x,k)=>k!==i)}; save(); vCustos(); toast('Custo excluído'); }));
  $$('[data-cadd]').forEach(b=>b.addEventListener('click',()=>{ S.config={...S.config,custos:[...S.config.custos,{id:'c-'+Date.now().toString(36),nome:'Novo custo',valor:0,base:'lote',tipo:b.dataset.cadd}]}; save(); vCustos(); const n=$(`[data-cn="${S.config.custos.length-1}"]`); n?.focus(); n?.select(); }));
}

// ================= BACKUP =================
function vBackup(){
  view.innerHTML=`<div class="phead"><div><span class="area" style="background:var(--sunken);color:var(--muted)">Sistema</span><br><h1>Backup</h1><p>${CLOUD.ref?'As alterações ficam salvas na nuvem e aparecem em todos os aparelhos de quem tem acesso. O backup é uma cópia extra de segurança.':'Modo local: as alterações ficam salvas só neste aparelho.'}</p></div></div>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>Exportar</h2></div><div class="card-b"><p class="note" style="margin-top:0">Baixa um arquivo com fichas, custos, vendas, metas, vendedores e bônus. Faça um por semana e guarde no computador ou no Google Drive.</p><button class="btn primary" id="bkExp">Exportar backup</button></div></section>
    <section class="card"><div class="card-h"><h2>Importar</h2></div><div class="card-b"><p class="note" style="margin-top:0">Use um backup exportado por este site ou o arquivo de dados iniciais das fichas.</p><label class="btn" for="bkFile">Escolher arquivo</label><input type="file" id="bkFile" accept=".json,application/json" hidden></div></section>
  </div>`;
  $('#bkExp').addEventListener('click',()=>{ try{ const blob=new Blob([JSON.stringify({...snapshotState(),lancamentos:S.lanc,vendas:S.vend,bases:S.bases},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fichas-chale-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast('Backup exportado'); }catch(e){ toast('Não foi possível exportar.'); } });
  $('#bkFile').addEventListener('change',e=>importBackup(e.target.files[0]));
}

// ================= CAIXA: compras, entradas e fluxo de caixa (separado por negócio) =================
const CATS={
  embutidos:{entrada:['Vendas externas','Vendas às churrascarias','Outras entradas'],
             saida:['Carne do Açougue (transferência)','Carne e matéria-prima','Tripa, temperos e insumos','Embalagens','Funcionários','Energia','Comissões','Impostos e taxas','Transporte e combustível','Manutenção e serviços','Sistema e internet','Investimentos e dívidas antigas','Outras saídas']},
  acougue:{entrada:['Churrascaria Gravatá (C002)','Churrascaria Caaporã (C003)','Vendas externas','Transferência para Embutidos','Outras entradas'],
           saida:['Compra de carne bovina','Compra de carne suína','Compra de outras carnes','Embalagens','Funcionários','Energia','Comissões','Impostos e taxas','Transporte e combustível','Manutenção e serviços','Sistema e internet','Investimentos e dívidas antigas','Outras saídas']}
};
const COMPRA_CATS=['Compra de carne bovina','Compra de carne suína','Compra de outras carnes'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const hoje=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const mesLbl=m=>{ const [y,mm]=m.split('-'); return MESES[+mm-1]+' de '+y; };
const mesCurto=m=>{ const [y,mm]=m.split('-'); return MESES[+mm-1].slice(0,3)+'/'+y.slice(2); };
const addMes=(m,n)=>{ let [y,mm]=m.split('-').map(Number); mm+=n; while(mm>12){mm-=12;y++;} while(mm<1){mm+=12;y--;} return y+'-'+String(mm).padStart(2,'0'); };
const dataBR=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
S.mes=hoje().slice(0,7);
S.lanc={embutidos:{},acougue:{}};
const KEY_L='fichas-chale-lancamentos-v1';
try{ const l=JSON.parse(localStorage.getItem(KEY_L)||'null'); if(l&&typeof l==='object') S.lanc={embutidos:l.embutidos||{},acougue:l.acougue||{}}; }catch(e){}
const lancMes=(neg,m)=>(S.lanc[neg]&&S.lanc[neg][m])||[];
const allLanc=neg=>Object.values(S.lanc[neg]||{}).flat();
const cashL=neg=>allLanc(neg).filter(x=>!x.reg);
const regMes=(neg,m)=>lancMes(neg,m).filter(x=>x.reg);
const cashDate=x=>{ if(x.status!=='previsto') return x.pago||x.data; const d=x.venc||x.data, t=hoje(); return d<t?t:d; };
const vencido=x=>x.status==='previsto'&&(x.venc||x.data)<hoje();
const findMes=id=>{ for(const [m,arr] of Object.entries(S.lanc[S.neg]||{})) if(arr.some(x=>x.id===id)) return m; return null; };
const lancT={}, lancDirty={};
function saveLanc(neg,m){
  const key='lanc-'+neg+'-'+m; lancDirty[key]=true; setSave('Salvando…','busy');
  clearTimeout(lancT[key]);
  lancT[key]=setTimeout(async()=>{
    try{ localStorage.setItem(KEY_L,JSON.stringify(S.lanc)); }catch(e){}
    if(!CLOUD.fs){ lancDirty[key]=false; setSave('Salvo neste aparelho'); return; }
    try{ await CLOUD.fs.collection('fichas').doc(key).set({tipo:'lanc',neg,mes:m,itens:JSON.parse(JSON.stringify(lancMes(neg,m))),atualizadoPor:CLOUD.email}); setSave('Salvo na nuvem'); }
    catch(e){ setSave('Não foi salvo','err'); toast(e&&e.code==='permission-denied'?'Seu e-mail não tem permissão para alterar os dados.':'Não foi possível salvar. Verifique a internet.'); }
    finally{ lancDirty[key]=false; }
  },400);
}
function addLanc(...items){ const ms=new Set(); for(const item of items){ const m=item.data.slice(0,7); S.lanc[S.neg]={...S.lanc[S.neg],[m]:[...lancMes(S.neg,m),item]}; ms.add(m); } ms.forEach(m=>saveLanc(S.neg,m)); }
function delLanc(id){ const it=allLanc(S.neg).find(x=>x.id===id); if(!it) return; const ids=new Set([id]); allLanc(S.neg).forEach(x=>{ if((it.par&&x.id===it.par)||x.par===id) ids.add(x.id); }); for(const [m,arr] of Object.entries(S.lanc[S.neg])){ if(arr.some(x=>ids.has(x.id))){ S.lanc[S.neg]={...S.lanc[S.neg],[m]:arr.filter(x=>!ids.has(x.id))}; saveLanc(S.neg,m); } } }
function toggleLanc(id){ const m=findMes(id); if(!m) return; S.lanc[S.neg]={...S.lanc[S.neg],[m]:lancMes(S.neg,m).map(x=>{ if(x.id!==id) return x; if(x.status==='previsto'){ const t=hoje(); return {...x,status:'realizado',pago:t<x.data?x.data:t}; } const y={...x,status:'previsto'}; delete y.pago; return y; })}; saveLanc(S.neg,m); }
const stLbl=x=>vencido(x)?'Vencido '+dataBR(x.venc||x.data):x.tipo==='entrada'?(x.status==='previsto'?'A receber':'Recebido'):(x.status==='previsto'?'A pagar':'Pago');
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):(+x.valor||0)),0);
const sinal=x=>x.tipo==='entrada'?+x.valor||0:-(+x.valor||0);
function caixaCfg(){ const c=S.config||{}; return {saldoInicial:+c.saldoInicial||0,inicio:c.inicioCaixa||'2026-06'}; }
function saldoAntes(m){ const {saldoInicial,inicio}=caixaCfg(); let s=saldoInicial; for(const x of cashL(S.neg)){ if(x.status==='previsto') continue; const cm=cashDate(x).slice(0,7); if(cm>=inicio&&cm<m) s+=sinal(x); } return s; }
function mesNav(){ return `<div class="mesnav"><button class="btn ghost" id="mPrev" aria-label="Mês anterior">‹</button><input class="in" type="month" id="mSel" value="${S.mes}"><button class="btn ghost" id="mNext" aria-label="Próximo mês">›</button></div>`; }
function bindMesNav(rerender){
  $('#mPrev')?.addEventListener('click',()=>{ S.mes=addMes(S.mes,-1); rerender(); });
  $('#mNext')?.addEventListener('click',()=>{ S.mes=addMes(S.mes,1); rerender(); });
  $('#mSel')?.addEventListener('change',e=>{ if(e.target.value){ S.mes=e.target.value; rerender(); } });
}
function defData(){ const t=hoje(); return t.slice(0,7)===S.mes?t:S.mes+'-01'; }
function bars(rows){ // rows: [{m,a,b}] a=entradas b=saidas
  const mx=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));
  return `<div class="bars">${rows.map(r=>`<div class="bcol"><div class="bpair"><span class="ba" style="height:${r.a/mx*100}%" title="Entradas ${money(r.a)}"></span><span class="bb" style="height:${r.b/mx*100}%" title="Saídas ${money(r.b)}"></span></div><small>${mesCurto(r.m)}</small></div>`).join('')}</div>`;
}
function lancForm(tipoFixo,cats,comKg){
  return `<form class="lform" id="lForm" autocomplete="off">
    <label class="field"><span class="lbl">Data</span><input class="in" type="date" id="lData" value="${defData()}" required></label>
    ${tipoFixo?'':`<label class="field"><span class="lbl">Tipo</span><select class="in" id="lTipo"><option value="saida">Saída</option><option value="entrada">Entrada</option></select></label>`}
    <label class="field"><span class="lbl">${tipoFixo==='entrada'?'Origem':'Categoria'}</span><select class="in" id="lCat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
    <label class="field grow"><span class="lbl">${tipoFixo==='saida'&&comKg?'Fornecedor':'Descrição'}</span><input class="in" id="lDesc" placeholder="${tipoFixo==='saida'&&comKg?'Ex.: João Luiz do Boi':'Ex.: vendas da semana'}"></label>
    ${comKg?`<label class="field"><span class="lbl">Kg</span><input class="in num" id="lKg" inputmode="decimal" placeholder="0"></label>`:''}
    <label class="field"><span class="lbl">Valor (R$)</span><input class="in num" id="lValor" inputmode="decimal" placeholder="0,00" required></label>
    ${comKg?`<label class="field"><span class="lbl">Vence em</span><input class="in" type="date" id="lVenc"></label>`:''}
    <label class="field"><span class="lbl">Situação</span><select class="in" id="lSt"><option value="realizado">${tipoFixo==='entrada'?'Recebido':tipoFixo==='saida'?'Pago':'Pago / Recebido'}</option><option value="previsto">${tipoFixo==='entrada'?'A receber':tipoFixo==='saida'?'A pagar':'A pagar / A receber'}</option></select></label>
    <button class="btn primary" type="submit">${ICON_PLUS} Lançar</button>
  </form>`;
}
function bindLancForm(tipoFixo,after){
  const f=$('#lForm'); if(!f) return;
  const tSel=$('#lTipo');
  if(tSel){ const fill=()=>{ $('#lCat').innerHTML=CATS[S.neg][tSel.value].map(c=>`<option>${esc(c)}</option>`).join(''); }; tSel.addEventListener('change',fill); }
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const valor=parseNum($('#lValor').value), data=$('#lData').value;
    if(!data){ toast('Informe a data.'); return; }
    if(!(valor>0)){ toast('Informe um valor maior que zero.'); $('#lValor').focus(); return; }
    const item={id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),data,tipo:tipoFixo||tSel.value,cat:$('#lCat').value,desc:$('#lDesc').value.trim(),valor,status:$('#lSt').value};
    const kg=$('#lKg'); if(kg&&kg.value.trim()) item.kg=parseNum(kg.value);
    const vc=$('#lVenc'); if(vc&&vc.value) item.venc=vc.value;
    if(item.status==='realizado') item.pago=data;
    if(tipoFixo==='saida'&&$('#lKg')){ const reg={...item,id:item.id+'r',reg:true}; delete reg.pago; delete reg.venc; item.par=reg.id; addLanc(reg,item); } else addLanc(item);
    if(data.slice(0,7)!==S.mes){ S.mes=data.slice(0,7); toast('Lançado em '+mesLbl(S.mes)); } else toast('Lançado');
    after(); setTimeout(()=>$('#lValor')?.focus(),0);
  });
}

  <tbody>${rows.map(x=>`<tr>
    <td>${dataBR(dt(x))}${opts.cash&&dt(x).slice(0,7)!==x.data.slice(0,7)?`<small class="faint" style="display:block;font-size:11px">compra ${dataBR(x.data)}</small>`:''}</td>
    ${opts.tipo?`<td style="text-align:left"><span class="pill ${x.tipo==='entrada'?'ok':'neutral'}">${x.tipo==='entrada'?'Entrada':'Saída'}</span></td>`:''}
    <td style="text-align:left">${esc(x.cat)}</td>
    <td class="name" style="text-align:left">${esc(x.desc||'')}</td>
    ${opts.kg?`<td>${x.kg?N2.format(x.kg):'–'}</td><td class="muted">${x.kg&&x.valor?money(x.valor/x.kg):'–'}</td><td class="${x.status==='previsto'&&x.venc&&x.venc<hoje()?'neg':'muted'}">${x.status==='previsto'?(x.venc?dataBR(x.venc):'–'):'pago '+dataBR(x.pago||x.data)}</td>`:''}
    <td class="b ${x.tipo==='entrada'?'pos':''}">${x.tipo==='entrada'?'':'− '}${money(+x.valor||0)}</td>

    ${S.canWrite?`<td style="width:44px"><button class="icon-btn" data-dl="${x.id}" aria-label="Excluir lançamento">${ICON_X}</button></td>`:''}</tr>`).join('')}</tbody></table>`;
}
function bindLancTable(m,after){
  $$('[data-tg]').forEach(b=>b.addEventListener('click',()=>{ toggleLanc(b.dataset.tg); after(); }));
  $$('[data-dl]').forEach(b=>armDelete(b,()=>{ delLanc(b.dataset.dl); toast('Lançamento excluído'); after(); }));
}

// ---------- RESULTADO (DRE gerencial) ----------
const RAT=['Funcionários','Transporte e combustível','Comissões','Energia','Sistema e internet','Manutenção e serviços','Impostos e taxas','Outras saídas'];
function dreMes(m,neg=S.neg){
  const R={venda:0,compra:0,tin:0,tout:0,emb:0,desp:0,inv:0,det:{}};
  for(const x of allLanc(neg)){
    if(x.reg){ if(x.data.slice(0,7)!==m) continue; if(x.tipo==='entrada') R.venda+=+x.valor||0; else R.compra+=+x.valor||0; continue; }
    const mm=(x.status==='previsto'?x.data:(x.pago||x.data)).slice(0,7); if(mm!==m) continue;
    const v=+x.valor||0;
    if(x.cat==='Transferência para Embutidos') R.tin+=v;
    else if(x.cat==='Carne do Açougue (transferência)') R.tout+=v;
    else if(x.tipo==='saida'&&RAT.includes(x.cat)){ R.desp+=v; R.det[x.cat]=(R.det[x.cat]||0)+v; }
    else if(x.tipo==='saida'&&x.cat==='Embalagens'&&neg==='acougue') R.emb+=v;
    else if(x.tipo==='saida'&&x.cat==='Investimentos e dívidas antigas') R.inv+=v;
  }
  R.res=R.venda+R.tin-R.compra-R.tout-R.emb-R.desp; R.pct=R.venda?R.res/R.venda:NaN; return R;
}
function vResultado(){
  const ms=[...Array(6)].map((_,i)=>addMes(S.mes,i-5)), D=ms.map(m=>dreMes(m)), tot=k=>sum(D,x=>x[k]);
  const ac=S.neg==='acougue';
  const linha=(lbl,k,sinal,cls='')=>`<tr class="${cls}"><td>${lbl}</td>${D.map(x=>`<td>${x[k]?(sinal<0?'− ':'')+money(x[k]):'<span class="faint">–</span>'}</td>`).join('')}<td class="b">${tot(k)?(sinal<0?'− ':'')+money(tot(k)):'–'}</td></tr>`;
  const det=RAT.filter(c=>D.some(x=>x.det[c])).map(c=>`<tr class="sub"><td>&nbsp;&nbsp;${c}</td>${D.map(x=>`<td>${x.det[c]?money(x.det[c]):'–'}</td>`).join('')}<td>${money(sum(D,x=>x.det[c]||0))}</td></tr>`).join('');
  const cur=D[5], prev=D[4];
  view.innerHTML=`<div class="phead"><div><span class="area fin">Financeiro</span><br><h1>Resultado · ${N().nome}</h1><p>Quanto ${ac?'o açougue':'a fábrica'} ganhou ou perdeu em cada mês, separado do outro negócio.</p></div>${mesNav()}</div>
  <div class="kpis">
    <div class="card kpi ${cur.res<0?'kbad':''}"><div class="l">Resultado de ${mesCurto(S.mes)}</div><div class="v ${cur.res<0?'neg':'pos'}">${money(cur.res)}</div><div class="h">${isFinite(cur.pct)?pct(cur.pct)+' das vendas':'–'}</div></div>
    <div class="card kpi"><div class="l">Mês anterior</div><div class="v ${prev.res<0?'neg':''}">${money(prev.res)}</div><div class="h">${isFinite(prev.pct)?pct(prev.pct)+' das vendas':'–'}</div></div>
    <div class="card kpi"><div class="l">Acumulado 6 meses</div><div class="v ${tot('res')<0?'neg':''}">${money(tot('res'))}</div><div class="h">${tot('venda')?pct(tot('res')/tot('venda'))+' das vendas':'–'}</div></div>
    <div class="card kpi"><div class="l">Dívidas antigas e investimentos</div><div class="v">${money(tot('inv'))}</div><div class="h">pagos nos 6 meses, fora do resultado</div></div>
  </div>
  <section class="card"><div class="card-h"><h2>Demonstrativo de resultado</h2><span class="sub">últimos 6 meses</span></div>
  <div class="tw"><table class="dre"><thead><tr><th>Descrição</th>${ms.map(m=>`<th>${mesCurto(m)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${linha('Vendas','venda',1)}
    ${ac?linha('(+) Carne repassada aos Embutidos','tin',1):''}
    ${linha(ac?'(−) Compras de carne':'(−) Compras de insumos e embalagens','compra',-1)}
    ${ac?'':linha('(−) Carne recebida do Açougue','tout',-1)}
    ${ac?linha('(−) Embalagens','emb',-1):''}
    ${linha('(−) Despesas compartilhadas (rateio)','desp',-1)}
    ${det}
    <tr class="res"><td>= Resultado</td>${D.map(x=>`<td class="${x.res<0?'neg':''}">${money(x.res)}</td>`).join('')}<td class="${tot('res')<0?'neg':''}">${money(tot('res'))}</td></tr>
    <tr class="sub"><td>Margem sobre vendas</td>${D.map(x=>`<td>${isFinite(x.pct)?pct(x.pct):'–'}</td>`).join('')}<td>${tot('venda')?pct(tot('res')/tot('venda')):'–'}</td></tr>
  </tbody></table></div></section>
  <p class="note" style="margin-top:12px">Vendas e compras pela data dos pedidos. Despesas pela data do pagamento ou, se ainda não pagas, pela data de lançamento. As despesas usadas pelos dois negócios são divididas pela participação de cada um no faturamento do mês.</p>`;
  bindMesNav(vResultado);
}
// ---------- VISÃO GERAL (os dois negócios + alertas) ----------
function negInfo(neg,m){
  const d=dreMes(m,neg), p=dreMes(addMes(m,-1),neg), t=hoje();
  const cash=cashL(neg);
  const venc=cash.filter(x=>x.status==='previsto'&&(x.venc||x.data)<t);
  const vPag=venc.filter(x=>x.tipo==='saida'), vRec=venc.filter(x=>x.tipo==='entrada');
  const aRec=cash.filter(x=>x.status==='previsto'&&x.tipo==='entrada'), aPag=cash.filter(x=>x.status==='previsto'&&x.tipo==='saida');
  const top=(arr)=>{ const g={}; arr.forEach(x=>{ const k=String(x.cat).startsWith('Churrascaria')?x.cat:(x.desc||x.cat).split(' · ')[0]; g[k]=(g[k]||0)+(+x.valor||0); }); return Object.entries(g).sort((a,b)=>b[1]-a[1]); };
  return {d,p,vPag,vRec,aRec,aPag,top};
}
function vGeral(){
  const m=S.mes, E=negInfo('embutidos',m), A=negInfo('acougue',m);
  const reg=(neg,mm)=>regMes(neg,mm).filter(x=>x.tipo==='saida'&&x.cat==='Compra de carne bovina'&&+x.valor>0);
  const pkg=a=>{ const kg=sum(a,x=>+x.kg||0); return kg?sum(a)/kg:NaN; };
  const boi=pkg(reg('acougue',m)), boiAnt=pkg(reg('acougue',addMes(m,-1)));
  const granja=sum(regMes('acougue',m).filter(x=>+x.valor===0),x=>+x.kg||0);
  const AL=[];
  for(const [neg,I] of [['acougue',A],['embutidos',E]]){
    const nome=NEG[neg].nome;
    if(isFinite(I.d.pct)&&I.d.pct<0.10) AL.push(['bad',`${nome}: margem de ${pct(I.d.pct)} em ${mesCurto(m)}`,`Resultado de ${money(I.d.res)}. ${neg==='acougue'?'Revise o preço de venda às churrascarias e o preço pago pela carne.':'Revise preços e receitas das linguiças com menor margem.'}`]);
    else if(isFinite(I.d.pct)&&isFinite(I.p.pct)&&I.p.pct-I.d.pct>0.05) AL.push(['warn',`${nome}: margem caiu de ${pct(I.p.pct)} para ${pct(I.d.pct)}`,'Compare compras e preços do mês com o anterior.']);
    const vp=sum(I.vPag); if(vp>0){ const t=I.top(I.vPag).slice(0,3).map(([k,v])=>`${k} ${money(v)}`).join(' · '); AL.push(['bad',`${nome}: ${money(vp)} em contas vencidas a pagar`,t]); }
    const devs=I.top(I.aRec).filter(([k,v])=>v>10000); devs.forEach(([k,v])=>AL.push(['warn',`${nome}: ${k} deve ${money(v)}`,'Combine uma data de acerto.']));
  }

  if(granja>0) AL.push(['info',`${N2.format(granja)} kg de porco da granja sem preço em ${mesCurto(m)}`,'Defina um preço de transferência da granja para o açougue.']);

      <div><dt>Mês anterior</dt><dd class="${I.p.res<0?'neg':''}">${money(I.p.res)} <small class="muted">${isFinite(I.p.pct)?pct(I.p.pct):''}</small></dd></div>
      <div><dt>Despesas rateadas</dt><dd>${money(I.d.desp)}</dd></div>

      <div><dt>A pagar</dt><dd class="${sum(I.vPag)?'neg':''}">${money(sum(I.aPag))}${sum(I.vPag)?` <small>(${money(sum(I.vPag))} vencido)</small>`:''}</dd></div>
    </div></div></section>`;
  const tot=A.d.res+E.d.res;
  view.innerHTML=`<div class="phead"><div><span class="area" style="background:var(--sunken);color:var(--muted)">Gestão</span><br><h1>Visão geral · Chalé de Ouro</h1><p>Os dois negócios lado a lado e o que precisa de atenção agora.</p></div>${mesNav()}</div>
  <div class="kpis k3">
    <div class="card kpi ${tot<0?'kbad':''}"><div class="l">Resultado dos dois negócios</div><div class="v ${tot<0?'neg':'pos'}">${money(tot)}</div><div class="h">${mesLbl(m)}</div></div>
    <div class="card kpi"><div class="l">Vendas totais</div><div class="v">${money(A.d.venda+E.d.venda)}</div><div class="h">açougue ${money(A.d.venda)} · embutidos ${money(E.d.venda)}</div></div>
    <div class="card kpi"><div class="l">Alertas</div><div class="v ${AL.some(a=>a[0]==='bad')?'neg':''}">${AL.length}</div><div class="h">${AL.filter(a=>a[0]==='bad').length} urgentes</div></div>
  </div>

    ${AL.length?`<div class="alerts">${AL.map(([k,t,d])=>`<div class="al ${k}"><span class="dot2"></span><div><b>${esc(t)}</b><p>${esc(d)}</p></div></div>`).join('')}</div>`:'<p class="note" style="padding:16px 18px;margin:0">Nenhum alerta neste mês.</p>'}
  </section>

  <p class="note" style="margin-top:12px">O resultado de cada negócio é o que ele gerou, e não o saldo do banco: granja, horta e empréstimos às churrascarias são pagos com o mesmo caixa e ficam fora.</p>`;
  bindMesNav(vGeral);
  $$('[data-ir]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); S.geral=false; S.neg=a.dataset.ir; S.view='resultado'; try{localStorage.setItem('fichas-neg',S.neg);}catch(e){} render(); window.scrollTo(0,0); }));

// ---------- AÇOUGUE: Resumo ----------
function resumoMes(m){
  const R=regMes(S.neg,m), comp=R.filter(x=>x.tipo==='saida'&&COMPRA_CATS.includes(x.cat)), vend=R.filter(x=>x.tipo==='entrada');
  const C=cashL(S.neg).filter(x=>x.status!=='previsto'&&cashDate(x).slice(0,7)===m);
  const rec=sum(C.filter(x=>x.tipo==='entrada'&&x.cat!=='Transferência para Embutidos')), pagoCarne=sum(C.filter(x=>x.tipo==='saida'&&COMPRA_CATS.includes(x.cat)));
  const kgP=sum(comp.filter(x=>+x.valor>0),x=>+x.kg||0);
  return {m,comp,c:sum(comp),kg:sum(comp,x=>+x.kg||0),kgP,v:sum(vend),rec,pagoCarne,transf:sum(C.filter(x=>x.cat==='Transferência para Embutidos'))};
}
function vResumo(){
  const r=resumoMes(S.mes), dif=r.v-r.c;
  const pk=cat=>{ const a=r.comp.filter(x=>x.cat===cat&&+x.valor>0); const kg=sum(a,x=>+x.kg||0); return kg?money(sum(a)/kg):'–'; };
  const hist=[...Array(6)].map((_,i)=>addMes(S.mes,i-5)).map(resumoMes);
  view.innerHTML=`<div class="phead"><div><span class="area prod">Produção</span><br><h1>Produção do mês · Açougue</h1><p>Quanto de carne entrou, a que preço, e quanto foi vendido no mês.</p></div>${mesNav()}</div>
  <div class="kpis">
    <div class="card kpi"><div class="l">Comprado de carne</div><div class="v">${money(r.c)}</div><div class="h">${N2.format(r.kg)} kg · média ${r.kgP?money(r.c/r.kgP):'–'}/kg</div></div>
    <div class="card kpi"><div class="l">Vendido</div><div class="v">${money(r.v)}</div><div class="h">pedidos de venda do mês</div></div>
    <div class="card kpi ${dif<0?'kbad':''}"><div class="l">Sobra (vendido − carne)</div><div class="v ${dif<0?'neg':''}">${money(dif)}</div><div class="h">${r.v?pct(dif/r.v)+' do vendido':'–'}</div></div>
    <div class="card kpi"><div class="l">Preço por kg</div><div class="v" style="font-size:20px;line-height:1.6">boi ${pk('Compra de carne bovina')}</div><div class="h">porco ${pk('Compra de carne suína')}</div></div>
  </div>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>Últimos 6 meses</h2><span class="sub"><i class="lg a"></i>Vendido <i class="lg b"></i>Comprado de carne</span></div><div class="card-b">${bars(hist.map(h=>({m:h.m,a:h.v,b:h.c})))}</div></section>
    <section class="card"><div class="card-h"><h2>Mês a mês</h2></div><div class="tw"><table>
      <thead><tr><th>Mês</th><th>Kg</th><th>Comprado</th><th>Vendido</th><th>Sobra</th><th>%</th></tr></thead>
      <tbody>${hist.slice().reverse().map(h=>`<tr><td>${mesCurto(h.m)}</td><td class="muted">${N2.format(h.kg)}</td><td>${money(h.c)}</td><td>${money(h.v)}</td><td class="b ${h.v-h.c<0?'neg':''}">${money(h.v-h.c)}</td><td class="${h.v-h.c<0?'neg':'muted'}">${h.v?pct((h.v-h.c)/h.v):'–'}</td></tr>`).join('')}</tbody></table></div></section>
  </div>
  <p class="note" style="margin-top:12px">Comprado e Vendido seguem a data dos pedidos. O dinheiro recebido e pago está na área Financeiro.</p>`;
  bindMesNav(vResumo);
}
// ---------- AÇOUGUE: Compras ----------
const COMPRA_EMB=['Tripa, temperos e insumos','Embalagens','Carne e matéria-prima'];
const compraCats=()=>S.neg==='acougue'?COMPRA_CATS:COMPRA_EMB;
function vCompras(){
  const L=regMes(S.neg,S.mes).filter(x=>x.tipo==='saida'&&compraCats().includes(x.cat));
  const tR=sum(L), tKg=sum(L,x=>+x.kg||0), tKgP=sum(L.filter(x=>+x.valor>0),x=>+x.kg||0), aPagar=sum(L.filter(x=>x.status==='previsto'));
  view.innerHTML=`<div class="phead"><div><span class="area prod">Produção</span><br><h1>${S.neg==='acougue'?'Compras de carne · Açougue':'Compras de insumos · Embutidos'}</h1><p>Registro de cada compra${S.neg==='acougue'?' de carcaça ou carne':' de tripa, temperos, queijo e embalagens'}, pela data do pedido. Ao lançar aqui, o valor também entra no Fluxo de caixa como pago ou a pagar.</p></div>${mesNav()}</div>
  <div class="kpis k3">
    <div class="card kpi"><div class="l">Total comprado</div><div class="v">${money(tR)}</div><div class="h">${L.length} compra${L.length===1?'':'s'} em ${mesLbl(S.mes)}</div></div>
    ${S.neg==='acougue'?`<div class="card kpi"><div class="l">Quilos comprados</div><div class="v">${N2.format(tKg)} kg</div><div class="h">média de ${tKgP?money(tR/tKgP):'–'} por kg pago${tKg>tKgP&&S.neg==='acougue'?` · ${N2.format(tKg-tKgP)} kg sem valor (granja)`:''}</div></div>`:`<div class="card kpi"><div class="l">Por tipo</div><div class="v" style="font-size:18px;line-height:1.6">Insumos ${money(sum(L.filter(x=>x.cat!=='Embalagens')))}</div><div class="h">Embalagens ${money(sum(L.filter(x=>x.cat==='Embalagens')))}</div></div>`}
    <div class="card kpi"><div class="l">Ainda a pagar</div><div class="v ${aPagar?'neg':''}">${money(aPagar)}</div><div class="h">segundo o Sischef</div></div>
  </div>
  ${S.canWrite?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Nova compra</h2></div><div class="card-b">${lancForm('saida',compraCats(),true)}</div></section>`:''}
  <section class="card"><div class="card-h"><h2>Compras de ${mesLbl(S.mes)}</h2></div><div class="tw">${lancTable(L,{kg:true,catLbl:S.neg==='acougue'?'Carne':'Tipo',descLbl:S.neg==='acougue'?'Fornecedor':'Item e fornecedor'})}</div></section>`;
  bindMesNav(vCompras); bindLancForm('saida',vCompras); bindLancTable(S.mes,vCompras);
}
// ---------- AÇOUGUE: Entradas ----------
function vEntradas(){
  const L=cashL(S.neg).filter(x=>x.tipo==='entrada'&&cashDate(x).slice(0,7)===S.mes);
  const tR=sum(L), aRec=sum(L.filter(x=>x.status==='previsto'));

  view.innerHTML=`<div class="phead"><div><span class="area fin">Financeiro</span><br><h1>Entradas · ${N().nome}</h1><p>Dinheiro que entrou (Recebido) e o que vence no mês (A receber), por origem.</p></div>${mesNav()}</div>
  <div class="kpis k3">

    <div class="card kpi"><div class="l">Já recebido</div><div class="v">${money(tR-aRec)}</div><div class="h">marcado "Recebido"</div></div>

  ${porOrigem.length?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Por origem</h2></div><div class="card-b"><div class="split">${porOrigem.map(o=>`<div><div class="lbl">${esc(o.c)}</div><b>${money(o.v)}</b><span class="muted"> · ${pct(o.v/tR)}</span><div class="sbar" style="height:6px;margin-top:6px"><span style="width:${o.v/tR*100}%;background:var(--ok)"></span></div></div>`).join('')}</div></div></section>`:''}
  ${S.canWrite?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Nova entrada</h2></div><div class="card-b">${lancForm('entrada',CATS[S.neg].entrada,false)}</div></section>`:''}
  <section class="card"><div class="card-h"><h2>Entradas de ${mesLbl(S.mes)}</h2></div><div class="tw">${lancTable(L,{catLbl:'Origem',cash:true})}</div></section>`;
  bindMesNav(vEntradas); bindLancForm('entrada',vEntradas); bindLancTable(S.mes,vEntradas);

// ---------- FLUXO DE CAIXA (cada negócio tem o seu) ----------
function vFluxo(){
  const m=S.mes, L=cashL(S.neg).filter(x=>cashDate(x).slice(0,7)===m), cats=CATS[S.neg];
  const R=L.filter(x=>x.status!=='previsto'), P=L.filter(x=>x.status==='previsto');
  const ini=saldoAntes(m), eR=sum(R.filter(x=>x.tipo==='entrada')), sR=sum(R.filter(x=>x.tipo==='saida'));
  const eP=sum(P.filter(x=>x.tipo==='entrada')), sP=sum(P.filter(x=>x.tipo==='saida'));
  const fim=ini+eR-sR, proj=fim+eP-sP;
  const sem=x=>Math.min(5,Math.ceil(+cashDate(x).slice(8,10)/7));
  const lastDay=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const semLbl=[1,2,3,4,5].map(i=>`${(i-1)*7+1}–${Math.min(i*7,lastDay)}`);
  const linha=(c,tipo)=>{ const a=L.filter(x=>x.tipo===tipo&&x.cat===c); const w=[1,2,3,4,5].map(i=>sum(a.filter(x=>x.status!=='previsto'&&sem(x)===i))); const r=sum(a.filter(x=>x.status!=='previsto')), p=sum(a.filter(x=>x.status==='previsto')); return {c,w,r,p}; };
  const LE=cats.entrada.map(c=>linha(c,'entrada')), LS=cats.saida.map(c=>linha(c,'saida'));
  const extraE=[...new Set(L.filter(x=>x.tipo==='entrada'&&!cats.entrada.includes(x.cat)).map(x=>x.cat))].map(c=>linha(c,'entrada'));
  const extraS=[...new Set(L.filter(x=>x.tipo==='saida'&&!cats.saida.includes(x.cat)).map(x=>x.cat))].map(c=>linha(c,'saida'));
  const ent=[...LE,...extraE], sai=[...LS,...extraS];
  const tot=arr=>({w:[0,1,2,3,4].map(i=>sum(arr,x=>x.w[i])),r:sum(arr,x=>x.r),p:sum(arr,x=>x.p)});
  const TE=tot(ent), TS=tot(sai);
  const fmt0=v=>v?money(v):'<span class="faint">–</span>';
  const row=(x,cls='')=>`<tr class="${cls}"><td class="name">${esc(x.c)}</td>${x.w.map(v=>`<td class="hsm">${fmt0(v)}</td>`).join('')}<td class="b">${fmt0(x.r)}</td><td class="muted">${fmt0(x.p)}</td></tr>`;
  const hist=[...Array(6)].map((_,i)=>addMes(m,i-5)).map(mm=>{ const l=cashL(S.neg).filter(x=>x.status!=='previsto'&&cashDate(x).slice(0,7)===mm); const a=sum(l.filter(x=>x.tipo==='entrada')), b=sum(l.filter(x=>x.tipo==='saida')); return {m:mm,a,b,fim:saldoAntes(mm)+a-b}; });
  const cfg=caixaCfg();
  view.innerHTML=`<div class="phead"><div><span class="area fin">Financeiro</span><br><h1>Fluxo de caixa · ${N().nome}</h1><p>Entradas e saídas de ${S.neg==='acougue'?'açougue':'embutidos'}, separadas do outro negócio. Cada valor entra no mês em que foi pago ou recebido. O que ainda vai vencer aparece em Previsto.</p></div>${mesNav()}</div>
  <div class="kpis">
    <div class="card kpi"><div class="l">Saldo inicial</div><div class="v ${ini<0?'neg':''}">${money(ini)}</div><div class="h">em 1º de ${MESES[+m.slice(5,7)-1]}</div></div>
    <div class="card kpi"><div class="l">Entradas</div><div class="v pos">${money(eR)}</div><div class="h">+ ${money(eP)} a receber</div></div>
    <div class="card kpi"><div class="l">Saídas</div><div class="v">${money(sR)}</div><div class="h">+ ${money(sP)} a pagar</div></div>
    <div class="card kpi ${fim<0?'kbad':''}"><div class="l">Saldo final</div><div class="v ${fim<0?'neg':''}">${money(fim)}</div><div class="h">projetado: <b class="${proj<0?'neg':''}">${money(proj)}</b></div></div>
  </div>
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Demonstrativo de ${mesLbl(m)}</h2><span class="sub">pela data em que o dinheiro saiu ou entrou</span></div>
  <div class="tw"><table class="dfc">
    <thead><tr><th>Descrição</th>${semLbl.map(s=>`<th class="hsm">Dias ${s}</th>`).join('')}<th>Realizado</th><th>Previsto</th></tr></thead>
    <tbody>
      <tr class="sec"><td>Saldo inicial</td>${semLbl.map(()=>'<td class="hsm"></td>').join('')}<td class="b">${money(ini)}</td><td></td></tr>
      <tr class="grp in"><td colspan="8">Entradas</td></tr>
      ${ent.map(x=>row(x)).join('')}
      <tr class="tot in"><td>Total de entradas</td>${TE.w.map(v=>`<td class="hsm">${fmt0(v)}</td>`).join('')}<td>${money(TE.r)}</td><td>${money(TE.p)}</td></tr>
      <tr class="grp out"><td colspan="8">Saídas</td></tr>
      ${sai.map(x=>row(x)).join('')}
      <tr class="tot out"><td>Total de saídas</td>${TS.w.map(v=>`<td class="hsm">${fmt0(v)}</td>`).join('')}<td>${money(TS.r)}</td><td>${money(TS.p)}</td></tr>
      <tr class="sec"><td>Resultado do mês (entradas − saídas)</td>${TE.w.map((v,i)=>`<td class="hsm ${v-TS.w[i]<0?'neg':''}">${fmt0(v-TS.w[i])}</td>`).join('')}<td class="b ${eR-sR<0?'neg':'pos'}">${money(eR-sR)}</td><td class="muted">${money(eP-sP)}</td></tr>
      <tr class="sec fim"><td>Saldo final</td>${semLbl.map(()=>'<td class="hsm"></td>').join('')}<td class="b ${fim<0?'neg':''}">${money(fim)}</td><td class="b ${proj<0?'neg':''}" title="Saldo final + a receber − a pagar">${money(proj)}</td></tr>
    </tbody></table></div></section>
  ${S.canWrite?`<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Novo lançamento</h2><span class="sub">qualquer entrada ou saída</span></div><div class="card-b">${lancForm(null,cats.saida,false)}</div></section>`:''}
  <section class="card" style="margin-bottom:16px"><div class="card-h"><h2>Lançamentos de ${mesLbl(m)}</h2><span class="sub">${L.length} lançamento${L.length===1?'':'s'} · toque na situação para mudar</span></div><div class="tw">${lancTable(L,{tipo:true,cash:true})}</div></section>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>Últimos 6 meses</h2><span class="sub"><i class="lg a"></i>Entradas <i class="lg b"></i>Saídas</span></div><div class="card-b">${bars(hist)}</div></section>
    <section class="card"><div class="card-h"><h2>Saldo mês a mês</h2></div><div class="tw"><table><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Resultado</th><th>Saldo final</th></tr></thead>
      <tbody>${hist.slice().reverse().map(h=>`<tr><td>${mesCurto(h.m)}</td><td class="pos">${money(h.a)}</td><td>${money(h.b)}</td><td class="${h.a-h.b<0?'neg':''}">${money(h.a-h.b)}</td><td class="b ${h.fim<0?'neg':''}">${money(h.fim)}</td></tr>`).join('')}</tbody></table></div></section>
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2>Caixa inicial</h2></div><div class="card-b"><div class="grid g2">
    <label class="field"><span class="lbl">Saldo em caixa no início do controle (R$)</span>${numIn('cxSaldo',cfg.saldoInicial)}</label>
    <label class="field"><span class="lbl">Mês de início do controle</span><input class="in" type="month" id="cxIni" value="${cfg.inicio}"${dis()}></label>
  </div><p class="note" style="margin:10px 0 0">Coloque quanto ${S.neg==='acougue'?'o açougue':'a fábrica'} tinha em caixa e banco no primeiro dia do mês de início. O saldo de cada mês é calculado a partir daí.</p></div></section>`;
  bindMesNav(vFluxo); bindLancForm(null,vFluxo); bindLancTable(m,vFluxo);
  $('#cxSaldo')?.addEventListener('input',e=>{ S.config={...S.config,saldoInicial:parseNum(e.target.value)}; save(); });

      S.vend=V; try{ localStorage.setItem(KEY_V,JSON.stringify(S.vend)); }catch(e){}
      if(S.loaded&&['inicio','gerencial','metas','vendas','produtos','comvend','bonus','comgeral','painel','centros','comparar','relatorios','divisao'].includes(S.view)&&!focusedInput()) render();
    },err=>{ if(err&&err.code!=='permission-denied') toast('Erro ao carregar as vendas. Recarregue a página.'); });
    unsub=ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||cloudDirty) return;
      if(!snap.exists){ const ok=hasData(saved); loadState(ok?saved:{negocios:{}}); S.loaded=true; if(ok) save(); else setSave('Nuvem vazia','busy'); render(); return; }
      const d=snap.data(); if(!validState(d)) return;
      S.loaded=true; setSave('Salvo na nuvem');
      if(focusedInput()){ pendingData=d; return; }
      loadState(d); render();
    },err=>{
      if(err&&err.code==='permission-denied'){ S.loaded=true; view.innerHTML=`<div class="card empty"><h2>Acesso não liberado</h2><p>O e-mail ${esc(CLOUD.email)} entrou, mas ainda não tem permissão para ver as fichas. Peça para a gestão liberar este e-mail.</p></div>`; setSave('Sem permissão','err'); }
      else { toast('Erro de conexão com a nuvem. Recarregue a página.'); setSave('Sem conexão','err'); }
    });
  });
}
})();
</script>
</body>
</html>
